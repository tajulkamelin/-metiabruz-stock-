<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dilkhus Fashion Stock</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --primary: #e91e63; 
  --danger: #ff453a;
  --success: #32d74b;
  --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

/* --- Mobile UI --- */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 15px 16px 12px; padding-top: max(15px, env(safe-area-inset-top));
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.brand-box { display: flex; align-items: center; gap: 12px; }
.brand-logo { height: 45px; width: 45px; border-radius: 50%; border: 2px solid var(--primary); background: white; object-fit: contain; padding: 2px; }
.brand-name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
#statusIndicator { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); padding: 12px 4px; border-radius: 16px; text-align: center; }
.summary-card label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
.summary-card .value { font-size: 18px; font-weight: 700; }

.controls-area { padding: 16px; }
.search-wrapper { background: var(--card-elevated); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
.search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 17px; outline: none; }

.inventory-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.item-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid var(--border); }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.design-badge { background: var(--primary); color: white; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 18px; }

.grid-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.label-style { font-size: 14px; font-weight: 700; color: var(--text-secondary); }

.qty-input { background: var(--card-elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 4px; border-radius: 12px; font-size: 15px; font-weight: 700; text-align: center; width: 100%; appearance: none; }
.remain-pill { background: rgba(50, 215, 75, 0.15); color: var(--success); padding: 10px; border-radius: 12px; font-weight: 800; text-align: center; font-size: 15px; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 16px calc(15px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; border-top: 1px solid var(--border); z-index: 100; }
.btn-main { background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; }
.btn-icon { background: var(--card-elevated); color: var(--text); border: none; border-radius: 16px; padding: 12px; font-size: 20px; cursor: pointer; }

/* --- Modal --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: flex-end; opacity: 0; transition: 0.2s; }
.modal.active { display: flex; opacity: 1; }
.modal-content { background: var(--card); width: 100%; border-radius: 32px 32px 0 0; padding: 25px; padding-bottom: max(35px, env(safe-area-inset-bottom)); animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* --- Print Layout --- */
#printArea { display: none; }
@media print {
  .header-container, .controls-area, .bottom-nav, .inventory-list, .modal { display: none !important; }
  body { background: white; color: black; padding: 0; }
  #printArea { display: block !important; padding: 20px; }
  .print-header { text-align: center; margin-bottom: 20px; }
  .print-logo { height: 100px; margin-bottom: 10px; object-fit: contain; }
  .print-summary { display: flex; justify-content: space-around; margin-bottom: 20px; border: 2px solid #000; padding: 15px; font-weight: bold; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 10px 4px; text-align: center; font-size: 12px; color: black; }
  th { background-color: #f2f2f2; }
}
</style>
</head>
<body>

<div id="printArea">
  <div class="print-header">
    <img id="logoPrint" src="" class="print-logo" alt="Dilkhus Fashion">
    <h1 style="font-size: 26px; margin: 5px 0;">Stock Inventory Report</h1>
    <p id="printDate" style="font-size: 12px; color: #666;"></p>
  </div>
  <div class="print-summary">
    <span>TOTAL STOCK: <span id="pTotalStock">0</span></span>
    <span>TOTAL SOLD: <span id="pTotalSold">0</span></span>
    <span>REMAINING: <span id="pTotalRem">0</span></span>
    <span>DESIGNS: <span id="pDesignCount">0</span></span>
  </div>
  <table>
    <thead>
      <tr>
        <th rowspan="2">Design No</th>
        <th colspan="4">Stock</th>
        <th colspan="4">Sold</th>
        <th colspan="4">Remaining</th>
        <th rowspan="2">Total</th>
      </tr>
      <tr>
        <th>22×32</th><th>34×36</th><th>16×18</th><th>26×30</th>
        <th>22×32</th><th>34×36</th><th>16×18</th><th>26×30</th>
        <th>22×32</th><th>34×36</th><th>16×18</th><th>26×30</th>
      </tr>
    </thead>
    <tbody id="printTableBody"></tbody>
  </table>
</div>

<div class="header-container">
  <div class="top-bar">
    <div class="brand-box">
        <img id="logoApp" src="" class="brand-logo" alt="Logo">
        <span class="brand-name">Dilkhus</span>
    </div>
    <div id="statusIndicator">System Ready</div>
  </div>
  <div class="summary">
    <div class="summary-card"><label>Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Balance</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
    <div class="summary-card"><label>Items</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-wrapper">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design Number..." onkeyup="render()">
    <select id="sortSelect" onchange="haptic(); setSort(this.value)" style="background:none; border:none; color:var(--primary); font-weight:800; font-size:14px;">
      <option value="recent">Recent</option>
      <option value="asc">A→Z</option>
      <option value="desc">Z→A</option>
    </select>
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="bottom-nav">
  <button class="btn-main" onclick="haptic(); openAdd()">+ ADD NEW</button>
  <button class="btn-icon" onclick="haptic(); fetchData()">🔄</button>
  <button class="btn-icon" onclick="haptic(); window.print()">🖨️</button>
  <button class="btn-icon" onclick="haptic(); toggleSelect()">🛠️</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <div style="width:50px;height:5px;background:rgba(255,255,255,0.2);margin:0 auto 20px auto;border-radius:10px;"></div>
    <h3 style="margin-bottom:20px; font-size:24px;">New Entry</h3>
    <input type="text" id="manualDesignInput" class="qty-input" style="text-align:left; padding:18px; font-size:18px; margin-bottom:15px;" placeholder="Design Number (e.g. 5001)">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <select id="s0" class="qty-input"></select>
        <select id="s1" class="qty-input"></select>
        <select id="s2" class="qty-input"></select>
        <select id="s3" class="qty-input"></select>
    </div>
    <button class="btn-main" style="width:100%; padding:20px; margin-top:25px; font-size:18px;" onclick="haptic(); handleAdd()">Save Design</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

Dilkhus Fashion Stock Pro (Final Fixed Version)
=======================================================

Esta versão é baseada no código atualizado para o sistema de gestão de estoque da **Dilkhus Fashion**. Ela inclui a correção da imagem do logotipo corrompida, integrando uma string Base64 completa diretamente no código para garantir o carregamento offline e estabilidade.

### Funcionalidades Integradas:
* **Logotipo Premium**: O logotipo da Dilkhus Fashion está incorporado na interface do aplicativo e no cabeçalho do relatório de impressão.
* **Feedback Háptico**: Vibrações curtas ao interagir com botões e campos, proporcionando uma experiência tátil premium em dispositivos móveis.
* **Interface iOS Estilizada**: Layout escuro com cartões elevados, cabeçalho com efeito de vidro fosco e navegação inferior otimizada para uso com uma mão.
* **Gestão de Estoque Completa**: Suporte para entrada de novos designs, atualização de estoque e vendas por tamanho, e cálculos automáticos de saldo.
* **Relatório de Impressão Profissional**: Gera uma tabela estruturada em preto e branco, ideal para documentação física ou digital.

### Implementação:
Para utilizar este sistema, copie o código HTML fornecido e substitua o conteúdo do seu arquivo no GitHub. O sistema utiliza o Supabase para sincronização em nuvem e o armazenamento local do navegador para funcionamento offline.
