<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dilkhus Fashion Stock</title>
  
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --primary: #e91e63; 
      --text: #ffffff;
      --success: #32d74b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

    .header {
      sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
      padding: 20px 16px; border-bottom: 1px solid var(--border);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .brand-logo { height: 40px; width: 40px; border-radius: 50%; background: #fff; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat-card { background: var(--card); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
    .stat-card label { font-size: 10px; color: #8e8e93; display: block; }
    .stat-card span { font-size: 16px; font-weight: bold; }

    .inventory-list { padding: 16px; }
    .item-card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    
    .grid-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 10px; align-items: center; }
    .input-box { background: #2c2c2e; border: none; color: #fff; padding: 8px; border-radius: 8px; text-align: center; width: 100%; }

    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1c1c1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
    .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
    .btn-main { background: var(--primary); color: #fff; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand-box">
    <div class="brand-logo"></div>
    <h2 class="brand-name">Dilkhus Fashion</h2>
  </div>
  <div class="summary-grid">
    <div class="stat-card"><label>STOCK</label><span id="totalStock">0</span></div>
    <div class="stat-card"><label>SOLD</label><span id="totalSold">0</span></div>
    <div class="stat-card"><label>BAL</label><span id="totalBal">0</span></div>
    <div class="stat-card"><label>ITEMS</label><span id="itemCount">0</span></div>
  </div>
</div>

<div class="inventory-list" id="inventoryList">
  </div>

<div class="bottom-nav">
  <button class="btn btn-main" onclick="openModal()">+ ADD DESIGN</button>
  <button class="btn" style="background:#2c2c2e; color:white;" onclick="syncData()">🔄 SYNC</button>
</div>

<div class="modal" id="addModal">
  <div class="modal-content">
    <h3 style="margin-bottom:15px">New Design Entry</h3>
    <input type="text" id="newDesignName" class="input-box" placeholder="Design Number" style="text-align:left; margin-bottom:15px; padding:12px;">
    <p style="font-size:12px; color:#8e8e93; margin-bottom:8px;">Initial Stock per Size:</p>
    <div class="grid-row">
      <input type="number" id="s1" class="input-box" placeholder="22x32">
      <input type="number" id="s2" class="input-box" placeholder="34x36">
      <input type="number" id="s3" class="input-box" placeholder="16x18">
      <input type="number" id="s4" class="input-box" placeholder="26x30">
    </div>
    <button class="btn btn-main" style="width:100%; margin-top:20px;" onclick="saveNewDesign()">SAVE TO CLOUD</button>
    <button class="btn" style="width:100%; margin-top:10px; background:transparent; color:#8e8e93;" onclick="closeModal()">CANCEL</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // --- CONFIGURATION ---
  const SB_URL = "YOUR_SUPABASE_URL";
  const SB_KEY = "YOUR_SUPABASE_KEY";
  const supabase = exports.supabaseJs.createClient(SB_URL, SB_KEY);

  let inventory = [];

  // --- HAPTIC FEEDBACK ---
  function haptic() {
    if (window.navigator.vibrate) window.navigator.vibrate(10);
  }

  // --- CORE FUNCTIONS ---
  async function syncData() {
    haptic();
    const { data, error } = await supabase.from('stock').select('*');
    if (!error) {
      inventory = data;
      render();
    }
  }

  function render() {
    const list = document.getElementById('inventoryList');
    list.innerHTML = '';
    
    let ts = 0, tso = 0, tb = 0;

    inventory.forEach((item, index) => {
      const rowTotalStock = item.s1 + item.s2 + item.s3 + item.s4;
      const rowTotalSold = (item.sl1 || 0) + (item.sl2 || 0) + (item.sl3 || 0) + (item.sl4 || 0);
      const remain = rowTotalStock - rowTotalSold;

      ts += rowTotalStock; tso += rowTotalSold; tb += remain;

      list.innerHTML += `
        <div class="item-card">
          <div style="display:flex; justify-content:space-between; align-items:center">
            <span style="background:var(--primary); padding:4px 12px; border-radius:8px; font-weight:bold;">${item.design_no}</span>
            <span style="color:var(--success); font-weight:bold;">Bal: ${remain}</span>
          </div>
          <div class="grid-row">
            <div style="font-size:10px; color:#8e8e93">SIZE</div>
            <div style="font-size:10px; color:#8e8e93">STOCK</div>
            <div style="font-size:10px; color:#8e8e93">SOLD</div>
            <div style="font-size:10px; color:#8e8e93">REMAIN</div>
          </div>
          ${renderSizeRow(item, index, 's1', 'sl1', '22x32')}
          ${renderSizeRow(item, index, 's2', 'sl2', '34x36')}
          ${renderSizeRow(item, index, 's3', 'sl3', '16x18')}
          ${renderSizeRow(item, index, 's4', 'sl4', '26x30')}
        </div>
      `;
    });

    document.getElementById('totalStock').innerText = ts;
    document.getElementById('totalSold').innerText = tso;
    document.getElementById('totalBal').innerText = tb;
    document.getElementById('itemCount').innerText = inventory.length;
  }

  function renderSizeRow(item, index, stockKey, soldKey, label) {
    const rem = item[stockKey] - (item[soldKey] || 0);
    return `
      <div class="grid-row">
        <span style="font-size:12px">${label}</span>
        <input type="number" class="input-box" value="${item[stockKey]}" onchange="updateVal(${index}, '${stockKey}', this.value)">
        <input type="number" class="input-box" value="${item[soldKey] || 0}" onchange="updateVal(${index}, '${soldKey}', this.value)">
        <span style="text-align:center; font-weight:bold">${rem}</span>
      </div>
    `;
  }

  async function updateVal(index, key, val) {
    haptic();
    inventory[index][key] = parseInt(val) || 0;
    const item = inventory[index];
    await supabase.from('stock').update({ [key]: inventory[index][key] }).eq('id', item.id);
    render();
  }

  function openModal() { haptic(); document.getElementById('addModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('addModal').style.display = 'none'; }

  async function saveNewDesign() {
    const name = document.getElementById('newDesignName').value;
    if(!name) return alert("Enter Design No");

    const newEntry = {
      design_no: name,
      s1: parseInt(document.getElementById('s1').value) || 0,
      s2: parseInt(document.getElementById('s2').value) || 0,
      s3: parseInt(document.getElementById('s3').value) || 0,
      s4: parseInt(document.getElementById('s4').value) || 0,
      sl1: 0, sl2: 0, sl3: 0, sl4: 0
    };

    const { error } = await supabase.from('stock').insert([newEntry]);
    if(!error) {
      syncData();
      closeModal();
    }
  }

  // Initial Load
  syncData();
</script>

</body>
</html>
