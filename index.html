<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --warning: #ff9f0a;
  --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 120px; }

/* --- Mobile UI Styles --- */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 20px 16px 12px; padding-top: max(20px, env(safe-area-inset-top));
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
h2 { font-size: 24px; font-weight: 800; }

.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.btn-action { padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-add { background: var(--primary); color: white; }
.btn-sell { background: var(--warning); color: black; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); padding: 10px 4px; border-radius: 10px; text-align: center; }
.summary-card label { font-size: 8px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; display: block; }
.summary-card .value { font-size: 15px; font-weight: 700; }

.controls-area { padding: 16px; }
.search-wrapper { background: var(--card-elevated); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; }
.search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; }

.inventory-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.item-card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border); }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.design-badge { background: var(--card-elevated); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 16px; border: 1px solid var(--primary); }

.grid-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.label-style { font-size: 13px; font-weight: 600; color: var(--text-secondary); }

.qty-input { background: var(--card-elevated); border: 1px solid var(--border); color: var(--text); padding: 8px 4px; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: center; width: 100%; }
.remain-pill { background: rgba(50, 215, 75, 0.1); color: var(--success); padding: 6px; border-radius: 8px; font-weight: 700; text-align: center; font-size: 14px; }

/* --- Modal --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; opacity: 0; transition: 0.2s; }
.modal.active { display: flex; opacity: 1; }
.modal-content { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 24px; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* --- Print --- */
#printArea { display: none; }
@media print {
  .header-container, .controls-area, .bottom-nav, .inventory-list, .modal { display: none !important; }
  #printArea { display: block !important; }
}
</style>
</head>
<body>

<div class="header-container">
  <div class="top-bar">
    <h2>📦 Stock Manager</h2>
    <div id="statusIndicator">Online</div>
  </div>

  <div class="quick-actions">
    <button class="btn-action btn-add" onclick="openModal('add')">➕ ADD STOCK</button>
    <button class="btn-action btn-sell" onclick="openModal('sell')">➖ SELL OPTION</button>
  </div>

  <div class="summary">
    <div class="summary-card"><label>Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Left</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
    <div class="summary-card"><label>Items</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-wrapper">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design..." onkeyup="render()">
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="modal" id="entryModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom:15px">Entry</h3>
    <input type="text" id="designInput" list="designSuggestions" class="qty-input" style="text-align:left; padding:14px; font-size:16px; margin-bottom:15px;" placeholder="Design Number..." onchange="handleDesignChange(this.value)">
    <datalist id="designSuggestions"></datalist>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;" id="inputGrid">
        <select id="m0" class="qty-input"></select>
        <select id="m1" class="qty-input"></select>
        <select id="m2" class="qty-input"></select>
        <select id="m3" class="qty-input"></select>
    </div>
    <button id="modalSubmit" class="btn-action btn-add" style="width:100%; margin-top:20px" onclick="processEntry()">Confirm</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache')||'[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue')||'[]');
let mode = 'add'; // 'add' or 'sell'
const sizes=["22x32","34x36","16x18","26x30"];

function getOpts(selected, prefix = "") {
    let h = '';
    for(let i=0; i<=100; i++) h += `<option value="${i}" ${i==selected?'selected':''}>${prefix}${i}</option>`;
    return h;
}

function updateSuggestions() {
    document.getElementById('designSuggestions').innerHTML = inventory.map(it => `<option value="${it.design}">`).join('');
}

function openModal(m) {
    mode = m;
    const title = document.getElementById('modalTitle');
    const btn = document.getElementById('modalSubmit');
    const input = document.getElementById('designInput');
    
    input.value = '';
    title.innerText = mode === 'add' ? "Add New Stock" : "Sell Item (Decrease)";
    btn.innerText = mode === 'add' ? "Save Stock" : "Deduct Stock";
    btn.className = mode === 'add' ? "btn-action btn-add" : "btn-action btn-sell";
    
    sizes.forEach((s, i) => document.getElementById(`m${i}`).innerHTML = getOpts(0, s + ": "));
    updateSuggestions();
    entryModal.classList.add('active');
}

function closeModal() { entryModal.classList.remove('active'); }

function handleDesignChange(val) {
    const existing = inventory.find(it => it.design.toLowerCase() === val.trim().toLowerCase());
    if (existing && mode === 'add') {
        if(confirm("Design exists. Add more to current stock?")) {
            sizes.forEach((s, i) => document.getElementById(`m${i}`).innerHTML = getOpts(0, s + " + "));
        }
    }
}

function processEntry() {
    const dNo = document.getElementById('designInput').value.trim();
    if(!dNo) return alert("Enter Design Number");
    
    const inputQtys = [+m0.value, +m1.value, +m2.value, +m3.value];
    let target = inventory.find(it => it.design.toLowerCase() === dNo.toLowerCase());

    if (mode === 'add') {
        if (target) {
            target.stock = target.stock.map((v, i) => v + inputQtys[i]);
            syncQueue.push({type:'update', data: target});
        } else {
            const newItem = { id: crypto.randomUUID(), design: dNo, stock: inputQtys, sold: [0,0,0,0], created_at: new Date().toISOString() };
            inventory.unshift(newItem);
            syncQueue.push({type:'add', item: newItem});
        }
    } else {
        if (!target) return alert("Design not found in stock!");
        // Sell decreases stock OR increases "sold" count? 
        // Based on your request "decrease stock from add stock", we update target.sold to reflect deductions
        target.sold = target.sold.map((v, i) => v + inputQtys[i]);
        syncQueue.push({type:'update', data: target});
    }

    render();
    syncNow();
    closeModal();
}

function upd(id, idx, val, field) {
    const it = inventory.find(x => x.id === id);
    if(it) { it[field][idx] = +val; syncQueue.push({type:'update', data: it}); render(); syncNow(); }
}

function render() {
    const term = searchInput.value.toLowerCase();
    inventoryList.innerHTML = '';
    let ts=0, td=0;

    inventory.filter(it => it.design.toLowerCase().includes(term)).forEach(item => {
        let rows = '';
        item.stock.forEach((sVal, i) => {
            const rem = sVal - item.sold[i];
            ts += sVal; td += item.sold[i];
            rows += `
            <div class="grid-row">
                <div class="label-style">${sizes[i]}</div>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'stock')">${getOpts(sVal)}</select>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'sold')">${getOpts(item.sold[i])}</select>
                <div class="remain-pill">${rem}</div>
            </div>`;
        });

        inventoryList.innerHTML += `
        <div class="item-card">
            <div class="item-header"><span class="design-badge"># ${item.design}</span><button onclick="del('${item.id}')" style="color:var(--danger); background:none; border:none; font-weight:700;">DEL</button></div>
            ${rows}
        </div>`;
    });

    totalStock.innerText = ts; totalSold.innerText = td; totalRemaining.innerText = ts-td;
    designCount.innerText = inventory.length;
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
}

function del(id) { if(confirm("Delete?")) { inventory = inventory.filter(x => x.id !== id); syncQueue.push({type:'delete', id}); render(); syncNow(); } }

async function syncNow() {
    if(!navigator.onLine || syncQueue.length === 0) return;
    statusIndicator.innerText = "Syncing...";
    const q = [...syncQueue]; syncQueue = [];
    for(const t of q) {
        try {
            if(t.type==='add') await supabaseClient.from('inventory').insert(t.item);
            if(t.type==='update') await supabaseClient.from('inventory').update({stock: t.data.stock, sold: t.data.sold}).eq('id', t.data.id);
            if(t.type==='delete') await supabaseClient.from('inventory').delete().eq('id', t.id);
        } catch(e) {}
    }
    statusIndicator.innerText = "Online";
}

async function fetchData() {
    const {data} = await supabaseClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(data) { inventory = data; render(); }
}

fetchData();
setInterval(syncNow, 10000);
</script>
</body>
</html>
