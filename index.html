<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metiabruz Stock">
<title>Metiabruz Stock Tracker</title>

<style>
:root{
  --color-bg-primary:#0f172a;
  --color-bg-secondary:#1e293b;
  --color-text-primary:#f1f5f9;
  --color-text-secondary:#cbd5e1;
  --color-border:#334155;
  --color-stock:#1e3a8a;
  --color-sold:#92400e;
  --color-remaining:#064e3b;
  --color-primary:#0ea5e9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
  padding:12px;
  padding-bottom:100px;
}
.header{
  background:var(--color-bg-secondary);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}
.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:12px;
}
.summary-card{
  background:var(--color-bg-primary);
  padding:12px;
  border-radius:10px;
  border:1px solid var(--color-border);
}
.summary-card label{
  font-size:11px;
  color:var(--color-text-secondary);
}
.summary-card .value{
  font-size:22px;
  font-weight:700;
}
.search-box{
  background:var(--color-bg-secondary);
  padding:12px;
  border-radius:16px;
  margin-bottom:16px;
}
.search-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--color-border);
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
}
.inventory-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.item-card{
  background:var(--color-bg-secondary);
  border-radius:16px;
  padding:14px;
}
.item-header{
  font-size:18px;
  font-weight:600;
  margin-bottom:10px;
  border-bottom:1px solid var(--color-border);
}
.size-row{
  display:grid;
  grid-template-columns:72px 1fr 1fr 1fr;
  gap:6px;
  margin-bottom:6px;
}
input{
  padding:8px;
  border-radius:8px;
  border:1px solid var(--color-border);
  text-align:center;
}
.input-remaining{
  background:var(--color-remaining);
}
.action-buttons{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--color-bg-secondary);
  padding:10px;
  display:flex;
  gap:8px;
}
.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-secondary{background:var(--color-bg-primary);color:#fff}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  z-index:200;
}
.modal.active{display:flex}
.modal-content{
  background:var(--color-bg-secondary);
  padding:16px;
  border-radius:16px;
  width:100%;
  max-width:420px;
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.close-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
}
.form-group{margin-bottom:12px}
.form-group label{font-size:13px;color:var(--color-text-secondary)}
.form-group input{width:100%}
.size-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
</style>
</head>

<body>

<div class="header">
  <h2>📦 Metiabruz Stock</h2>
  <div class="summary">
    <div class="summary-card"><label>Total Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Remaining</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="search-box">
  <input id="searchInput" placeholder="Search by Design No...">
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="action-buttons">
  <button class="btn btn-secondary" onclick="openAddModal()">➕ Add</button>
  <button class="btn btn-secondary" onclick="window.print()">🖨 Print</button>
  <button class="btn btn-secondary" onclick="exportData()">📤 Export</button>
  <button class="btn btn-primary" onclick="loadFromSupabase()">💾 Save</button>
</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <div class="modal-header">
      <strong>Add Design</strong>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label>Design Number</label>
      <input id="designInput">
    </div>

    <div class="form-group">
      <label>Stock Quantities</label>
      <div class="size-inputs">
        <input id="s0" placeholder="22x32" type="number">
        <input id="s1" placeholder="34x36" type="number">
        <input id="s2" placeholder="16x18" type="number">
        <input id="s3" placeholder="26x30" type="number">
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveDesign()">Save</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  'https://yhlfqpiwevsehlgbhxtk.supabase.co',
  'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'
);

const inventory=[];
const sizes=["22x32","34x36","16x18","26x30"];

function openAddModal(){addModal.classList.add('active')}
function closeModal(){addModal.classList.remove('active')}

async function saveDesign(){
  const design=designInput.value.trim();
  if(!design)return alert("Enter design number");
  const stock=[+s0.value||0,+s1.value||0,+s2.value||0,+s3.value||0];
  const {error}=await supabaseClient.from('inventory').insert({design,stock,sold:[0,0,0,0]});
  if(error)return alert(error.message);
  closeModal();
}

async function loadFromSupabase(){
  const {data,error}=await supabaseClient.from('inventory').select('*').order('design');
  if(error)return alert(error.message);
  inventory.length=0;
  inventory.push(...data);
  renderInventory();
}

function renderInventory(filter=''){
  inventoryList.innerHTML='';
  let ts=0,td=0;
  inventory.forEach(item=>{
    ts+=item.stock.reduce((a,b)=>a+b,0);
    td+=item.sold.reduce((a,b)=>a+b,0);
    const card=document.createElement('div');
    card.className='item-card';
    card.innerHTML=`
      <div class="item-header">${item.design}</div>
      ${sizes.map((s,i)=>`
        <div class="size-row">
          <div>${s}</div>
          <input value="${item.stock[i]}" type="number" onchange="updateStock('${item.id}',${i},this.value)">
          <input value="${item.sold[i]}" type="number" onchange="updateSold('${item.id}',${i},this.value)">
          <input class="input-remaining" value="${item.stock[i]-item.sold[i]}" disabled>
        </div>`).join('')}
    `;
    inventoryList.appendChild(card);
  });
  totalStock.textContent=ts;
  totalSold.textContent=td;
  totalRemaining.textContent=ts-td;
  designCount.textContent=inventory.length;
}

async function updateStock(id,i,v){
  const item=inventory.find(x=>x.id===id);
  const stock=[...item.stock];
  stock[i]=+v||0;
  await supabaseClient.from('inventory').update({stock}).eq('id',id);
}
async function updateSold(id,i,v){
  const item=inventory.find(x=>x.id===id);
  const sold=[...item.sold];
  sold[i]=Math.min(+v||0,item.stock[i]);
  await supabaseClient.from('inventory').update({sold}).eq('id',id);
}

function exportData(){
  alert("Export feature can be added next (CSV / Excel)");
}

supabaseClient.channel('rt')
  .on('postgres_changes',{event:'*',schema:'public',table:'inventory'},loadFromSupabase)
  .subscribe();

searchInput.addEventListener('input',e=>renderInventory(e.target.value));
loadFromSupabase();
</script>

</body>
</html>
