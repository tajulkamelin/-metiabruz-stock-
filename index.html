<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metiabruz Stock">
<title>Metiabruz Stock Tracker</title>

<style>
/* ===== ORIGINAL UI CSS (UNCHANGED) ===== */
:root {
  --color-bg-primary:#0f172a;
  --color-bg-secondary:#1e293b;
  --color-text-primary:#f1f5f9;
  --color-text-secondary:#cbd5e1;
  --color-border:#334155;
  --color-stock:#1e3a8a;
  --color-sold:#92400e;
  --color-remaining:#064e3b;
  --color-primary:#0ea5e9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
  padding:12px;
  padding-bottom:90px;
}
.header{
  background:var(--color-bg-secondary);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}
.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:12px;
}
.summary-card{
  background:var(--color-bg-primary);
  padding:12px;
  border-radius:10px;
  border:1px solid var(--color-border);
}
.summary-card label{
  font-size:11px;
  color:var(--color-text-secondary);
}
.summary-card .value{
  font-size:22px;
  font-weight:700;
}
.search-box{
  background:var(--color-bg-secondary);
  padding:12px;
  border-radius:16px;
  margin-bottom:16px;
}
.search-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--color-border);
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
}
.inventory-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.item-card{
  background:var(--color-bg-secondary);
  border-radius:16px;
  padding:14px;
}
.item-header{
  font-size:18px;
  font-weight:600;
  margin-bottom:10px;
  border-bottom:1px solid var(--color-border);
}
.size-row{
  display:grid;
  grid-template-columns:72px 1fr 1fr 1fr;
  gap:6px;
  margin-bottom:6px;
}
input{
  padding:8px;
  border-radius:8px;
  border:1px solid var(--color-border);
  text-align:center;
}
.action-buttons{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--color-bg-secondary);
  padding:10px;
  display:flex;
  gap:8px;
}
.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-secondary{background:var(--color-bg-primary);color:#fff}
</style>
</head>

<body>

<div class="header">
  <h2>📦 Metiabruz Stock</h2>
  <div class="summary">
    <div class="summary-card"><label>Total Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Remaining</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="search-box">
  <input id="searchInput" placeholder="Search by Design No...">
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="action-buttons">
  <button class="btn btn-secondary" onclick="addDesign()">➕ Add</button>
</div>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  'https://yhlfqpiwevsehlgbhxtk.supabase.co',
  'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'
);
</script>

<script>
const inventory=[];
const sizes=["22x32","34x36","16x18","26x30"];

/* LOAD */
async function loadFromSupabase(){
  const {data,error}=await supabaseClient.from('inventory').select('*').order('design');
  if(error){alert(error.message);return;}
  inventory.length=0;
  inventory.push(...data);
  renderInventory();
}

/* RENDER */
function renderInventory(filter=''){
  const box=document.getElementById('inventoryList');
  box.innerHTML='';
  const list=filter?inventory.filter(i=>i.design.toLowerCase().includes(filter.toLowerCase())):inventory;

  let totalStock=0,totalSold=0;
  list.forEach(item=>{
    totalStock+=item.stock.reduce((a,b)=>a+b,0);
    totalSold+=item.sold.reduce((a,b)=>a+b,0);

    const card=document.createElement('div');
    card.className='item-card';
    card.innerHTML=`
      <div class="item-header">${item.design}</div>
      ${sizes.map((s,i)=>`
        <div class="size-row">
          <div>${s}</div>
          <input type="number" value="${item.stock[i]}" onchange="updateStock('${item.id}',${i},this.value)">
          <input type="number" value="${item.sold[i]}" onchange="updateSold('${item.id}',${i},this.value)">
          <input type="number" value="${item.stock[i]-item.sold[i]}" disabled>
        </div>
      `).join('')}
    `;
    box.appendChild(card);
  });

  document.getElementById('totalStock').textContent=totalStock;
  document.getElementById('totalSold').textContent=totalSold;
  document.getElementById('totalRemaining').textContent=totalStock-totalSold;
  document.getElementById('designCount').textContent=inventory.length;
}

/* ADD */
async function addDesign(){
  const design=prompt("Design number?");
  if(!design)return;
  await supabaseClient.from('inventory').insert({design,stock:[0,0,0,0],sold:[0,0,0,0]});
}

/* UPDATE */
async function updateStock(id,i,v){
  const item=inventory.find(x=>x.id===id);
  const stock=[...item.stock];
  stock[i]=+v||0;
  await supabaseClient.from('inventory').update({stock}).eq('id',id);
}
async function updateSold(id,i,v){
  const item=inventory.find(x=>x.id===id);
  const sold=[...item.sold];
  sold[i]=Math.min(+v||0,item.stock[i]);
  await supabaseClient.from('inventory').update({sold}).eq('id',id);
}

/* REALTIME */
supabaseClient.channel('rt')
  .on('postgres_changes',{event:'*',schema:'public',table:'inventory'},loadFromSupabase)
  .subscribe();

document.getElementById('searchInput').addEventListener('input',e=>renderInventory(e.target.value));

loadFromSupabase();
</script>

</body>
</html>
