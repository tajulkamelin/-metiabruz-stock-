<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --warning: #ff9f0a;
  --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 50px; }

.header-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); padding: 20px 16px 12px;
}
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
.btn-action { padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
.btn-action:active { opacity: 0.7; }
.btn-add { background: var(--primary); color: white; }
.btn-sell { background: var(--warning); color: black; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); padding: 10px 4px; border-radius: 10px; text-align: center; }
.summary-card label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; display: block; margin-bottom: 4px; }
.summary-card .value { font-size: 15px; font-weight: 700; }

.controls-area { padding: 16px; }
.search-wrapper { background: var(--card-elevated); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }
.search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; }

.inventory-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.item-card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border); }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.design-badge { background: var(--card-elevated); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 16px; border: 1px solid var(--primary); }

.grid-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; text-align: center; }
.label-style { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

.qty-display { background: var(--card-elevated); padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.remain-pill { padding: 8px 4px; border-radius: 8px; font-weight: 800; font-size: 13px; }
.stock-low { background: rgba(255, 69, 58, 0.2); color: var(--danger); border: 1px solid var(--danger); }
.stock-ok { background: rgba(50, 215, 75, 0.1); color: var(--success); }

/* Modal Styles */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: flex-end; }
.modal.active { display: flex; }
.modal-content { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: env(safe-area-inset-bottom, 40px); animation: slideUp 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.qty-input-large { background: var(--card-elevated); border: 1px solid var(--border); color: var(--text); padding: 16px; border-radius: 12px; font-size: 18px; width: 100%; margin-bottom: 15px; }
.select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.select-box { background: var(--card-elevated); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="header-container">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size: 22px;">📦 Metiabruz Stock</h2>
    <div id="statusIndicator" style="font-size:11px; font-weight:bold; color:var(--text-secondary)">Online</div>
  </div>

  <div class="quick-actions">
    <button class="btn-action btn-add" onclick="openModal('add')">+ ADD STOCK</button>
    <button class="btn-action btn-sell" onclick="openModal('sell')">- SELL ITEM</button>
  </div>

  <div class="summary">
    <div class="summary-card"><label>Total In</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Out</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Balance</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-wrapper">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design Number..." onkeyup="render()">
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="modal" id="entryModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="width:40px;height:4px;background:rgba(255,255,255,0.2);margin:0 auto 20px auto;border-radius:2px;"></div>
    <h3 id="modalTitle" style="margin-bottom:15px">Action</h3>
    
    <input type="text" id="designInput" list="designSuggestions" class="qty-input-large" 
           placeholder="Design Number" oninput="syncAvailableStock(this.value)">
    <datalist id="designSuggestions"></datalist>

    <div id="availabilityNotice" style="margin-bottom:20px; padding:12px; border-radius:12px; font-size:13px; display:none;"></div>

    <div class="select-grid" id="inputGrid">
        <div><label class="label-style">22x32</label><select id="m0" class="select-box" style="width:100%"></select></div>
        <div><label class="label-style">34x36</label><select id="m1" class="select-box" style="width:100%"></select></div>
        <div><label class="label-style">16x18</label><select id="m2" class="select-box" style="width:100%"></select></div>
        <div><label class="label-style">26x30</label><select id="m3" class="select-box" style="width:100%"></select></div>
    </div>
    
    <button id="modalSubmit" class="btn-action" style="width:100%; margin-top:20px; font-size:16px;" onclick="processEntry()">Confirm Action</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue') || '[]');
let mode = 'add';
const sizes = ["22x32", "34x36", "16x18", "26x30"];
const LOW_STOCK_THRESHOLD = 5;

function getOpts(max) {
    let h = `<option value="0">Qty: 0</option>`;
    for(let i=1; i<=max; i++) h += `<option value="${i}">${i}</option>`;
    return h;
}

function openModal(m) {
    mode = m;
    const notice = document.getElementById('availabilityNotice');
    document.getElementById('designInput').value = '';
    notice.style.display = 'none';
    notice.innerHTML = '';
    
    document.getElementById('modalTitle').innerText = mode === 'add' ? "Add New Stock" : "Sell Item";
    document.getElementById('modalSubmit').className = mode === 'add' ? "btn-action btn-add" : "btn-action btn-sell";
    document.getElementById('modalSubmit').innerText = mode === 'add' ? "Update Inventory" : "Record Sale";
    
    sizes.forEach((s, i) => {
        document.getElementById(`m${i}`).innerHTML = getOpts(mode === 'add' ? 200 : 0);
    });
    
    const list = document.getElementById('designSuggestions');
    list.innerHTML = inventory.map(it => `<option value="${it.design}">`).join('');
    
    document.getElementById('entryModal').classList.add('active');
}

function syncAvailableStock(val) {
    const term = val.trim().toUpperCase();
    const existing = inventory.find(it => it.design.toUpperCase() === term);
    const notice = document.getElementById('availabilityNotice');
    
    if (existing) {
        notice.style.display = 'block';
        notice.style.background = "var(--card-elevated)";
        notice.style.border = "1px solid var(--primary)";
        
        let previewHTML = `<div style="margin-bottom:8px; font-weight:bold; color:var(--primary); text-align:center;">Design #${existing.design} - Live Balance</div>`;
        previewHTML += `<div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; text-align:center;">`;
        
        sizes.forEach((s, i) => {
            const left = existing.stock[i] - existing.sold[i];
            previewHTML += `<div>
                <div style="font-size:9px; color:var(--text-secondary)">${s}</div>
                <div style="font-weight:bold; color:${left <= LOW_STOCK_THRESHOLD ? 'var(--danger)' : 'var(--success)'}">${left}</div>
            </div>`;
        });
        previewHTML += `</div>`;
        notice.innerHTML = previewHTML;

        if (mode === 'sell') {
            sizes.forEach((s, i) => {
                const left = existing.stock[i] - existing.sold[i];
                document.getElementById(`m${i}`).innerHTML = getOpts(left);
            });
        }
    } else {
        if (mode === 'sell' && term.length > 0) {
            notice.style.display = 'block';
            notice.style.background = "rgba(255, 69, 58, 0.1)";
            notice.style.border = "1px solid var(--danger)";
            notice.innerHTML = `<div style="color:var(--danger); text-align:center; font-weight:bold;">⚠ Design Not Found</div>`;
            sizes.forEach((s, i) => document.getElementById(`m${i}`).innerHTML = getOpts(0));
        } else {
            notice.style.display = 'none';
        }
    }
}

async function processEntry() {
    const dNo = document.getElementById('designInput').value.trim().toUpperCase();
    if(!dNo) return alert("Enter Design Number");
    
    const inputQtys = [ +m0.value, +m1.value, +m2.value, +m3.value ];
    if(inputQtys.every(v => v === 0)) return alert("Select a quantity first");

    let target = inventory.find(it => it.design.toUpperCase() === dNo);

    if (mode === 'add') {
        if (target) {
            target.stock = target.stock.map((v, i) => v + inputQtys[i]);
            addToQueue('update', target);
        } else {
            const newItem = { id: crypto.randomUUID(), design: dNo, stock: inputQtys, sold: [0,0,0,0], created_at: new Date().toISOString() };
            inventory.unshift(newItem);
            addToQueue('add', newItem);
        }
    } else {
        if (!target) return alert("Error: Design missing from stock.");
        target.sold = target.sold.map((v, i) => v + inputQtys[i]);
        addToQueue('update', target);
    }

    closeModal();
    render();
    syncNow();
}

function addToQueue(type, data) {
    syncQueue.push({ type, data });
    localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
}

function render() {
    const term = document.getElementById('searchInput').value.toUpperCase();
    const listEl = document.getElementById('inventoryList');
    listEl.innerHTML = '';
    
    let ts=0, td=0;
    inventory.forEach(item => { item.stock.forEach((v, i) => { ts += v; td += item.sold[i]; }); });

    inventory.filter(it => it.design.toUpperCase().includes(term)).forEach(item => {
        let rows = '';
        item.stock.forEach((sVal, i) => {
            const rem = sVal - item.sold[i];
            const lowClass = rem <= LOW_STOCK_THRESHOLD ? 'stock-low' : 'stock-ok';
            rows += `<div class="grid-row">
                <div class="label-style">${sizes[i]}</div>
                <div class="qty-display">${sVal}</div>
                <div class="qty-display">${item.sold[i]}</div>
                <div class="remain-pill ${lowClass}">${rem}</div>
            </div>`;
        });
        listEl.innerHTML += `<div class="item-card">
            <div class="item-header">
                <span class="design-badge"># ${item.design}</span>
                <button onclick="del('${item.id}')" style="color:var(--danger); background:none; border:none; font-size:11px; font-weight:bold;">DELETE</button>
            </div>
            <div class="grid-row" style="margin-bottom:5px; opacity:0.5; font-size:10px;">
                <div>SIZE</div><div>IN</div><div>OUT</div><div>LEFT</div>
            </div>
            ${rows}
        </div>`;
    });

    document.getElementById('totalStock').innerText = ts; 
    document.getElementById('totalSold').innerText = td; 
    document.getElementById('totalRemaining').innerText = ts-td;
    document.getElementById('designCount').innerText = inventory.length;
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
}

function del(id) { 
    if(confirm("Permanently delete this design?")) { 
        inventory = inventory.filter(x => x.id !== id); 
        addToQueue('delete', {id}); 
        render(); 
        syncNow(); 
    } 
}

async function syncNow() {
    if(!navigator.onLine || syncQueue.length === 0) return;
    const status = document.getElementById('statusIndicator');
    status.innerText = "Syncing...";
    status.style.color = "var(--warning)";

    while(syncQueue.length > 0) {
        const task = syncQueue[0];
        try {
            let error;
            if(task.type === 'add') ({ error } = await supabaseClient.from('inventory').insert(task.data));
            else if(task.type === 'update') ({ error } = await supabaseClient.from('inventory').update({stock: task.data.stock, sold: task.data.sold}).eq('id', task.data.id));
            else if(task.type === 'delete') ({ error } = await supabaseClient.from('inventory').delete().eq('id', task.data.id));

            if(error) throw error;
            syncQueue.shift();
            localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
        } catch(e) {
            status.innerText = "Offline/Retry";
            status.style.color = "var(--danger)";
            return;
        }
    }
    status.innerText = "Online";
    status.style.color = "var(--success)";
}

async function fetchData() {
    const {data, error} = await supabaseClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(!error && data) { inventory = data; render(); }
}

function closeModal() { document.getElementById('entryModal').classList.remove('active'); }

fetchData();
setInterval(syncNow, 10000);
</script>
</body>
</html>
