<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #a1a1a6;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --warning: #ffd60a;
  --border: rgba(255, 255, 255, 0.12);
  --glass: rgba(28, 28, 30, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 140px; }

/* iPhone Premium Header */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-bottom: 0.5px solid var(--border); padding: 50px 20px 10px;
}

/* Sorting & Search Bar */
.search-area { padding: 10px 0; }
.search-box {
    background: var(--card-elevated); border-radius: 12px; height: 40px;
    display: flex; align-items: center; padding: 0 12px; border: 0.5px solid var(--border);
}
.search-box input {
    flex: 1; background: transparent; border: none; color: white; font-size: 16px; margin-left: 8px; outline: none;
}

.sort-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 5px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.sort-scroll::-webkit-scrollbar { display: none; }
.sort-chip {
    white-space: nowrap; background: var(--card-elevated); color: var(--text-secondary);
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 0.5px solid var(--border); cursor: pointer;
}
.sort-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Item List */
.content-section { padding: 10px 20px; }
.item-card { 
    background: var(--card); border-radius: 20px; padding: 18px; 
    border: 0.5px solid var(--border); margin-bottom: 15px;
}
.item-card.selected { border-color: var(--primary); background: rgba(10, 132, 255, 0.05); }

/* Selection UI */
.selection-bar { 
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--primary); color: white; padding: 55px 20px 15px; 
    justify-content: space-between; align-items: center; font-weight: bold;
}
.selection-bar.active { display: flex; }

.select-circle { 
    display: none; width: 22px; height: 22px; border-radius: 50%; 
    border: 2px solid var(--border); margin-right: 12px;
}
.selection-active .select-circle { display: block; }
.selected .select-circle { background: white; border-color: white; }

/* Bottom Dock */
.bottom-dock {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--glass); backdrop-filter: blur(30px);
  border-top: 0.5px solid var(--border); padding: 15px 20px 35px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 100;
}
.btn-dock { height: 50px; border-radius: 14px; border: none; font-weight: 700; font-size: 15px; }
.btn-dock-danger { background: var(--danger); color: white; grid-column: span 2; }
</style>
</head>
<body id="body">

<div class="selection-bar" id="selectionBar">
    <span id="selectCount">0 Selected</span>
    <div style="display:flex; gap:15px">
        <button onclick="selectAll()" style="background:none; border:none; color:white; font-weight:bold">All</button>
        <button onclick="exitSelection()" style="background:none; border:none; color:white; font-weight:bold">Cancel</button>
    </div>
</div>

<div class="header-container">
  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <h2 style="font-size: 26px; font-weight: 800;">Inventory</h2>
    <span id="statusIndicator" style="font-size:10px; opacity:0.5;">Online</span>
  </div>
  
  <div class="search-area">
      <div class="search-box">
          <span>🔍</span>
          <input id="searchInput" placeholder="Search Design No..." oninput="render()">
      </div>
      <div class="sort-scroll">
          <div class="sort-chip active" onclick="setSort('new', this)">Latest</div>
          <div class="sort-chip" onclick="setSort('old', this)">Oldest</div>
          <div class="sort-chip" onclick="setSort('asc', this)">Design (1-9)</div>
          <div class="sort-chip" onclick="setSort('desc', this)">Design (9-1)</div>
      </div>
  </div>
</div>

<div class="content-section" id="inventoryList"></div>

<div class="bottom-dock" id="bottomDock">
  <button class="btn-dock" style="background:var(--primary); color:white" onclick="openModal('add')">Add New</button>
  <button class="btn-dock" style="background:white; color:black" onclick="openModal('sell')">Sale Item</button>
</div>

<div class="bottom-dock" id="deleteDock" style="display:none">
    <button class="btn-dock btn-dock-danger" onclick="confirmMultiDelete()">Move to Trash</button>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
let isSelectionMode = false;
let selectedIds = new Set();
let currentSort = 'new';
const sizes = ["22x32", "34x36", "16x18", "26x30"];

// --- Sorting & Searching ---

function setSort(type, el) {
    currentSort = type;
    document.querySelectorAll('.sort-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    render();
}

function render() {
    const term = document.getElementById('searchInput').value.toUpperCase();
    const list = document.getElementById('inventoryList');
    list.innerHTML = '';

    // 1. Filter
    let filtered = inventory.filter(it => !it.deleted_at && it.design.toUpperCase().includes(term));

    // 2. Sort
    filtered.sort((a, b) => {
        if(currentSort === 'new') return new Date(b.created_at) - new Date(a.created_at);
        if(currentSort === 'old') return new Date(a.created_at) - new Date(b.created_at);
        if(currentSort === 'asc') return a.design.localeCompare(b.design, undefined, {numeric: true});
        if(currentSort === 'desc') return b.design.localeCompare(a.design, undefined, {numeric: true});
    });

    // 3. Display
    filtered.forEach(item => {
        const isSelected = selectedIds.has(item.id);
        const card = document.createElement('div');
        card.className = `item-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => isSelectionMode ? toggleSelect(item.id) : null;
        card.oncontextmenu = (e) => { e.preventDefault(); enterSelection(item.id); };
        
        card.innerHTML = `
            <div style="display:flex; align-items:center;">
                <div class="select-circle"></div>
                <div style="flex:1">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                        <span style="font-weight:800; color:var(--primary); font-size:18px"># ${item.design}</span>
                        <span style="font-size:10px; color:var(--text-secondary)">${new Date(item.created_at).toLocaleDateString()}</span>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; text-align:center">
                        ${item.stock.map((s, i) => `
                            <div>
                                <div style="font-size:9px; color:var(--text-secondary); margin-bottom:2px">${sizes[i]}</div>
                                <div style="font-weight:bold; font-size:14px; color:${(s-item.sold[i]) < 5 ? 'var(--danger)' : 'var(--text)'}">${s - item.sold[i]}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
        list.appendChild(card);
    });
}

// Selection & Context Logic
function enterSelection(id) {
    isSelectionMode = true;
    document.getElementById('body').classList.add('selection-active');
    document.getElementById('selectionBar').classList.add('active');
    document.getElementById('bottomDock').style.display = 'none';
    document.getElementById('deleteDock').style.display = 'grid';
    toggleSelect(id);
}

function exitSelection() {
    isSelectionMode = false;
    selectedIds.clear();
    document.getElementById('body').classList.remove('selection-active');
    document.getElementById('selectionBar').classList.remove('active');
    document.getElementById('bottomDock').style.display = 'grid';
    document.getElementById('deleteDock').style.display = 'none';
    render();
}

function toggleSelect(id) {
    if(selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    document.getElementById('selectCount').innerText = `${selectedIds.size} Selected`;
    render();
}

function selectAll() {
    inventory.filter(it => !it.deleted_at).forEach(it => selectedIds.add(it.id));
    document.getElementById('selectCount').innerText = `${selectedIds.size} Selected`;
    render();
}

function confirmMultiDelete() {
    if(confirm(`Move ${selectedIds.size} items to Trash?`)) {
        const now = new Date().toISOString();
        inventory.forEach(it => { if(selectedIds.has(it.id)) it.deleted_at = now; });
        localStorage.setItem('inventoryCache', JSON.stringify(inventory));
        exitSelection();
    }
}

async function fetchData() {
    const {data} = await supabaseClient.from('inventory').select('*');
    if(data) { inventory = data; render(); }
}

fetchData();
</script>
</body>
</html>
