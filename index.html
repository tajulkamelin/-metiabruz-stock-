<!DOCTYPE html>
<html lang="en">
<head> <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Metiabruz Stock</title>

<style>
:root{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;
  --border:#334155;--primary:#0ea5e9;--danger:#ef4444;--remain:#064e3b
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);padding:12px;padding-bottom:110px
}
.header,.search-box,.item-card,.modal-content{
  background:var(--card);border-radius:16px;padding:16px
}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.summary-card{background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--border)}
.summary-card label{font-size:11px;color:var(--muted)}
.summary-card .value{font-size:22px;font-weight:700}
.search-box{margin:16px 0}
.search-box input,input{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);text-align:center
}
.inventory-list{display:flex;flex-direction:column;gap:12px}
.item-header{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.size-row{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.input-remaining{background:var(--remain)}
.action-buttons{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);padding:10px;display:flex;gap:8px
}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--bg);color:#fff}
.btn-danger{background:var(--danger);color:#fff;font-size:12px;padding:6px 10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  align-items:center;justify-content:center;z-index:99}
.modal.active{display:flex}
.size-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
</style>
</head>

<body>

<div class="header">
  <h2>📦 Metiabruz Stock</h2>
  <div class="summary">
    <div class="summary-card"><label>Total Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Remaining</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="search-box">
  <input id="searchInput" placeholder="Search by Design No">
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="action-buttons">
  <button class="btn btn-secondary" onclick="openAdd()">➕ Add</button>
  <button class="btn btn-primary" onclick="syncNow()">🔄 Sync</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <h3>Add Design</h3><br>
    <input id="designInput" placeholder="Design No"><br><br>
    <div class="size-inputs">
      <input id="s0" placeholder="22x32" type="number">
      <input id="s1" placeholder="34x36" type="number">
      <input id="s2" placeholder="16x18" type="number">
      <input id="s3" placeholder="26x30" type="number">
    </div><br>
    <button class="btn btn-primary" onclick="addDesign()">Save</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  'https://yhlfqpiwevsehlgbhxtk.supabase.co',
  'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'
);

let inventory = JSON.parse(localStorage.getItem('inventoryCache')||'[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue')||'[]');
const sizes=["22x32","34x36","16x18","26x30"];

function saveCache(){
  localStorage.setItem('inventoryCache',JSON.stringify(inventory));
  localStorage.setItem('syncQueue',JSON.stringify(syncQueue));
}

function render(){
  inventoryList.innerHTML='';
  let ts=0,td=0;
  inventory.forEach(item=>{
    ts+=item.stock.reduce((a,b)=>a+b,0);
    td+=item.sold.reduce((a,b)=>a+b,0);
    inventoryList.innerHTML+=`
      <div class="item-card">
        <div class="item-header">
          ${item.design}
          <button class="btn-danger" onclick="del('${item.id}')">🗑</button>
        </div>
        ${sizes.map((s,i)=>`
          <div class="size-row">
            <div>${s}</div>
            <input value="${item.stock[i]}" onchange="upd('${item.id}',${i},this.value,'stock')">
            <input value="${item.sold[i]}" onchange="upd('${item.id}',${i},this.value,'sold')">
            <input class="input-remaining" value="${item.stock[i]-item.sold[i]}" disabled>
          </div>`).join('')}
      </div>`;
  });
  totalStock.textContent=ts;
  totalSold.textContent=td;
  totalRemaining.textContent=ts-td;
  designCount.textContent=inventory.length;
  saveCache();
}

function openAdd(){addModal.classList.add('active')}
function closeAdd(){addModal.classList.remove('active')}

function addDesign(){
  const item={
    id:crypto.randomUUID(),
    design:designInput.value,
    stock:[+s0.value||0,+s1.value||0,+s2.value||0,+s3.value||0],
    sold:[0,0,0,0],
    offline:true
  };
  inventory.push(item);
  syncQueue.push({type:'add',item});
  closeAdd();render();
}

function upd(id,i,v,type){
  const item=inventory.find(x=>x.id===id);
  item[type][i]=+v||0;
  syncQueue.push({type:'update',id,data:item});
  render();
}

function del(id){
  inventory=inventory.filter(i=>i.id!==id);
  syncQueue.push({type:'delete',id});
  render();
}

async function syncNow(){
  if(!navigator.onLine) return alert("No internet");
  for(const job of syncQueue){
    if(job.type==='add'){
      await supabaseClient.from('inventory').insert({
        design:job.item.design,
        stock:job.item.stock,
        sold:job.item.sold
      });
    }
    if(job.type==='update'){
      await supabaseClient.from('inventory').update({
        stock:job.data.stock,
        sold:job.data.sold
      }).eq('design',job.data.design);
    }
    if(job.type==='delete'){
      await supabaseClient.from('inventory').delete().eq('id',job.id);
    }
  }
  syncQueue=[];
  const {data}=await supabaseClient.from('inventory').select('*');
  inventory=data||[];
  saveCache();render();
}

window.addEventListener('online',syncNow);
render();
</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js");
  });
}
</script>

</body>
</html>
