<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #a1a1a6;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --border: rgba(255, 255, 255, 0.12);
  --glass: rgba(25, 25, 25, 0.85);
}

* { 
    box-sizing: border-box; margin: 0; padding: 0; 
    -webkit-tap-highlight-color: transparent; 
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
}

body { background: var(--bg); color: var(--text); padding-bottom: 140px; overflow-x: hidden; }

/* --- SIDE MENU (SLIDE) --- */
.side-menu {
    position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
    background: var(--card); z-index: 3000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-right: 0.5px solid var(--border); padding: 60px 20px;
    box-shadow: 20px 0 50px rgba(0,0,0,0.5);
}
.side-menu.active { left: 0; }
.menu-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 2999; 
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
}
.menu-overlay.active { display: block; }
.menu-item { 
    padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; 
    display: flex; align-items: center; gap: 12px; color: var(--text);
}
.menu-item:active { background: var(--card-elevated); }

/* --- LOGO BANNER --- */
.logo-banner {
    width: 100%; height: 100px; background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 0.5px solid var(--border); padding-top: 40px;
}
.logo-placeholder { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--primary); }

/* --- HEADER --- */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass); backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border-bottom: 0.5px solid var(--border); padding: 15px 20px;
}
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

.hamburger { width: 24px; height: 18px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
.hamburger span { display: block; height: 2.5px; width: 100%; background: var(--text); border-radius: 10px; transition: 0.3s; }

/* ... Rest of your existing CSS (Inventory cards, tabs, etc.) ... */
.view-tabs { display: flex; background: rgba(120, 120, 128, 0.24); padding: 2px; border-radius: 10px; margin-bottom: 12px; }
.tab { flex: 1; padding: 7px; text-align: center; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; color: var(--text-secondary); background: none; }
.tab.active { background: #636366; color: white; }
.search-bar { background: rgba(255, 255, 255, 0.1); border-radius: 10px; height: 38px; display: flex; align-items: center; padding: 0 10px; }
.search-bar input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; margin-left: 8px; outline: none; }
.item-card { background: var(--card); border-radius: 20px; padding: 20px; border: 0.5px solid var(--border); margin: 15px 20px; display: flex; align-items: center; gap: 15px; }
.bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(30px); border-top: 0.5px solid var(--border); padding: 15px 20px 35px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 1000; }
.btn-dock { height: 54px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; }
.icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--card-elevated); border: 0.5px solid var(--border); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; align-items: flex-end; }
.modal.active { display: flex; }
.modal-content { background: #1c1c1e; width: 100%; border-radius: 30px 30px 0 0; padding: 30px 20px 50px; }
.ios-input { width: 100%; background: #2c2c2e; border: none; border-radius: 12px; padding: 16px; color: white; font-size: 17px; margin-bottom: 15px; }
</style>
</head>
<body id="body">

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <div style="margin-bottom: 40px;">
        <h3 style="color:var(--primary); letter-spacing:1px;">METIABRUZ</h3>
        <p style="font-size:12px; color:var(--text-secondary);">Premium Inventory v2.0</p>
    </div>
    <div class="menu-item" onclick="toggleMenu(); haptic();">Dashboard</div>
    <div class="menu-item" onclick="toggleMenu(); haptic();">Reports (PDF)</div>
    <div class="menu-item" onclick="toggleMenu(); haptic();">Settings</div>
    <div class="menu-item" style="color:var(--danger); margin-top:50px;" onclick="toggleMenu(); haptic('heavy');">Logout</div>
</div>

<div class="logo-banner">
    <div class="logo-placeholder">METIABRUZ PRO</div>
</div>

<div class="header-container">
  <div class="nav-row">
    <div class="hamburger" onclick="toggleMenu(); haptic();">
        <span></span><span></span><span></span>
    </div>
    <div id="statusIndicator" style="font-size:11px; font-weight:700; color:var(--text-secondary)">ONLINE</div>
  </div>
  
  <div class="view-tabs">
    <button class="tab active" id="tabInv" onclick="switchView('inventory')">Active Items</button>
    <button class="tab" id="tabTrash" onclick="switchView('trash')">Recently Deleted</button>
  </div>

  <div class="search-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" placeholder="Search Design No." oninput="render()">
  </div>
</div>

<div id="inventoryList"></div>
<div id="trashList" style="display:none"></div>

<div class="bottom-dock" id="bottomDock">
  <button class="btn-dock" style="background:var(--primary); color:white" onclick="openModal('add')">Add Stock</button>
  <button class="btn-dock" style="background:white; color:black" onclick="openModal('sell')">Record Sale</button>
</div>

<div class="modal" id="entryModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="width:36px; height:5px; background:rgba(255,255,255,0.2); border-radius:3px; margin:0 auto 20px;"></div>
        <h2 id="modalTitle" style="margin-bottom:20px; font-weight:800;">Entry</h2>
        <input type="text" id="designInput" class="ios-input" placeholder="Design No.">
        <div id="modalInputs" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;"></div>
        <button id="modalSubmit" class="btn-dock" style="width:100%; background:var(--primary); color:white;" onclick="processEntry()">Confirm Changes</button>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
let currentView = 'inventory';
const sizes = ["22x32", "34x36", "16x18", "26x30"];

function haptic(type = 'light') {
    if (!window.navigator.vibrate) return;
    navigator.vibrate(type === 'light' ? 10 : 50);
}

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('menuOverlay').classList.toggle('active');
}

function switchView(v) {
    haptic();
    currentView = v;
    document.getElementById('tabInv').classList.toggle('active', v === 'inventory');
    document.getElementById('tabTrash').classList.toggle('active', v === 'trash');
    document.getElementById('inventoryList').style.display = v === 'inventory' ? 'block' : 'none';
    document.getElementById('trashList').style.display = v === 'trash' ? 'block' : 'none';
    render();
}

function render() {
    const term = document.getElementById('searchInput').value.toUpperCase();
    const invList = document.getElementById('inventoryList');
    const trashList = document.getElementById('trashList');
    invList.innerHTML = ''; trashList.innerHTML = '';

    inventory.forEach(item => {
        if(!item.design.toUpperCase().includes(term)) return;
        const card = document.createElement('div');
        card.className = `item-card`;
        
        card.innerHTML = `
            <div style="flex:1">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; color:var(--primary); font-size:20px;"># ${item.design}</span>
                    <div style="display:flex; gap:12px;">
                        ${!item.deleted_at ? `
                            <div class="icon-btn" onclick="haptic(); openModal('edit','${item.id}')">✏️</div>
                            <div class="icon-btn" onclick="haptic('heavy'); singleDelete('${item.id}')">🗑️</div>
                        ` : ''}
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;">
                    ${item.stock.map((s,i) => `<div style="text-align:center"><div style="font-size:9px; color:var(--text-secondary); font-weight:700">${sizes[i]}</div><div style="font-weight:bold; font-size:15px; color:${(s-item.sold[i]) < 5 ? 'var(--danger)' : 'white'}">${s-item.sold[i]}</div></div>`).join('')}
                </div>
            </div>
            ${item.deleted_at ? `<button onclick="restoreItem('${item.id}')" style="background:var(--success); color:black; border:none; padding:10px 16px; border-radius:12px; font-weight:bold; font-size:12px">RESTORE</button>` : ''}
        `;

        if(!item.deleted_at && currentView === 'inventory') invList.appendChild(card);
        else if(item.deleted_at && currentView === 'trash') trashList.appendChild(card);
    });
}

// (Remaining processEntry, openModal, and fetchData functions remain identical to your previous high-performance logic)
function openModal(m, id = null) {
    haptic();
    mode = m; editingId = id;
    const item = id ? inventory.find(it => it.id === id) : null;
    document.getElementById('modalTitle').innerText = m === 'add' ? "Add Stock" : m === 'sell' ? "Record Sale" : "Edit Design";
    document.getElementById('designInput').value = item ? item.design : '';
    document.getElementById('modalInputs').innerHTML = sizes.map((s,i) => `<div><label style="font-size:11px; font-weight:700; color:var(--text-secondary)">${s}</label><input type="number" id="m${i}" class="ios-input" value="${(m==='edit' && item)?item.stock[i]:0}"></div>`).join('');
    document.getElementById('entryModal').classList.add('active');
}

async function processEntry() {
    const dNo = document.getElementById('designInput').value.trim().toUpperCase();
    const qtys = sizes.map((_, i) => +document.getElementById(`m${i}`).value);
    if(!dNo) return;
    if(mode === 'edit') { let it = inventory.find(x => x.id === editingId); it.design = dNo; it.stock = qtys; }
    else if(mode === 'add') { let target = inventory.find(it => it.design === dNo); if(target) target.stock = target.stock.map((v,i) => v + qtys[i]); else inventory.unshift({ id: crypto.randomUUID(), design: dNo, stock: qtys, sold: [0,0,0,0], created_at: new Date().toISOString() }); }
    else { let target = inventory.find(it => it.design === dNo); if(target) target.sold = target.sold.map((v,i) => v + qtys[i]); }
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
    await supabaseClient.from('inventory').upsert(inventory);
    closeModal(); render();
}

function singleDelete(id) { const item = inventory.find(it => it.id === id); item.deleted_at = new Date().toISOString(); localStorage.setItem('inventoryCache', JSON.stringify(inventory)); render(); }
function restoreItem(id) { const item = inventory.find(it => it.id === id); delete item.deleted_at; localStorage.setItem('inventoryCache', JSON.stringify(inventory)); render(); }
function closeModal() { document.getElementById('entryModal').classList.remove('active'); }
async function fetchData() { const {data} = await supabaseClient.from('inventory').select('*'); if(data) { inventory = data; render(); } }

fetchData();
</script>
</body>
</html>
