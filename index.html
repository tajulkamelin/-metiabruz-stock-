<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Metiabruz Stock">
    <title>Metiabruz Stock Tracker</title>
    <style>
        :root {
            --color-bg-primary: #f8fafc;
            --color-bg-secondary: #ffffff;
            --color-text-primary: #0f172a;
            --color-text-secondary: #475569;
            --color-border: #e2e8f0;
            --color-stock: #dbeafe;
            --color-sold: #fed7aa;
            --color-remaining: #d1fae5;
            --color-primary: #0ea5e9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg-primary: #0f172a;
                --color-bg-secondary: #1e293b;
                --color-text-primary: #f1f5f9;
                --color-text-secondary: #cbd5e1;
                --color-border: #334155;
                --color-stock: #1e3a8a;
                --color-sold: #92400e;
                --color-remaining: #064e3b;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
            padding:12px;
            padding-bottom:90px;
            font-size:14px;
            max-width:100vw;
            overflow-x:hidden;
        }

        .header {
            background:var(--color-bg-secondary);
            padding:16px;
            border-radius:16px;
            margin-bottom:16px;
            box-shadow:0 4px 12px rgba(15,23,42,0.15);
        }

        h1 { font-size:22px; margin-bottom:8px; }

        .summary {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
            margin-top:12px;
        }

        .summary-card {
            background:var(--color-bg-primary);
            padding:12px;
            border-radius:10px;
            border:1px solid var(--color-border);
        }

        .summary-card label {
            font-size:11px;
            color:var(--color-text-secondary);
            text-transform:uppercase;
            display:block;
            margin-bottom:4px;
        }

        .summary-card .value {
            font-size:22px;
            font-weight:700;
        }

        .search-box {
            background:var(--color-bg-secondary);
            padding:12px;
            border-radius:16px;
            margin-bottom:16px;
            box-shadow:0 2px 8px rgba(15,23,42,0.08);
        }

        .search-box input {
            width:100%;
            padding:12px;
            border:1px solid var(--color-border);
            border-radius:10px;
            font-size:16px;
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
        }

        .legend {
            display:flex;
            gap:12px;
            margin-bottom:16px;
            flex-wrap:wrap;
        }

        .legend-item {
            display:flex;
            align-items:center;
            gap:6px;
            font-size:12px;
        }

        .legend-box {
            width:18px;
            height:18px;
            border-radius:4px;
            border:1px solid var(--color-border);
        }

        .legend-stock { background:var(--color-stock); }
        .legend-sold { background:var(--color-sold); }
        .legend-remaining { background:var(--color-remaining); }

        .inventory-list {
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .item-card {
            background:var(--color-bg-secondary);
            border-radius:16px;
            padding:14px 14px 12px;
            box-shadow:0 1px 4px rgba(15,23,42,0.12);
        }

        .item-header {
            font-size:18px;
            font-weight:600;
            margin-bottom:10px;
            padding-bottom:8px;
            border-bottom:1px solid var(--color-border);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .size-grid { display:grid; gap:10px; }

        .size-row {
            display:grid;
            grid-template-columns:72px 1fr 1fr 1fr;
            gap:6px;
            align-items:center;
        }

        .size-label { font-weight:600; font-size:12px; }

        .input-group { display:flex; flex-direction:column; gap:3px; }

        .input-group label {
            font-size:9px;
            text-transform:uppercase;
            color:var(--color-text-secondary);
        }

        .input-group input {
            padding:8px;
            border:1px solid var(--color-border);
            border-radius:8px;
            font-size:14px;
            text-align:center;
            font-weight:600;
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
        }

        .input-stock { background:var(--color-stock)!important; }
        .input-sold { background:var(--color-sold)!important; }
        .input-remaining { background:var(--color-remaining)!important; cursor:not-allowed; }

        .totals-row {
            margin-top:10px;
            padding-top:8px;
            border-top:1px solid var(--color-border);
            display:flex;
            justify-content:space-around;
            font-weight:600;
        }

        .total-item { text-align:center; }
        .total-label { font-size:10px; color:var(--color-text-secondary); margin-bottom:2px; }
        .total-value { font-size:18px; }

        .no-results {
            text-align:center;
            padding:40px 16px;
            color:var(--color-text-secondary);
            font-size:14px;
        }

        .action-buttons {
            position:fixed;
            bottom:0; left:0; right:0;
            background:var(--color-bg-secondary);
            padding:10px 10px calc(10px + env(safe-area-inset-bottom));
            display:flex;
            gap:8px;
            box-shadow:0 -4px 16px rgba(15,23,42,0.18);
            z-index:100;
        }

        .btn {
            flex:1;
            padding:12px 10px;
            border:none;
            border-radius:10px;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn-primary { background:var(--color-primary); color:white; }
        .btn-secondary {
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
            border:1px solid var(--color-border);
        }

        .btn:active { transform:scale(0.97); }

        .modal {
            display:none;
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background:rgba(15,23,42,0.45);
            z-index:200;
            padding:20px;
            overflow-y:auto;
        }
        .modal.active {
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .modal-content {
            background:var(--color-bg-secondary);
            border-radius:18px;
            padding:20px 18px 18px;
            width:100%;
            max-width:420px;
            max-height:82vh;
            overflow-y:auto;
        }
        .modal-header {
            font-size:18px;
            font-weight:600;
            margin-bottom:14px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .close-btn {
            width:30px; height:30px;
            border:none;
            background:var(--color-bg-primary);
            border-radius:10px;
            cursor:pointer;
            font-size:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--color-text-primary);
        }

        .form-group { margin-bottom:14px; }
        .form-group label {
            display:block;
            font-size:13px;
            font-weight:600;
            margin-bottom:6px;
            color:var(--color-text-secondary);
        }
        .form-group input {
            width:100%;
            padding:10px;
            border:1px solid var(--color-border);
            border-radius:10px;
            font-size:16px;
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
        }

        .size-inputs {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
        }

        .delete-btn {
            background:#ef4444;
            color:white;
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            margin-top:8px;
        }

        .edit-delete-buttons {
            display:flex;
            gap:8px;
            margin-bottom:8px;
        }
        .edit-btn, .item-delete-btn {
            flex:1;
            padding:8px;
            border:none;
            border-radius:8px;
            font-size:12px;
            font-weight:600;
            cursor:pointer;
        }
        .edit-btn { background:var(--color-primary); color:white; }
        .item-delete-btn { background:#ef4444; color:white; }

        .export-options { display:flex; flex-direction:column; gap:10px; }
        .export-btn {
            width:100%;
            padding:14px;
            border:1px solid var(--color-border);
            border-radius:10px;
            background:var(--color-bg-primary);
            color:var(--color-text-primary);
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        #printArea { display:none; }

        @media (max-width:480px) {
            .size-row {
                grid-template-columns:64px 1fr 1fr 1fr;
            }
        }

        @media print {
            body { padding:0; background:white; }
            .header, .search-box, .legend, .inventory-list,
            .action-buttons, .modal { display:none !important; }
            #printArea { display:block !important; padding:10px; }

            #printArea table { width:100%; border-collapse:collapse; margin-top:10px; }
            #printArea th, #printArea td {
                border:1px solid #ccc;
                padding:5px;
                font-size:11px;
            }
            #printArea th { background:#e5e7eb; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Metiabruz Stock</h1>
        <div class="summary">
            <div class="summary-card">
                <label>Total Stock</label>
                <div class="value" id="totalStock">0</div>
            </div>
            <div class="summary-card">
                <label>Total Sold</label>
                <div class="value" id="totalSold">0</div>
            </div>
            <div class="summary-card">
                <label>Remaining</label>
                <div class="value" id="totalRemaining">0</div>
            </div>
            <div class="summary-card">
                <label>Designs</label>
                <div class="value" id="designCount">0</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <input type="search" id="searchInput" placeholder="🔍 Search by Design No...">
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-box legend-stock"></div><span>Stock</span></div>
        <div class="legend-item"><div class="legend-box legend-sold"></div><span>Sold</span></div>
        <div class="legend-item"><div class="legend-box legend-remaining"></div><span>Remaining</span></div>
    </div>

    <div class="inventory-list" id="inventoryList"></div>

    <div id="printArea"></div>

    <div class="action-buttons">
        <button class="btn btn-secondary" onclick="openAddModal()">➕ Add</button>
        <button class="btn btn-secondary" onclick="printInventory()">🖨️ Print</button>
        <button class="btn btn-secondary" onclick="openExportModal()">📤 Export</button>
        <button class="btn btn-primary" onclick="saveToDevice()">💾 Save</button>
    </div>

    <div class="modal" id="addEditModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Add New Design</span>
                <button class="close-btn" onclick="closeModal('addEditModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Design Number</label>
                <input type="text" id="designInput" placeholder="e.g., 160-D">
            </div>
            <div class="form-group">
                <label>Stock Quantities</label>
                <div class="size-inputs">
                    <input type="number" id="stock0" placeholder="22x32" min="0" value="0">
                    <input type="number" id="stock1" placeholder="34x36" min="0" value="0">
                    <input type="number" id="stock2" placeholder="16x18" min="0" value="0">
                    <input type="number" id="stock3" placeholder="26x30" min="0" value="0">
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveDesign()">Save Design</button>
            <button class="delete-btn" id="deleteCurrentBtn" style="display:none;" onclick="deleteCurrentDesign()">Delete Design</button>
        </div>
    </div>

    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Export Data</span>
                <button class="close-btn" onclick="closeModal('exportModal')">✕</button>
            </div>
            <div class="export-options">
                <button class="export-btn" onclick="exportAsCSV()">📄 Export as CSV</button>
                <button class="export-btn" onclick="exportAsJSON()">📋 Export as JSON</button>
                <button class="export-btn" onclick="copyToClipboard()">📑 Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        const inventory = []; // start blank
        const sizes = ["22x32","34x36","16x18","26x30"];
        let editingIndex = -1;

        function loadFromDevice() {
            try {
                const saved = localStorage.getItem('metiabruzInventory');
                if (saved) {
                    const loaded = JSON.parse(saved);
                    if (Array.isArray(loaded)) {
                        inventory.length = 0;
                        inventory.push(...loaded);
                    }
                }
            } catch(e) {
                console.error(e);
            }
        }

        function saveToDevice() {
            try {
                localStorage.setItem('metiabruzInventory', JSON.stringify(inventory));
                alert('Saved on this device');
            } catch(e) {
                alert('Could not save');
            }
        }

        function renderInventory(filter='') {
            const container = document.getElementById('inventoryList');
            container.innerHTML = '';

            const filtered = filter
                ? inventory.filter(i=>i.design.toLowerCase().includes(filter.toLowerCase()))
                : inventory;

            if (!filtered.length) {
                container.innerHTML = '<div class="no-results">No designs yet. Tap ➕ Add to start.</div>';
                document.getElementById('designCount').textContent = inventory.length;
                updateTotals();
                return;
            }

            filtered.forEach((item,index)=>{
                const card = document.createElement('div');
                card.className = 'item-card';

                const totalStock = item.stock.reduce((a,b)=>a+b,0);
                const totalSold = item.sold.reduce((a,b)=>a+b,0);
                const totalRemaining = totalStock - totalSold;

                card.innerHTML = `
                    <div class="item-header">
                        <span>${item.design}</span>
                    </div>
                    <div class="edit-delete-buttons">
                        <button class="edit-btn" onclick="openEditModal(${index})">✏️ Edit</button>
                        <button class="item-delete-btn" onclick="deleteDesign(${index})">🗑️ Delete</button>
                    </div>
                    <div class="size-grid">
                        ${sizes.map((size,i)=>`
                            <div class="size-row">
                                <div class="size-label">${size}</div>
                                <div class="input-group">
                                    <label>Stock</label>
                                    <input type="number" class="input-stock"
                                        value="${item.stock[i]}"
                                        onchange="updateStock(${index},${i},this.value)" min="0">
                                </div>
                                <div class="input-group">
                                    <label>Sold</label>
                                    <input type="number" class="input-sold"
                                        value="${item.sold[i]}"
                                        onchange="updateSold(${index},${i},this.value)" min="0">
                                </div>
                                <div class="input-group">
                                    <label>Left</label>
                                    <input type="number" class="input-remaining"
                                        value="${item.stock[i]-item.sold[i]}" readonly>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="totals-row">
                        <div class="total-item">
                            <div class="total-label">Total Stock</div>
                            <div class="total-value">${totalStock}</div>
                        </div>
                        <div class="total-item">
                            <div class="total-label">Total Sold</div>
                            <div class="total-value">${totalSold}</div>
                        </div>
                        <div class="total-item">
                            <div class="total-label">Remaining</div>
                            <div class="total-value">${totalRemaining}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('designCount').textContent = inventory.length;
            updateTotals();
        }

        function updateStock(itemIndex,sizeIndex,value){
            const v = parseInt(value)||0;
            inventory[itemIndex].stock[sizeIndex] = v;
            renderInventory(document.getElementById('searchInput').value);
        }

        function updateSold(itemIndex,sizeIndex,value){
            const sold = parseInt(value)||0;
            const stock = inventory[itemIndex].stock[sizeIndex];
            if (sold>stock){
                alert('Cannot sell more than stock');
                inventory[itemIndex].sold[sizeIndex]=stock;
            } else {
                inventory[itemIndex].sold[sizeIndex]=sold;
            }
            renderInventory(document.getElementById('searchInput').value);
        }

        function updateTotals(){
            let totalStock=0,totalSold=0;
            inventory.forEach(item=>{
                totalStock+=item.stock.reduce((a,b)=>a+b,0);
                totalSold+=item.sold.reduce((a,b)=>a+b,0);
            });
            document.getElementById('totalStock').textContent = totalStock;
            document.getElementById('totalSold').textContent = totalSold;
            document.getElementById('totalRemaining').textContent = totalStock-totalSold;
        }

        document.getElementById('searchInput').addEventListener('input',e=>{
            renderInventory(e.target.value);
        });

        function openAddModal(){
            editingIndex=-1;
            document.getElementById('modalTitle').textContent='Add New Design';
            document.getElementById('designInput').value='';
            ['stock0','stock1','stock2','stock3'].forEach(id=>document.getElementById(id).value='0');
            document.getElementById('deleteCurrentBtn').style.display='none';
            document.getElementById('addEditModal').classList.add('active');
        }

        function openEditModal(index){
            editingIndex=index;
            const item=inventory[index];
            document.getElementById('modalTitle').textContent='Edit Design';
            document.getElementById('designInput').value=item.design;
            document.getElementById('stock0').value=item.stock[0];
            document.getElementById('stock1').value=item.stock[1];
            document.getElementById('stock2').value=item.stock[2];
            document.getElementById('stock3').value=item.stock[3];
            document.getElementById('deleteCurrentBtn').style.display='block';
            document.getElementById('addEditModal').classList.add('active');
        }

        function closeModal(id){
            document.getElementById(id).classList.remove('active');
        }

        function saveDesign(){
            const design=document.getElementById('designInput').value.trim();
            if(!design){alert('Enter design number');return;}
            const stock=[
                parseInt(document.getElementById('stock0').value)||0,
                parseInt(document.getElementById('stock1').value)||0,
                parseInt(document.getElementById('stock2').value)||0,
                parseInt(document.getElementById('stock3').value)||0
            ];
            if(editingIndex>=0){
                inventory[editingIndex].design=design;
                inventory[editingIndex].stock=stock;
            } else {
                inventory.push({design,stock,sold:[0,0,0,0]});
            }
            closeModal('addEditModal');
            renderInventory();
            saveToDevice();
        }

        function deleteDesign(index){
            if(confirm(`Delete design ${inventory[index].design}?`)){
                inventory.splice(index,1);
                renderInventory();
                saveToDevice();
            }
        }

        function deleteCurrentDesign(){
            if(editingIndex>=0){ deleteDesign(editingIndex); closeModal('addEditModal'); }
        }

        function openExportModal(){ document.getElementById('exportModal').classList.add('active'); }

        function exportAsCSV(){
            let csv='Design No,Stock 22x32,Stock 34x36,Stock 16x18,Stock 26x30,Sold 22x32,Sold 34x36,Sold 16x18,Sold 26x30,Remaining 22x32,Remaining 34x36,Remaining 16x18,Remaining 26x30\n';
            inventory.forEach(item=>{
                const rem=item.stock.map((s,i)=>s-item.sold[i]);
                csv+=`${item.design},${item.stock.join(',')},${item.sold.join(',')},${rem.join(',')}\n`;
            });
            const blob=new Blob([csv],{type:'text/csv'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url;a.download='metiabruz_stock.csv';a.click();
            closeModal('exportModal');
        }

        function exportAsJSON(){
            const dataStr=JSON.stringify(inventory,null,2);
            const blob=new Blob([dataStr],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url;a.download='metiabruz_stock.json';a.click();
            closeModal('exportModal');
        }

        function copyToClipboard(){
            let text='Design No\tStock 22x32\tStock 34x36\tStock 16x18\tStock 26x30\tSold 22x32\tSold 34x36\tSold 16x18\tSold 26x30\n';
            inventory.forEach(item=>{
                text+=`${item.design}\t${item.stock.join('\t')}\t${item.sold.join('\t')}\n`;
            });
            navigator.clipboard.writeText(text).then(()=>{
                alert('Copied');
                closeModal('exportModal');
            });
        }

        function printInventory(){
            const printDiv=document.getElementById('printArea');
            let totalStock=0,totalSold=0;
            inventory.forEach(item=>{
                totalStock+=item.stock.reduce((a,b)=>a+b,0);
                totalSold+=item.sold.reduce((a,b)=>a+b,0);
            });
            const totalRemaining=totalStock-totalSold;

            let html=`
                <h2 style="text-align:center;margin-bottom:4px;">Metiabruz Stock List</h2>
                <div style="text-align:center;font-size:11px;color:#555;">Printed on ${new Date().toLocaleString()}</div>
                <div style="display:flex;justify-content:space-around;margin:10px 0;font-size:11px;">
                    <div><strong>Total Stock:</strong> ${totalStock}</div>
                    <div><strong>Total Sold:</strong> ${totalSold}</div>
                    <div><strong>Remaining:</strong> ${totalRemaining}</div>
                    <div><strong>Designs:</strong> ${inventory.length}</div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Design</th>
                            <th>Stk 22x32</th><th>Stk 34x36</th><th>Stk 16x18</th><th>Stk 26x30</th>
                            <th>Sold 22x32</th><th>Sold 34x36</th><th>Sold 16x18</th><th>Sold 26x30</th>
                            <th>Rem 22x32</th><th>Rem 34x36</th><th>Rem 16x18</th><th>Rem 26x30</th>
                            <th>Total Rem</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            inventory.forEach(item=>{
                const rem=item.stock.map((s,i)=>s-item.sold[i]);
                const itemTotal=rem.reduce((a,b)=>a+b,0);
                html+=`
                    <tr>
                        <td>${item.design}</td>
                        <td>${item.stock[0]}</td><td>${item.stock[1]}</td><td>${item.stock[2]}</td><td>${item.stock[3]}</td>
                        <td>${item.sold[0]}</td><td>${item.sold[1]}</td><td>${item.sold[2]}</td><td>${item.sold[3]}</td>
                        <td>${rem[0]}</td><td>${rem[1]}</td><td>${rem[2]}</td><td>${rem[3]}</td>
                        <td>${itemTotal}</td>
                    </tr>
                `;
            });
            html+='</tbody></table>';
            printDiv.innerHTML=html;
            window.print();
        }

        document.querySelectorAll('.modal').forEach(m=>{
            m.addEventListener('click',e=>{ if(e.target===m) closeModal(m.id); });
        });

        loadFromDevice();
        renderInventory();
    </script>
</body>
</html>
