<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #a1a1a6;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --warning: #ffd60a;
  --border: rgba(255, 255, 255, 0.12);
  --glass: rgba(28, 28, 30, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 120px; }

/* iPhone Premium Header */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-bottom: 0.5px solid var(--border); padding: 50px 20px 15px;
}
.view-tabs { display: flex; background: var(--card-elevated); padding: 3px; border-radius: 10px; margin-top: 15px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; color: var(--text-secondary); background: none; }
.tab.active { background: #48484a; color: white; }

/* Stats & List */
.content-section { padding: 20px; display: none; }
.content-section.active { display: block; }
.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.summary-card { background: var(--card); border: 0.5px solid var(--border); padding: 15px; border-radius: 16px; }
.summary-card label { font-size: 10px; color: var(--text-secondary); font-weight: 700; display: block; margin-bottom: 4px; }
.summary-card .value { font-size: 22px; font-weight: 800; }

.item-card { background: var(--card); border-radius: 20px; padding: 20px; border: 0.5px solid var(--border); margin-bottom: 16px; }
.history-item { border-left: 3px solid var(--primary); padding: 12px; background: var(--card-elevated); border-radius: 12px; margin-bottom: 10px; }
.history-add { border-left-color: var(--success); }
.history-sell { border-left-color: var(--warning); }

/* Bottom Dock */
.bottom-dock {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--glass); backdrop-filter: blur(30px);
  border-top: 0.5px solid var(--border); padding: 15px 20px 35px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 1000;
}
.btn-dock { height: 50px; border-radius: 14px; border: none; font-weight: 700; font-size: 15px; transition: 0.1s; }
.btn-dock:active { transform: scale(0.96); opacity: 0.8; }
.btn-dock-add { background: var(--primary); color: white; }
.btn-dock-sell { background: white; color: black; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: flex-end; }
.modal.active { display: flex; }
.modal-content { background: #1c1c1e; width: 100%; border-radius: 30px 30px 0 0; padding: 30px 20px 50px; animation: slideUp 0.4s cubic-bezier(0,1,0,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.ios-input { width: 100%; background: #2c2c2e; border: none; border-radius: 12px; padding: 16px; color: white; font-size: 17px; margin-bottom: 15px; }
.ios-select { background: #2c2c2e; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; }
</style>
</head>
<body>

<div class="header-container">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size: 24px; font-weight: 800;">Stock Pro</h2>
    <div id="statusIndicator" style="font-size:10px; font-weight:bold; color:var(--text-secondary)">Online</div>
  </div>
  
  <div class="view-tabs">
    <button class="tab active" onclick="switchView('inventory', this)">Inventory</button>
    <button class="tab" onclick="switchView('history', this)">History Log</button>
  </div>
</div>

<div id="inventorySection" class="content-section active">
  <div class="summary">
    <div class="summary-card"><label>TOTAL STOCK</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>AVAILABLE</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
  </div>
  <div id="inventoryList"></div>
</div>

<div id="historySection" class="content-section">
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button class="tab active" style="background:#2c2c2e" onclick="renderHistory('day')">Today</button>
        <button class="tab" style="background:#2c2c2e" onclick="renderHistory('week')">This Week</button>
    </div>
    <div id="historyList"></div>
</div>

<div class="bottom-dock">
  <button class="btn-dock btn-dock-add" onclick="openModal('add')">Add Stock</button>
  <button class="btn-dock btn-dock-sell" onclick="openModal('sell')">Sale Item</button>
</div>

<div class="modal" id="entryModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="width:36px; height:5px; background:rgba(255,255,255,0.2); border-radius:3px; margin:0 auto 20px;"></div>
    <h2 id="modalTitle">Entry</h2>
    <input type="text" id="designInput" class="ios-input" placeholder="Design No." oninput="syncPreview(this.value)">
    <div id="previewArea" style="margin-bottom:15px; display:none;"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
        <div><label style="font-size:10px; color:var(--text-secondary)">22x32</label><select id="m0" class="ios-select"></select></div>
        <div><label style="font-size:10px; color:var(--text-secondary)">34x36</label><select id="m1" class="ios-select"></select></div>
        <div><label style="font-size:10px; color:var(--text-secondary)">16x18</label><select id="m2" class="ios-select"></select></div>
        <div><label style="font-size:10px; color:var(--text-secondary)">26x30</label><select id="m3" class="ios-select"></select></div>
    </div>
    <button id="modalSubmit" class="btn-dock btn-dock-add" style="width:100%" onclick="processEntry()">Confirm</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
let transactions = JSON.parse(localStorage.getItem('transactionCache') || '[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue') || '[]');
let mode = 'add';
const sizes = ["22x32", "34x36", "16x18", "26x30"];

function switchView(view, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.getElementById(view + 'Section').classList.add('active');
    if(view === 'history') renderHistory('day');
}

function openModal(m) {
    mode = m;
    document.getElementById('designInput').value = '';
    document.getElementById('modalTitle').innerText = mode === 'add' ? "Add Stock" : "Sale Item";
    sizes.forEach((_, i) => document.getElementById(`m${i}`).innerHTML = getOpts(mode === 'add' ? 200 : 0));
    document.getElementById('entryModal').classList.add('active');
}

function getOpts(max) {
    let h = '<option value="0">0</option>';
    for(let i=1; i<=max; i++) h += `<option value="${i}">${i}</option>`;
    return h;
}

function syncPreview(val) {
    const item = inventory.find(it => it.design.toUpperCase() === val.trim().toUpperCase());
    const area = document.getElementById('previewArea');
    if(item) {
        area.style.display = 'block';
        area.innerHTML = `<div style="padding:10px; background:#2c2c2e; border-radius:10px; font-size:12px;">Stock: ${item.stock.map((s,i)=>sizes[i]+': '+(s-item.sold[i])).join(' | ')}</div>`;
        if(mode==='sell') sizes.forEach((_, i) => document.getElementById(`m${i}`).innerHTML = getOpts(item.stock[i]-item.sold[i]));
    } else { area.style.display = 'none'; }
}

async function processEntry() {
    const dNo = document.getElementById('designInput').value.trim().toUpperCase();
    const qtys = [ +m0.value, +m1.value, +m2.value, +m3.value ];
    if(!dNo || qtys.every(v=>v===0)) return;

    let target = inventory.find(it => it.design === dNo);
    const trans = { id: crypto.randomUUID(), design: dNo, type: mode, qtys: [...qtys], created_at: new Date().toISOString() };

    if(mode === 'add') {
        if(target) target.stock = target.stock.map((v,i)=>v+qtys[i]);
        else inventory.unshift({ id: crypto.randomUUID(), design: dNo, stock: qtys, sold: [0,0,0,0] });
    } else {
        if(!target) return alert("Not in stock");
        target.sold = target.sold.map((v,i)=>v+qtys[i]);
    }

    transactions.unshift(trans);
    addToQueue(trans);
    closeModal(); render();
}

function addToQueue(trans) {
    syncQueue.push({ type: 'transaction', data: trans });
    // Also push the inventory update
    const target = inventory.find(it => it.design === trans.design);
    syncQueue.push({ type: 'inventory', data: target });
    localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
    localStorage.setItem('transactionCache', JSON.stringify(transactions));
}

function render() {
    const list = document.getElementById('inventoryList');
    list.innerHTML = '';
    let ts=0, tr=0;
    inventory.forEach(item => {
        let rows = '';
        item.stock.forEach((s, i) => {
            const left = s - item.sold[i];
            ts += s; tr += left;
            rows += `<div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:5px; margin-bottom:5px; font-size:12px;">
                <div style="color:var(--text-secondary)">${sizes[i]}</div><div>${s}</div><div>${item.sold[i]}</div><div style="font-weight:bold; color:${left<5?'var(--danger)':'var(--success)'}">${left}</div>
            </div>`;
        });
        list.innerHTML += `<div class="item-card"><div style="font-weight:800; color:var(--primary); margin-bottom:10px;"># ${item.design}</div>${rows}</div>`;
    });
    document.getElementById('totalStock').innerText = ts;
    document.getElementById('totalRemaining').innerText = tr;
}

function renderHistory(range) {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    const now = new Date();
    const filtered = transactions.filter(t => {
        const tDate = new Date(t.created_at);
        if(range === 'day') return tDate.toDateString() === now.toDateString();
        return (now - tDate) / (1000*60*60*24) <= 7;
    });

    filtered.forEach(t => {
        list.innerHTML += `<div class="history-item history-${t.type}">
            <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
                <span>${t.type.toUpperCase()}: #${t.design}</span>
                <span style="color:var(--text-secondary); font-weight:normal;">${new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div style="font-size:11px; margin-top:5px; opacity:0.8;">${t.qtys.map((q,i)=>q>0?sizes[i]+': '+q : '').filter(v=>v).join(' | ')}</div>
        </div>`;
    });
}

async function syncNow() {
    if(!navigator.onLine || syncQueue.length === 0) return;
    const task = syncQueue[0];
    try {
        if(task.type === 'transaction') await supabaseClient.from('transactions').insert(task.data);
        if(task.type === 'inventory') await supabaseClient.from('inventory').upsert(task.data);
        syncQueue.shift();
        localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
    } catch(e) {}
}

async function fetchData() {
    const {data: inv} = await supabaseClient.from('inventory').select('*');
    const {data: trans} = await supabaseClient.from('transactions').select('*').order('created_at', {ascending:false}).limit(100);
    if(inv) inventory = inv;
    if(trans) transactions = trans;
    render();
}

function closeModal() { document.getElementById('entryModal').classList.remove('active'); }
fetchData();
setInterval(syncNow, 5000);
</script>
</body>
</html>
