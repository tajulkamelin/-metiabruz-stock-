<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dilkhus Fashion Stock</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --primary: #e91e63; 
  --danger: #ff453a;
  --success: #32d74b;
  --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

/* --- Mobile UI --- */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 15px 16px 12px; padding-top: max(15px, env(safe-area-inset-top));
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.brand-box { display: flex; align-items: center; gap: 12px; }
.brand-logo { height: 42px; width: 42px; border-radius: 50%; border: 1px solid var(--primary); background: white; padding: 2px; }
.brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

#statusIndicator { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); padding: 10px 4px; border-radius: 14px; text-align: center; }
.summary-card label { font-size: 8px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; display: block; }
.summary-card .value { font-size: 15px; font-weight: 700; }

.controls-area { padding: 16px; }
.search-wrapper { background: var(--card-elevated); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 17px; outline: none; }

.inventory-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.item-card { background: var(--card); border-radius: 20px; padding: 18px; border: 1px solid var(--border); }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.design-badge { background: var(--primary); color: white; padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 16px; }

.grid-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 10px; align-items: center; margin-bottom: 8px; }
.label-style { font-size: 12px; font-weight: 700; color: var(--text-secondary); }

.qty-input { background: var(--card-elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 4px; border-radius: 10px; font-size: 14px; font-weight: 700; text-align: center; width: 100%; }
.remain-pill { background: rgba(50, 215, 75, 0.15); color: var(--success); padding: 8px; border-radius: 10px; font-weight: 800; text-align: center; font-size: 14px; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 16px calc(15px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; border-top: 1px solid var(--border); z-index: 100; }
.btn-main { background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-icon { background: var(--card-elevated); color: var(--text); border: none; border-radius: 14px; padding: 12px; font-size: 18px; cursor: pointer; }

/* --- Modal --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: flex-end; opacity: 0; transition: 0.2s; }
.modal.active { display: flex; opacity: 1; }
.modal-content { background: var(--card); width: 100%; border-radius: 30px 30px 0 0; padding: 25px; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* --- Print --- */
#printArea { display: none; }
@media print {
  .header-container, .controls-area, .bottom-nav, .inventory-list, .modal { display: none !important; }
  #printArea { display: block !important; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 8px; text-align: center; color: black; }
}
</style>
</head>
<body>

<div id="printArea">
  <div style="text-align:center; margin-bottom:20px;">
    <h1>Dilkhus Fashion Stock Report</h1>
    <p id="printDate"></p>
  </div>
  <table>
    <thead>
      <tr>
        <th>Design</th>
        <th colspan="4">Stock (22-32, 34-36, 16-18, 26-30)</th>
        <th colspan="4">Sold</th>
        <th>Total Rem</th>
      </tr>
    </thead>
    <tbody id="printTableBody"></tbody>
  </table>
</div>

<div class="header-container">
  <div class="top-bar">
    <div class="brand-box">
        <img src="https://i.ibb.co/XkyYmN9/dilkhus-logo.png" class="brand-logo" alt="Logo">
        <span class="brand-name">Dilkhus</span>
    </div>
    <div id="statusIndicator">Ready</div>
  </div>
  <div class="summary">
    <div class="summary-card"><label>Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Balance</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
    <div class="summary-card"><label>Items</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-wrapper">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design..." onkeyup="render()">
    <select id="sortSelect" onchange="haptic(); render()" style="background:none; border:none; color:var(--primary); font-weight:bold;">
      <option value="recent">Recent</option>
      <option value="asc">A-Z</option>
      <option value="desc">Z-A</option>
    </select>
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="bottom-nav">
  <button class="btn-main" onclick="haptic(); openAdd()">+ NEW DESIGN</button>
  <button class="btn-icon" onclick="haptic(); fetchData()">🔄</button>
  <button class="btn-icon" onclick="haptic(); window.print()">🖨️</button>
  <button class="btn-icon" onclick="haptic(); syncNow()">☁️</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">Add New Design</h3>
    <input type="text" id="manualDesignInput" class="qty-input" style="text-align:left; padding:15px; margin-bottom:15px;" placeholder="Design Number">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <select id="s0" class="qty-input"></select>
        <select id="s1" class="qty-input"></select>
        <select id="s2" class="qty-input"></select>
        <select id="s3" class="qty-input"></select>
    </div>
    <button class="btn-main" style="width:100%; padding:18px; margin-top:20px;" onclick="handleAdd()">Save to Cloud</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// --- SUPABASE CONFIG ---
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S';
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
const sizes = ["22x32", "34x36", "16x18", "26x30"];

function haptic() {
    if (window.navigator.vibrate) window.navigator.vibrate(12);
}

function initQtys() {
    let opts = ''; for(let i=0; i<=200; i++) opts += `<option value="${i}">${i}</option>`;
    ['s0','s1','s2','s3'].forEach((id, idx) => {
        document.getElementById(id).innerHTML = `<option value="0" selected>${sizes[idx]}: 0</option>` + opts;
    });
}
initQtys();

async function handleAdd() {
    haptic();
    const dVal = document.getElementById('manualDesignInput').value.trim();
    if(!dVal) return alert("Enter Design No");
    
    const newItem = {
        id: crypto.randomUUID(),
        design: dVal,
        stock: [+s0.value, +s1.value, +s2.value, +s3.value],
        sold: [0, 0, 0, 0],
        created_at: new Date()
    };

    inventory.unshift(newItem);
    render();
    closeAdd();

    const { error } = await supabaseClient.from('inventory').insert(newItem);
    if (error) console.error("Sync Error:", error);
    else fetchData();
}

function openAdd() { addModal.classList.add('active'); }
function closeAdd() { addModal.classList.remove('active'); }

async function upd(itemId, sizeIdx, val, field) {
    haptic();
    const item = inventory.find(x => x.id === itemId);
    if(!item) return;

    if(field === 'stock') item.stock[sizeIdx] = +val;
    else item.sold[sizeIdx] = +val;

    render();

    await supabaseClient.from('inventory').update({
        stock: item.stock,
        sold: item.sold
    }).eq('id', itemId);
}

async function del(id) {
    if(!confirm("Delete this design?")) return;
    haptic();
    inventory = inventory.filter(x => x.id !== id);
    render();
    await supabaseClient.from('inventory').delete().eq('id', id);
}

function render() {
    const term = searchInput.value.toLowerCase();
    const mode = sortSelect.value;
    
    let list = [...inventory].filter(i => i.design.toLowerCase().includes(term));
    
    if(mode === 'asc') list.sort((a,b) => a.design.localeCompare(b.design, undefined, {numeric: true}));
    if(mode === 'desc') list.sort((a,b) => b.design.localeCompare(a.design, undefined, {numeric: true}));

    inventoryList.innerHTML = '';
    let pRows = '';
    let ts=0, td=0;

    list.forEach(item => {
        let rowsHtml = '';
        let itemRem = 0;

        item.stock.forEach((sVal, i) => {
            const rem = sVal - item.sold[i];
            ts += sVal; td += item.sold[i]; itemRem += rem;
            rowsHtml += `
            <div class="grid-row">
                <div class="label-style">${sizes[i]}</div>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'stock')">${getOpts(sVal)}</select>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'sold')">${getOpts(item.sold[i])}</select>
                <div class="remain-pill">${rem}</div>
            </div>`;
        });

        inventoryList.innerHTML += `
        <div class="item-card">
            <div class="item-header">
                <span class="design-badge"># ${item.design}</span>
                <button style="background:none; border:none; color:var(--danger); font-weight:bold;" onclick="del('${item.id}')">REMOVE</button>
            </div>
            ${rowsHtml}
        </div>`;

        pRows += `<tr><td>${item.design}</td><td>${item.stock.join(',')}</td><td>${item.sold.join(',')}</td><td>${itemRem}</td></tr>`;
    });

    totalStock.innerText = ts;
    totalSold.innerText = td;
    totalRemaining.innerText = ts - td;
    designCount.innerText = inventory.length;
    printTableBody.innerHTML = pRows;
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
}

function getOpts(selected) {
    let h = '';
    for(let i=0; i<=200; i++) {
        h += `<option value="${i}" ${i == selected ? 'selected' : ''}>${i}</option>`;
    }
    return h;
}

async function fetchData() {
    statusIndicator.innerText = "Syncing...";
    const { data, error } = await supabaseClient.from('inventory').select('*').order('created_at', {ascending: false});
    if(!error && data) {
        inventory = data;
        render();
        statusIndicator.innerText = "Online • Synced";
    } else {
        statusIndicator.innerText = "Offline Mode";
    }
}

async function syncNow() {
    haptic();
    fetchData();
}

render();
fetchData();
</script>
</body>
</html>
