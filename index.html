<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metiabruz Stock Tracker</title>

<style>
/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */
:root {
  --color-bg-primary:#f8fafc;
  --color-bg-secondary:#ffffff;
  --color-text-primary:#0f172a;
  --color-text-secondary:#475569;
  --color-border:#e2e8f0;
  --color-stock:#dbeafe;
  --color-sold:#fed7aa;
  --color-remaining:#d1fae5;
  --color-primary:#0ea5e9;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-bg-primary:#0f172a;
    --color-bg-secondary:#1e293b;
    --color-text-primary:#f1f5f9;
    --color-text-secondary:#cbd5e1;
    --color-border:#334155;
    --color-stock:#1e3a8a;
    --color-sold:#92400e;
    --color-remaining:#064e3b;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background:var(--color-bg-primary);
  color:var(--color-text-primary);
  padding:12px;
  padding-bottom:90px;
}
</style>
</head>

<body>

<h2>📦 Metiabruz Stock</h2>
<input id="searchInput" placeholder="Search Design" />

<div id="inventoryList"></div>

<!-- ================= SUPABASE ================= -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabase = supabaseJs.createClient(
  'https://yhlfqpiwevsehlgbhxtk.supabase.co',
  'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'
);
</script>

<!-- ================= APP LOGIC ================= -->
<script>
const inventory = [];
const sizes = ["22x32","34x36","16x18","26x30"];
let editingIndex = -1;

/* ---------- LOAD ---------- */
async function loadFromSupabase(){
  const { data, error } = await supabase
    .from('inventory')
    .select('*')
    .order('design');

  if(error){ console.error(error); return; }

  inventory.length = 0;
  inventory.push(...data);
  renderInventory();
}

/* ---------- RENDER ---------- */
function renderInventory(filter=''){
  const box = document.getElementById('inventoryList');
  box.innerHTML = '';

  const list = filter
    ? inventory.filter(i=>i.design.toLowerCase().includes(filter.toLowerCase()))
    : inventory;

  list.forEach((item,index)=>{
    const div = document.createElement('div');
    div.innerHTML = `
      <h3>${item.design}</h3>
      ${sizes.map((s,i)=>`
        ${s} :
        <input type="number" value="${item.stock[i]}"
          onchange="updateStock(${index},${i},this.value)">
        Sold:
        <input type="number" value="${item.sold[i]}"
          onchange="updateSold(${index},${i},this.value)">
        <br>
      `).join('')}
      <hr>
    `;
    box.appendChild(div);
  });
}

/* ---------- SAVE / UPDATE ---------- */
async function saveDesign(){
  const design = prompt("Design no?");
  if(!design) return;

  const stock = [0,0,0,0];
  const sold  = [0,0,0,0];

  await supabase.from('inventory').upsert({ design, stock, sold });
}

async function updateStock(i,s,v){
  const item = inventory[i];
  const stock = [...item.stock];
  stock[s] = +v||0;
  await supabase.from('inventory').update({stock}).eq('id',item.id);
}

async function updateSold(i,s,v){
  const item = inventory[i];
  const sold = [...item.sold];
  sold[s] = Math.min(+v||0,item.stock[s]);
  await supabase.from('inventory').update({sold}).eq('id',item.id);
}

/* ---------- REALTIME ---------- */
supabase
  .channel('inventory-live')
  .on(
    'postgres_changes',
    { event:'*', schema:'public', table:'inventory' },
    loadFromSupabase
  )
  .subscribe();

/* ---------- SEARCH ---------- */
document.getElementById('searchInput')
  .addEventListener('input',e=>renderInventory(e.target.value));

/* ---------- START ---------- */
loadFromSupabase();
</script>

</body>
</html>
