<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
body { background: var(--bg); color: var(--text); padding-bottom: 120px; }

/* --- Mobile UI Styles --- */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 20px 16px 12px; padding-top: max(20px, env(safe-area-inset-top));
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
#statusIndicator { font-size: 12px; font-weight: 600; color: var(--text-secondary); background: var(--card-elevated); padding: 4px 12px; border-radius: 20px; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); padding: 12px 4px; border-radius: 12px; text-align: center; }
.summary-card label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 2px; }
.summary-card .value { font-size: 16px; font-weight: 700; }

.controls-area { padding: 16px; }
.search-wrapper {
  background: var(--card-elevated); border-radius: 12px;
  padding: 12px; display: flex; align-items: center; gap: 10px;
}
.search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 17px; outline: none; }

.inventory-list { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.item-card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border); transition: transform 0.3s; }
.highlight-card { border: 2px solid var(--primary); transform: scale(1.02); }

.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.design-badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 16px; }

.grid-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.label-style { font-size: 13px; font-weight: 600; color: var(--text-secondary); }

.qty-input {
    background: var(--card-elevated); border: 1px solid var(--border);
    color: var(--text); padding: 8px 4px; border-radius: 8px;
    font-size: 14px; font-weight: 600; text-align: center; appearance: none; width: 100%;
}
.remain-pill { background: rgba(50, 215, 75, 0.1); color: var(--success); padding: 6px; border-radius: 8px; font-weight: 700; text-align: center; font-size: 14px; }

.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px;
    border-top: 1px solid var(--border); z-index: 100;
}
.btn-main { background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-icon { background: var(--card-elevated); color: var(--text); border: none; border-radius: 12px; padding: 12px; font-size: 18px; cursor: pointer; }

/* --- Modal --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; opacity: 0; transition: 0.2s; }
.modal.active { display: flex; opacity: 1; }
.modal-content { 
    background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 24px; 
    padding-bottom: max(24px, env(safe-area-inset-bottom)); animation: slideUp 0.3s ease-out; 
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* --- Print Styles --- */
#printArea { display: none; }
@media print {
  .header-container, .controls-area, .bottom-nav, .inventory-list, .modal { display: none !important; }
  body { background: white; color: black; padding: 0; }
  #printArea { display: block !important; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #333; padding: 6px; text-align: center; font-size: 11px; }
}
</style>
</head>
<body>

<div id="printArea">
  <div style="text-align:center; margin-bottom:20px;">
    <h1>Metiabruz Stock List</h1>
    <p id="printDate"></p>
  </div>
  <table>
    <thead>
      <tr>
        <th rowspan="2">Design</th>
        <th colspan="4">Stock</th><th colspan="4">Sold</th><th colspan="4">Rem</th><th>Total</th>
      </tr>
      <tr>
        <th>22-32</th><th>34-36</th><th>16-18</th><th>26-30</th>
        <th>22-32</th><th>34-36</th><th>16-18</th><th>26-30</th>
        <th>22-32</th><th>34-36</th><th>16-18</th><th>26-30</th>
        <th>Rem</th>
      </tr>
    </thead>
    <tbody id="printTableBody"></tbody>
  </table>
</div>

<div class="header-container">
  <div class="top-bar">
    <h2>📦 Stock</h2>
    <div id="statusIndicator">Syncing...</div>
  </div>
  <div class="summary">
    <div class="summary-card"><label>Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Left</label><div class="value" id="totalRemaining" style="color:var(--success)">0</div></div>
    <div class="summary-card"><label>Items</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-wrapper">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design No..." onkeyup="render()">
    <select id="sortSelect" onchange="setSort(this.value)" style="background:none; border:none; color:var(--primary); font-weight:700;">
      <option value="recent">Recent</option>
      <option value="asc">A→Z</option>
      <option value="desc">Z→A</option>
    </select>
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="bottom-nav">
  <button class="btn-main" onclick="openAdd()">+ ADD DESIGN</button>
  <button class="btn-icon" onclick="fetchData()">🔄</button>
  <button class="btn-icon" onclick="window.print()">🖨️</button>
  <button class="btn-icon" onclick="toggleSelect()">🛠️</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <div style="width:40px;height:5px;background:rgba(255,255,255,0.2);margin:0 auto 20px auto;border-radius:5px;"></div>
    <h3 style="margin-bottom:15px">Design Entry</h3>
    
    <input type="text" id="manualDesignInput" list="designSuggestions" class="qty-input" 
           style="text-align:left; padding:14px; font-size:16px; margin-bottom:15px;" 
           placeholder="Design Number..." onchange="checkExistingDesign(this.value)">
    <datalist id="designSuggestions"></datalist>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <select id="s0" class="qty-input"></select>
        <select id="s1" class="qty-input"></select>
        <select id="s2" class="qty-input"></select>
        <select id="s3" class="qty-input"></select>
    </div>
    <button id="saveBtn" class="btn-main" style="width:100%; padding:16px; margin-top:20px" onclick="handleAdd()">Save Design</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache')||'[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue')||'[]');
let sortMode = 'recent';
let editingId = null; // Track if we are updating an existing design
const sizes=["22x32","34x36","16x18","26x30"];

// --- Core Logic ---

function getOpts(selectedVal, labelPrefix = "") {
    let html = '';
    for(let i=0; i<=100; i++) {
        let display = labelPrefix ? `${labelPrefix}: ${i}` : i;
        html += `<option value="${i}" ${i == selectedVal ? 'selected' : ''}>${display}</option>`;
    }
    return html;
}

function updateSuggestions() {
    const list = document.getElementById('designSuggestions');
    list.innerHTML = inventory.map(item => `<option value="${item.design}">`).join('');
}

function checkExistingDesign(val) {
    const existing = inventory.find(item => item.design.toLowerCase() === val.trim().toLowerCase());
    const saveBtn = document.getElementById('saveBtn');
    
    if (existing) {
        if(confirm(`Design #${val} already exists. Update quantities?`)) {
            editingId = existing.id;
            saveBtn.innerText = "Update Existing Design";
            // Pre-fill existing stock
            sizes.forEach((s, i) => {
                document.getElementById(`s${i}`).innerHTML = getOpts(existing.stock[i], s);
            });
        } else {
            document.getElementById('manualDesignInput').value = '';
            initModal();
        }
    } else {
        editingId = null;
        saveBtn.innerText = "Save New Design";
    }
}

function initModal() {
    editingId = null;
    document.getElementById('saveBtn').innerText = "Save Design";
    sizes.forEach((s, i) => {
        document.getElementById(`s${i}`).innerHTML = getOpts(0, s);
    });
    updateSuggestions();
}

function handleAdd() {
    const designNo = document.getElementById('manualDesignInput').value.trim();
    if(!designNo) return alert("Please enter a design number.");

    const newStock = [+s0.value, +s1.value, +s2.value, +s3.value];

    if (editingId) {
        // UPDATE EXISTING
        const item = inventory.find(x => x.id === editingId);
        item.stock = newStock;
        item.design = designNo; // in case they changed casing
        syncQueue.push({type:'update', data: item});
    } else {
        // ADD NEW
        const newItem = { 
            id: crypto.randomUUID(), 
            design: designNo, 
            stock: newStock, 
            sold: [0,0,0,0],
            created_at: new Date().toISOString()
        };
        inventory.unshift(newItem);
        syncQueue.push({type:'add', item: newItem});
    }
    
    document.getElementById('manualDesignInput').value = '';
    closeAdd();
    render();
    syncNow();
}

function openAdd() { initModal(); addModal.classList.add('active'); }
function closeAdd() { addModal.classList.remove('active'); }

function upd(id, idx, val, field) {
    const item = inventory.find(x => x.id === id);
    if(!item) return;
    item[field][idx] = +val;
    syncQueue.push({type:'update', data: item});
    render();
    syncNow();
}

function render() {
    const term = searchInput.value.toLowerCase();
    let list = [...inventory];

    if(sortMode === 'asc') list.sort((a,b) => a.design.localeCompare(b.design, undefined, {numeric: true}));
    if(sortMode === 'desc') list.sort((a,b) => b.design.localeCompare(a.design, undefined, {numeric: true}));

    inventoryList.innerHTML = '';
    let printHtml = '';
    let ts=0, td=0;

    list.filter(item => item.design.toLowerCase().includes(term)).forEach(item => {
        let rowsHtml = '';
        let itemRemTotal = 0;

        item.stock.forEach((sVal, i) => {
            const soldVal = item.sold[i];
            const rem = sVal - soldVal;
            ts += sVal; td += soldVal; itemRemTotal += rem;

            rowsHtml += `
            <div class="grid-row">
                <div class="label-style">${sizes[i]}</div>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'stock')">${getOpts(sVal)}</select>
                <select class="qty-input" onchange="upd('${item.id}',${i},this.value,'sold')">${getOpts(soldVal)}</select>
                <div class="remain-pill">${rem}</div>
            </div>`;
        });

        inventoryList.innerHTML += `
        <div class="item-card" data-id="${item.id}">
            <div class="item-header">
                <span class="design-badge"># ${item.design}</span>
                <button onclick="del('${item.id}')" style="background:none; border:none; color:var(--danger); font-weight:700; font-size:12px;">DELETE</button>
            </div>
            ${rowsHtml}
        </div>`;

        printHtml += `<tr>
            <td>${item.design}</td>
            <td>${item.stock[0]}</td><td>${item.stock[1]}</td><td>${item.stock[2]}</td><td>${item.stock[3]}</td>
            <td>${item.sold[0]}</td><td>${item.sold[1]}</td><td>${item.sold[2]}</td><td>${item.sold[3]}</td>
            <td>${item.stock[0]-item.sold[0]}</td><td>${item.stock[1]-item.sold[1]}</td><td>${item.stock[2]-item.sold[2]}</td><td>${item.stock[3]-item.sold[3]}</td>
            <td><b>${itemRemTotal}</b></td>
        </tr>`;
    });

    totalStock.innerText = ts;
    totalSold.innerText = td;
    totalRemaining.innerText = ts - td;
    designCount.innerText = inventory.length;
    printTableBody.innerHTML = printHtml;
    printDate.innerText = "Generated: " + new Date().toLocaleString();
    saveCache();
}

function saveCache() {
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
    localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
}

function del(id) {
    if(!confirm("Are you sure you want to delete this design?")) return;
    inventory = inventory.filter(x => x.id !== id);
    syncQueue.push({type:'delete', id: id});
    render();
    syncNow();
}

async function syncNow() {
    if(!navigator.onLine) { statusIndicator.innerText="Offline"; return; }
    if(syncQueue.length === 0) { statusIndicator.innerText="Online"; return; }
    
    statusIndicator.innerText = "Syncing...";
    const currentQueue = [...syncQueue];
    syncQueue = [];
    saveCache();

    for(const task of currentQueue) {
        try {
            if(task.type === 'add') await supabaseClient.from('inventory').insert(task.item);
            if(task.type === 'update') await supabaseClient.from('inventory').update({stock: task.data.stock, sold: task.data.sold}).eq('id', task.data.id);
            if(task.type === 'delete') await supabaseClient.from('inventory').delete().eq('id', task.id);
        } catch(e) { console.error("Sync failed", e); }
    }
    statusIndicator.innerText = "Online";
}

async function fetchData() {
    if(!navigator.onLine) return;
    const {data} = await supabaseClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(data) { inventory = data; render(); }
}

function setSort(v) { sortMode = v; render(); }
function toggleSelect() { alert("Suggestions and duplicate auto-fill are active!"); }

// Init
initModal();
render();
fetchData();
setInterval(syncNow, 10000);
</script>
</body>
</html>
