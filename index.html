<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Metiabruz Pro V3.1</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* --- CSS STYLES --- */
:root { --bg: #000; --card: #1C1C1E; --primary: #0A84FF; --danger: #FF453A; --success: #32D74B; --warning: #FF9F0A; --text: #FFF; --border: rgba(255,255,255,0.15); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; user-select: none; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 140px; overflow-x: hidden; }

/* LAYOUT */
.header { position: sticky; top: 0; z-index: 50; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border); padding: 50px 16px 12px; }
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.status-pill { font-size: 11px; font-weight: 700; background: #333; padding: 5px 10px; border-radius: 20px; color: #AAA; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: 0.3s; }
.pulsing { animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

/* MENU BTN */
.menu-btn { background: none; border: none; color: var(--primary); font-size: 24px; cursor: pointer; padding: 0; margin-right: 10px; }

/* TABS */
.tabs { background: #2C2C2E; padding: 2px; border-radius: 9px; display: flex; margin-bottom: 12px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #8E8E93; border-radius: 7px; }
.tab.active { background: #636366; color: #FFF; }

/* SEARCH */
.search-row { display: flex; gap: 10px; align-items: center; }
.search-wrap { flex: 1; background: rgba(255,255,255,0.1); border-radius: 10px; height: 40px; display: flex; align-items: center; padding: 0 10px; }
.search-wrap input { flex: 1; background: transparent; border: none; color: #FFF; font-size: 17px; margin-left: 8px; outline: none; user-select: text; }
.btn-select { color: var(--primary); font-weight: 600; font-size: 17px; background: none; border: none; }

/* CARDS */
.list { padding: 10px 16px; min-height: 50vh; }
.card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 0.5px solid var(--border); display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
.card.selected { border-color: var(--primary); background: rgba(10, 132, 255, 0.15); }
.pending-stripe { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 20px 20px 0; border-color: transparent var(--warning) transparent transparent; opacity: 0; }
.card.pending .pending-stripe { opacity: 1; }

.check-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; display: none; align-items: center; justify-content: center; }
.selection-mode .check-circle { display: flex; }
.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.check-icon { width: 14px; height: 14px; stroke: #FFF; stroke-width: 3; fill: none; display: none; }
.selected .check-icon { display: block; }

.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.size-box { background: #2C2C2E; border-radius: 6px; padding: 6px 0; text-align: center; }
.size-lbl { font-size: 10px; color: #888; font-weight: 700; }
.size-val { font-size: 15px; font-weight: 700; }
.val-low { color: var(--danger); } .val-ok { color: var(--success); }

/* DOCK */
.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.9); backdrop-filter: blur(30px); border-top: 0.5px solid var(--border); padding: 12px 16px 35px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 100; }
.btn { height: 52px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--primary); color: #FFF; }
.btn-glass { background: rgba(255,255,255,0.15); color: #FFF; }
.btn-danger { background: var(--danger); color: #FFF; grid-column: span 2; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; }
.modal-bg.open { display: flex; }
.modal { background: #1C1C1E; width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px 50px; }
.inp-large { width: 100%; background: #2C2C2E; border: 1px solid #333; color: #FFF; padding: 16px; border-radius: 12px; font-size: 20px; outline: none; margin-bottom: 15px; user-select: text; }
.alert-box { background: rgba(10,132,255,0.15); border: 1px solid var(--primary); color: var(--primary); padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; display: none; }
.dropdown { width: 100%; padding: 12px; background: #2C2C2E; color: #FFF; border: 1px solid #333; border-radius: 10px; font-size: 16px; appearance: none; }

/* SIDEBAR */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
.sidebar-overlay.open { display: block; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 85%; max-width: 320px; background: #1C1C1E; z-index: 160; transform: translateX(-100%); transition: 0.3s; padding: 50px 20px 20px; border-right: 1px solid var(--border); overflow-y: auto; }
.sidebar.open { transform: translateX(0); }
.sb-head { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.sb-section { margin-bottom: 30px; }
.sb-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
.sb-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2C2C2E; font-size: 14px; }
.sb-val { font-weight: 700; color: var(--text); }
.sb-sub { font-size: 12px; color: #666; }

/* PRINT */
.print-area { display: none; background: white; color: black; padding: 20px; }
@media print {
    body { background: white; color: black; padding: 0; }
    .header, .list, .dock, .modal-bg, .sidebar, .sidebar-overlay, .check-circle, .btn-select { display: none !important; }
    .print-area { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    @page { size: landscape; margin: 10mm; }
    table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: monospace; }
    th, td { border: 1px solid #000; padding: 4px; text-align: center; }
    th { background: #eee; font-weight: bold; }
    .txt-left { text-align: left; }
}
.icon { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sb-head">Menu <button onclick="toggleSidebar()" style="background:none;border:none;color:#FFF;font-size:20px">✕</button></div>
    
    <div class="sb-section">
        <button class="btn btn-primary" style="width:100%; height:44px; font-size:14px; margin-bottom:10px" onclick="printStock()">Print Stock</button>
        <button class="btn" style="width:100%; height:44px; font-size:14px; background:#333; color:#FFF" onclick="forceReset()">⚠️ Reset Sync</button>
    </div>

    <div class="sb-section"><div class="sb-title">Recent Adds (Last 5)</div><div id="recent-adds"></div></div>
    <div class="sb-section"><div class="sb-title">Top Sellers</div><div id="top-sellers"></div></div>
</div>

<div class="header">
    <div class="top-row">
        <div style="display:flex; align-items:center;">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="logo">Metiabruz Pro</div>
        </div>
        <div class="status-pill">
            <div class="dot" id="dot"></div>
            <span id="status">CONNECTING...</span>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab active" id="tab-active" onclick="setTab('active')">Inventory</div>
        <div class="tab" id="tab-trash" onclick="setTab('trash')">Trash</div>
    </div>

    <div class="search-row">
        <div class="search-wrap">
            <svg class="icon" style="opacity:0.5; width:18px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="search" placeholder="Search Design..." oninput="render()">
        </div>
        <button class="btn-select" id="selBtn" onclick="toggleSelect()">Select</button>
    </div>
</div>

<div class="list" id="list"></div>

<div class="dock" id="dock-main">
    <button class="btn btn-primary" onclick="openModal('add')">Add</button>
    <button class="btn btn-glass" onclick="openModal('sell')">Sell</button>
</div>

<div class="dock" id="dock-delete" style="display:none">
    <button class="btn btn-danger" onclick="deleteSelected()">Delete Selected (<span id="selCount">0</span>)</button>
</div>

<div class="modal-bg" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <div style="width:40px;height:5px;background:#444;border-radius:3px;margin:0 auto 20px;"></div>
        <h2 id="m-title" style="margin:0 0 15px 0;">Entry</h2>
        <input id="m-design" class="inp-large" placeholder="Design No." oninput="checkDup(this.value)">
        <div id="m-alert" class="alert-box"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
            <div><label style="color:#888;font-size:11px">22x32</label><select id="s0" class="dropdown"></select></div>
            <div><label style="color:#888;font-size:11px">34x36</label><select id="s1" class="dropdown"></select></div>
            <div><label style="color:#888;font-size:11px">16x18</label><select id="s2" class="dropdown"></select></div>
            <div><label style="color:#888;font-size:11px">26x30</label><select id="s3" class="dropdown"></select></div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="submitModal()">Confirm</button>
        <button class="btn" style="width:100%; margin-top:10px; background:none; color:#888;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<div id="print-area" class="print-area"></div>

<script>
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';
const sbClient = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32","34x36","16x18","26x30"];

// APP STATE
let inventory = [];
let pendingQueue = []; 
let isSelect = false;
let selected = new Set();
let modalMode = 'add';
let currentTab = 'active';

// --- INITIALIZATION ---
(async function init() {
    // 1. Load Local Cache
    const localData = localStorage.getItem('metia_inv');
    const localQueue = localStorage.getItem('metia_queue');
    if(localData) inventory = JSON.parse(localData);
    if(localQueue) pendingQueue = JSON.parse(localQueue);
    
    // Render
    checkConnection();
    render();
    refreshSidebar();
    
    // Dropdown Init
    const opts = `<option value="0">0</option>` + Array.from({length:100},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
    [0,1,2,3].forEach(i => document.getElementById('s'+i).innerHTML = opts);

    // 2. Listeners
    window.addEventListener('online',  () => { checkConnection(); processQueue(); });
    window.addEventListener('offline', () => { checkConnection(); });

    // 3. Kickstart Sync if Online
    if(navigator.onLine) {
        processQueue(); // TRY PROCESSING IMMEDIATELY
        await fetchLatest();
    }
    
    // 4. Realtime
    sbClient.channel('public:inventory')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
            const { eventType, new: n, old: o } = payload;
            if(eventType === 'INSERT') {
                inventory = inventory.filter(x => x.design !== n.design); // Remove temp duplicate
                inventory.unshift(n);
            }
            if(eventType === 'UPDATE') { const i = inventory.findIndex(x=>x.id===n.id); if(i>-1) inventory[i]=n; }
            if(eventType === 'DELETE') { inventory = inventory.filter(x=>x.id!==o.id); }
            saveLocal();
            render();
            refreshSidebar();
        }).subscribe();
})();

// --- SYNC ENGINE ---
function checkConnection() {
    const isOnline = navigator.onLine;
    if(isOnline) {
        if(pendingQueue.length > 0) updateStatus('SYNCING...', 'warning', true);
        else updateStatus('ONLINE', 'success', false);
    } else {
        updateStatus('OFFLINE MODE', 'danger', false);
    }
}

function updateStatus(msg, type, pulse) {
    const s = document.getElementById('status');
    const d = document.getElementById('dot');
    s.innerText = msg;
    d.style.background = `var(--${type})`;
    if(pulse) d.classList.add('pulsing'); else d.classList.remove('pulsing');
}

function saveLocal() {
    localStorage.setItem('metia_inv', JSON.stringify(inventory));
    localStorage.setItem('metia_queue', JSON.stringify(pendingQueue));
}

function forceReset() {
    if(!confirm("⚠️ This will clear pending syncs and reload from server. Use only if stuck.")) return;
    pendingQueue = [];
    localStorage.removeItem('metia_queue');
    location.reload();
}

async function fetchLatest() {
    if(!navigator.onLine) return;
    const { data, error } = await sbClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(!error && data) {
        const tempItems = inventory.filter(i => typeof i.id === 'string' && i.id.startsWith('temp_'));
        inventory = [...tempItems, ...data];
        saveLocal();
        render();
        refreshSidebar();
    }
}

async function processQueue() {
    if(!navigator.onLine || pendingQueue.length === 0) return;
    updateStatus('SYNCING...', 'warning', true);
    
    const op = pendingQueue[0];
    let success = false;

    // Critical Error Check (Prevent Infinite Loops)
    if(op.retryCount && op.retryCount > 3) {
        console.error("Skipping stuck item", op);
        pendingQueue.shift();
        saveLocal();
        return processQueue();
    }

    try {
        if(op.type === 'INSERT') {
            const { error } = await sbClient.from('inventory').insert(op.payload);
            if(!error || error.code === '23505') success = true; // 23505 = duplicate, treat as success
        } else if (op.type === 'UPDATE') {
            const { error } = await sbClient.from('inventory').update(op.payload).eq('id', op.id);
            if(!error) success = true;
        } else if (op.type === 'DELETE') {
             const { error } = await sbClient.from('inventory').update({ deleted_at: op.payload.deleted_at }).in('id', op.ids);
             if(!error) success = true;
        }
    } catch(e) { console.log(e); }

    if(success) {
        pendingQueue.shift(); 
        saveLocal();
        if(pendingQueue.length > 0) processQueue(); else checkConnection();
    } else {
        op.retryCount = (op.retryCount || 0) + 1;
        saveLocal();
        setTimeout(processQueue, 3000);
    }
}

// --- CORE RENDER ---
function render() {
    const list = document.getElementById('list');
    const term = document.getElementById('search').value.toUpperCase();
    list.innerHTML = '';
    const filtered = inventory.filter(i => {
        const isTrash = !!i.deleted_at;
        if(currentTab === 'active' && isTrash) return false;
        if(currentTab === 'trash' && !isTrash) return false;
        return i.design && i.design.toUpperCase().includes(term);
    });

    filtered.forEach(item => {
        const el = document.createElement('div');
        const isSel = selected.has(item.id);
        const isPending = (typeof item.id === 'string' && item.id.startsWith('temp_'));
        
        el.className = `card ${isSel?'selected':''} ${isPending?'pending':''}`;
        el.onclick = () => handleTap(item.id);

        let grid = '';
        item.stock.forEach((s, idx) => {
            const left = s - (item.sold[idx]||0);
            grid += `<div class="size-box"><div class="size-lbl">${sizes[idx]}</div><div class="size-val ${left<5?'val-low':'val-ok'}">${left}</div></div>`;
        });

        el.innerHTML = `
            <div class="pending-stripe"></div>
            <div class="check-circle"><svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div style="flex:1">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span style="font-weight:900; font-size:18px"># ${item.design}</span>
                    <button style="background:none; border:none; color:var(--primary); font-weight:700" onclick="event.stopPropagation(); toggleSelect()">Select</button>
                </div>
                <div class="size-grid">${grid}</div>
            </div>
        `;
        list.appendChild(el);
    });
}

// --- ACTIONS ---
function toggleSelect() {
    isSelect = !isSelect; selected.clear();
    document.body.classList.toggle('selection-mode', isSelect);
    document.getElementById('selBtn').innerText = isSelect ? 'Done' : 'Select';
    document.getElementById('dock-main').style.display = isSelect ? 'none' : 'grid';
    document.getElementById('dock-delete').style.display = isSelect ? 'grid' : 'none';
    render();
}
function handleTap(id) {
    if(isSelect) {
        if(selected.has(id)) selected.delete(id); else selected.add(id);
        document.getElementById('selCount').innerText = selected.size;
        render();
    }
}
async function deleteSelected() {
    if(!confirm("Delete items?")) return;
    const ids = Array.from(selected);
    const now = new Date().toISOString();
    
    inventory.forEach(i => { if(selected.has(i.id)) i.deleted_at = now; });
    
    if(navigator.onLine) {
        await sbClient.from('inventory').update({ deleted_at: now }).in('id', ids);
    } else {
        pendingQueue.push({ type: 'DELETE', ids: ids, payload: { deleted_at: now } });
    }
    
    saveLocal();
    render();
    refreshSidebar();
    toggleSelect();
    checkConnection();
}

// --- MODAL ---
function openModal(m) {
    modalMode = m;
    document.getElementById('m-title').innerText = m==='add'?'Add Stock':'Sell Item';
    document.getElementById('m-design').value = '';
    document.getElementById('m-alert').style.display = 'none';
    [0,1,2,3].forEach(i => document.getElementById('s'+i).value=0);
    document.getElementById('modal').classList.add('open');
}
function checkDup(val) {
    const term = val.trim().toUpperCase();
    const found = inventory.find(i => i.design === term && !i.deleted_at);
    const alert = document.getElementById('m-alert');
    if(found) {
        alert.style.display = 'block';
        alert.innerText = `Adding to existing: #${found.design}`;
    } else {
        alert.style.display = 'none';
        if(modalMode === 'sell') { alert.style.display = 'block'; alert.innerText = `New Design: Cannot sell.`; }
    }
}
async function submitModal() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    const qtys = [0,1,2,3].map(i => +document.getElementById('s'+i).value);
    if(!dNo || qtys.every(q=>q===0)) return alert("Invalid Entry");

    const existing = inventory.find(i => i.design === dNo && !i.deleted_at);
    let action = null;

    if(modalMode === 'add') {
        if(existing) {
            // IF EXISTING IS TEMP, UPDATE THE INSERT, NOT ADD NEW ACTION
            if(typeof existing.id === 'string' && existing.id.startsWith('temp_')) {
                existing.stock = existing.stock.map((s,i) => s + qtys[i]);
                const pendIdx = pendingQueue.findIndex(p => p.type==='INSERT' && p.payload.design===dNo);
                if(pendIdx > -1) pendingQueue[pendIdx].payload.stock = existing.stock;
                saveLocal();
                closeModal();
                return;
            }
            existing.stock = existing.stock.map((s,i) => s + qtys[i]);
            action = { type: 'UPDATE', id: existing.id, payload: { stock: existing.stock } };
        } else {
            const tempId = 'temp_' + Date.now();
            const newItem = { id: tempId, design: dNo, stock: qtys, sold: [0,0,0,0], deleted_at: null, created_at: new Date().toISOString() };
            inventory.unshift(newItem);
            action = { type: 'INSERT', payload: { design: dNo, stock: qtys, sold: [0,0,0,0], deleted_at: null } };
        }
    } else {
        if(!existing) return alert("Not Found");
        // IF EXISTING IS TEMP, UPDATE THE INSERT
        if(typeof existing.id === 'string' && existing.id.startsWith('temp_')) {
            existing.sold = existing.sold.map((s,i) => (s||0) + qtys[i]);
            const pendIdx = pendingQueue.findIndex(p => p.type==='INSERT' && p.payload.design===dNo);
            if(pendIdx > -1) pendingQueue[pendIdx].payload.sold = existing.sold;
            saveLocal();
            closeModal();
            return;
        }
        existing.sold = existing.sold.map((s,i) => (s||0) + qtys[i]);
        action = { type: 'UPDATE', id: existing.id, payload: { sold: existing.sold } };
    }

    if(navigator.onLine) {
        pendingQueue.push(action);
        processQueue();
    } else {
        pendingQueue.push(action);
    }

    saveLocal();
    render();
    refreshSidebar();
    closeModal();
    checkConnection();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function setTab(t) { currentTab=t; document.getElementById('tab-active').className=t==='active'?'tab active':'tab'; document.getElementById('tab-trash').className=t==='trash'?'tab active':'tab'; render(); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.querySelector('.sidebar-overlay').classList.toggle('open'); }

function refreshSidebar() {
    const active = inventory.filter(i=>!i.deleted_at);
    const adds = [...active].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);
    document.getElementById('recent-adds').innerHTML = adds.map(i => 
        `<div class="sb-item"><div><div style="font-weight:700">#${i.design}</div><div class="sb-sub">${new Date(i.created_at).toLocaleDateString()}</div></div><div class="sb-val" style="color:var(--success)">+${i.stock.reduce((a,b)=>a+b,0)}</div></div>`
    ).join('') || '<div class="sb-sub">No data</div>';

    const sells = [...active].sort((a,b) => b.sold.reduce((x,y)=>x+y,0) - a.sold.reduce((x,y)=>x+y,0)).slice(0, 5);
    document.getElementById('top-sellers').innerHTML = sells.map(i => {
        const tot = i.sold.reduce((a,b)=>a+b,0);
        return tot>0 ? `<div class="sb-item"><div><div style="font-weight:700">#${i.design}</div></div><div class="sb-val" style="color:var(--primary)">${tot} Sold</div></div>` : '';
    }).join('') || '<div class="sb-sub">No sales yet</div>';
}

function printStock() {
    const active = inventory.filter(i => !i.deleted_at);
    let tStock=0, tSold=0, tRem=0;
    const rows = active.map(i => {
        const s=i.stock.reduce((a,b)=>a+b,0), so=i.sold.reduce((a,b)=>a+b,0), rems=i.stock.map((v,x)=>v-(i.sold[x]||0)), r=rems.reduce((a,b)=>a+b,0);
        tStock+=s; tSold+=so; tRem+=r;
        return `<tr><td class="txt-left">#${i.design}</td><td>${i.stock[0]}</td><td>${i.stock[1]}</td><td>${i.stock[2]}</td><td>${i.stock[3]}</td><td>${i.sold[0]}</td><td>${i.sold[1]}</td><td>${i.sold[2]}</td><td>${i.sold[3]}</td><td>${rems[0]}</td><td>${rems[1]}</td><td>${rems[2]}</td><td>${rems[3]}</td><td style="font-weight:bold">${r}</td></tr>`;
    }).join('');
    document.getElementById('print-area').innerHTML = `<div style="text-align:center;margin-bottom:10px;"><h1 style="margin:0;font-size:24px;">Metiabruz Stock</h1><div style="font-size:12px;color:#555;margin-bottom:10px;">${new Date().toLocaleString()}</div><div style="font-weight:bold;font-size:14px;border:1px solid #000;display:inline-block;padding:5px 15px;">Stock: ${tStock} | Sold: ${tSold} | Rem: ${tRem}</div></div><table><thead><tr><th rowspan="2">Design</th><th colspan="4">Stock</th><th colspan="4">Sold</th><th colspan="4">Remaining</th><th rowspan="2">Total Rem</th></tr><tr><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th></tr></thead><tbody>${rows}</tbody></table>`;
    window.print();
}
</script>
