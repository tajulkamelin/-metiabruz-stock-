<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Metiabruz Stock</title>

<style>
:root{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;
  --border:#334155;--primary:#0ea5e9;--danger:#ef4444;--remain:#064e3b
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);padding:12px;padding-bottom:110px
}
.header,.search-box,.item-card,.modal-content{
  background:var(--card);border-radius:16px;padding:16px
}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.summary-card{background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--border)}
.summary-card label{font-size:11px;color:var(--muted)}
.summary-card .value{font-size:22px;font-weight:700}
.search-box{margin:16px 0}
.search-box input,input{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);text-align:center
}
.inventory-list{display:flex;flex-direction:column;gap:12px}
.item-header{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.size-row{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.input-remaining{background:var(--remain)}
.action-buttons{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);padding:10px;display:flex;gap:8px
}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--bg);color:#fff}
.btn-danger{background:var(--danger);color:#fff;font-size:12px;padding:6px 10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  align-items:center;justify-content:center;z-index:99}
.modal.active{display:flex}
.size-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
</style>
</head>

<body>

<div class="header">
  <h2>📦 Metiabruz Stock</h2>
  <div class="summary">
    <div class="summary-card"><label>Total Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card"><label>Remaining</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="search-box">
  <input id="searchInput" placeholder="Search by Design No">
</div>

<div class="inventory-list" id="inventoryList"></div>

<!-- ✅ RESTORED OLD BUTTON BAR -->
<div class="action-buttons">
  <button class="btn btn-secondary" onclick="openAdd()">➕ Add</button>
  <button class="btn btn-secondary" onclick="printInventory()">🖨 Print</button>
  <button class="btn btn-secondary" onclick="exportData()">📤 Export</button>
  <button class="btn btn-primary" onclick="saveCache()">💾 Save</button>
</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <h3>Add Design</h3><br>
    <input id="designInput" placeholder="Design No"><br><br>
    <div class="size-inputs">
      <input id="s0" placeholder="22x32" type="number">
      <input id="s1" placeholder="34x36" type="number">
      <input id="s2" placeholder="16x18" type="number">
      <input id="s3" placeholder="26x30" type="number">
    </div><br>
    <button class="btn btn-primary" onclick="addDesign()">Save</button>
  </div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* ================== SUPABASE ================== */
const supabaseClient = supabase.createClient(
  'https://yhlfqpiwevsehlgbhxtk.supabase.co',
  'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'
);

/* ================== STATE ================== */
const sizes = ["22x32","34x36","16x18","26x30"];
let inventory = [];
let syncQueue = JSON.parse(localStorage.getItem('metiabruzSyncQueue') || '[]');

/* ================== LOCAL CACHE ================== */
function loadFromDevice(){
  const saved = localStorage.getItem('metiabruzInventory');
  if(saved){
    inventory = JSON.parse(saved);
  }
}

function saveToDevice(){
  localStorage.setItem('metiabruzInventory', JSON.stringify(inventory));
  localStorage.setItem('metiabruzSyncQueue', JSON.stringify(syncQueue));
}

/* ================== RENDER ================== */
/* Uses your existing renderInventory(), updateTotals(), UI exactly same */

/* ================== CRUD OVERRIDES ================== */
function saveDesign(){
  const design=document.getElementById('designInput').value.trim();
  if(!design){alert('Enter design number');return;}

  const stock=[
    +stock0.value||0,
    +stock1.value||0,
    +stock2.value||0,
    +stock3.value||0
  ];

  const item={
    id:crypto.randomUUID(),
    design,
    stock,
    sold:[0,0,0,0]
  };

  inventory.push(item);
  syncQueue.push({type:'add',item});
  closeModal('addEditModal');
  saveToDevice();
  renderInventory();
}

function updateStock(itemIndex,sizeIndex,value){
  inventory[itemIndex].stock[sizeIndex]=+value||0;
  syncQueue.push({type:'update',item:inventory[itemIndex]});
  saveToDevice();
  renderInventory(searchInput.value);
}

function updateSold(itemIndex,sizeIndex,value){
  const item=inventory[itemIndex];
  item.sold[sizeIndex]=Math.min(+value||0,item.stock[sizeIndex]);
  syncQueue.push({type:'update',item});
  saveToDevice();
  renderInventory(searchInput.value);
}

function deleteDesign(index){
  if(!confirm('Delete design?')) return;
  const id=inventory[index].id;
  inventory.splice(index,1);
  syncQueue.push({type:'delete',id});
  saveToDevice();
  renderInventory();
}

/* ================== SYNC ================== */
async function syncNow(){
  if(!navigator.onLine || !syncQueue.length) return;

  for(const job of syncQueue){
    if(job.type==='add'){
      await supabaseClient.from('inventory').insert(job.item);
    }
    if(job.type==='update'){
      await supabaseClient.from('inventory')
        .update({stock:job.item.stock,sold:job.item.sold})
        .eq('design',job.item.design);
    }
    if(job.type==='delete'){
      await supabaseClient.from('inventory').delete().eq('id',job.id);
    }
  }

  syncQueue=[];
  const {data}=await supabaseClient.from('inventory').select('*');
  inventory=data||[];
  saveToDevice();
  renderInventory();
}

/* ================== REALTIME ================== */
supabaseClient
  .channel('inventory-live')
  .on(
    'postgres_changes',
    {event:'*',schema:'public',table:'inventory'},
    payload=>{
      if(payload.eventType!=='DELETE'){
        const i=inventory.findIndex(x=>x.design===payload.new.design);
        if(i>-1) inventory[i]=payload.new;
        else inventory.push(payload.new);
      }
      if(payload.eventType==='DELETE'){
        inventory=inventory.filter(i=>i.id!==payload.old.id);
      }
      saveToDevice();
      renderInventory();
    }
  )
  .subscribe();

/* ================== AUTO SYNC ================== */
window.addEventListener('online',syncNow);

/* ================== START ================== */
loadFromDevice();
renderInventory();
syncNow();
</script>
</body>
</html>
