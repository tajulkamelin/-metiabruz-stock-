<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dilkhus Fashion Pro</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f172a; --surface: #1e293b; --surface-light: #334155;
    --primary: #6366f1; --text: #f8fafc; --text-muted: #94a3b8;
    --success: #10b981; --danger: #ef4444; --border: rgba(255,255,255,0.08);
    --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* --- HEADER --- */
.app-header { background: rgba(15, 23, 42, 0.95); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
.menu-btn { font-size: 24px; cursor: pointer; margin-right: 15px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
.status-badge { font-size: 10px; font-weight: 700; background: var(--surface); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); transition: 0.3s; }

/* --- SIDEBAR --- */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 900; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(2px); }
.sidebar-overlay.open { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); z-index: 901; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
.sidebar-overlay.open .sidebar { transform: translateX(0); }
.nav-item { padding: 15px; border-radius: 10px; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
.nav-item.active { background: var(--primary); color: white; }
.nav-item:active { background: var(--surface-light); }

/* --- MAIN CONTENT --- */
.sub-header { padding: 15px 20px 0; display: grid; gap: 15px; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card { background: var(--surface); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
.stat-val { font-size: 24px; font-weight: 800; margin-top: 4px; }
.search-container { padding: 15px 20px; position: relative; }
.search-inp { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px 12px 12px 40px; border-radius: 12px; color: white; outline: none; font-size: 14px; }

.list-container { flex: 1; overflow-y: auto; padding: 0 20px 100px; scroll-behavior: smooth; }

/* Inventory Card */
.inventory-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.size-item { background: var(--bg); border-radius: 8px; padding: 8px 4px; text-align: center; border: 1px solid var(--border); }
/* History Card */
.history-date { font-size: 12px; font-weight: 800; color: var(--text-muted); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 1px; }
.history-card { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
.h-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-bottom: 5px; display: inline-block; }
.h-sell { border-left-color: var(--success); } .h-sell .h-tag { background: rgba(16, 185, 129, 0.2); color: var(--success); }
.h-add { border-left-color: var(--primary); } .h-add .h-tag { background: rgba(99, 102, 241, 0.2); color: var(--primary); }

/* --- DOCK & MODAL --- */
.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 12px 20px calc(12px + var(--safe-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; z-index: 100; }
.btn { border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: white; }
.btn-p { background: var(--primary); } .btn-s { background: var(--surface-light); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 950; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(4px); }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #1e293b; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.4s; z-index: 951; padding-bottom: calc(30px + var(--safe-bottom)); }
.modal-overlay.open .bottom-sheet { transform: translateY(0); }

.inp-large { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 16px; border-radius: 12px; font-size: 18px; outline: none; margin-bottom: 15px; }
.grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.qty-select { padding: 12px; width: 100%; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 10px; }

.suggestions-box { position: absolute; top: 75px; left: 24px; right: 24px; background: var(--surface-light); z-index: 960; max-height: 150px; overflow-y: auto; display: none; border-radius: 0 0 12px 12px; }
.suggestions-box.active { display: block; }
.s-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

#view-home, #view-history { display: none; }
.view-active { display: block !important; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()">
    <div class="sidebar" onclick="event.stopPropagation()">
        <h2 style="margin: 0 0 30px; padding: 0 15px;">Menu</h2>
        <div class="nav-item active" onclick="switchView('home')">📦 Inventory</div>
        <div class="nav-item" onclick="switchView('history-add')">📥 Inward History (Add)</div>
        <div class="nav-item" onclick="switchView('history-sell')">📤 Outward History (Sell)</div>
    </div>
</div>

<!-- HEADER -->
<div class="app-header">
    <div style="display:flex; align-items:center">
        <div class="menu-btn" onclick="toggleSidebar()">☰</div>
        <div class="brand">Dilkhus Fashion</div>
    </div>
    <div class="status-badge"><div id="dot" class="status-dot"></div><span id="status">INIT</span></div>
</div>

<!-- VIEW: HOME (INVENTORY) -->
<div id="view-home" class="view-active">
    <div class="sub-header">
        <div class="stats-row">
            <div class="stat-card"><span style="font-size:11px;color:var(--text-muted)">STOCK</span><div class="stat-val" id="d-stock" style="color:var(--primary)">0</div></div>
            <div class="stat-card"><span style="font-size:11px;color:var(--text-muted)">AVAILABLE</span><div class="stat-val" id="d-rem" style="color:var(--success)">0</div></div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" class="search-inp" id="mainSearch" placeholder="Search Design..." oninput="renderInventory()">
    </div>

    <div id="list" class="list-container"></div>
</div>

<!-- VIEW: HISTORY -->
<div id="view-history">
    <div class="sub-header">
        <h2 id="history-title" style="margin:0">History</h2>
    </div>
    <div id="history-list" class="list-container" style="padding-top:20px"></div>
</div>

<!-- DOCK -->
<div class="dock" id="mainDock">
    <button class="btn btn-s" onclick="openModal('sell')">📉 SELL</button>
    <button class="btn btn-p" onclick="openModal('add')">＋ ADD STOCK</button>
</div>

<!-- ADD/SELL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h2 id="m-title" style="margin:0 0 20px">Update Stock</h2>
        
        <input id="m-design" class="inp-large" placeholder="Design No." oninput="handleDesignInput(this.value)" autocomplete="off">
        <div id="suggestions" class="suggestions-box"></div>
        
        <input id="m-customer" class="inp-large" placeholder="Customer Name (Optional)" style="display:none">

        <div class="grid-inputs">
            <div><label style="font-size:10px">22x32</label><select id="s0" class="qty-select"></select><div id="l0" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">34x36</label><select id="s1" class="qty-select"></select><div id="l1" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">16x18</label><select id="s2" class="qty-select"></select><div id="l2" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">26x30</label><select id="s3" class="qty-select"></select><div id="l3" style="font-size:10px;text-align:center"></div></div>
        </div>

        <button class="btn btn-p" style="width:100%" onclick="finalSubmit()">CONFIRM</button>
    </div>
</div>

<script>
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';
const sbClient = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32","34x36","16x18","26x30"];

// State
let inventory = [], transactions = [], queue = [];
let currentView = 'home'; // home, history-add, history-sell
let foundItem, modalMode = '';

// --- INITIALIZATION ---
(async function init() {
    // Load Local Data
    inventory = JSON.parse(localStorage.getItem('df_inv') || '[]');
    transactions = JSON.parse(localStorage.getItem('df_tx') || '[]');
    queue = JSON.parse(localStorage.getItem('df_q') || '[]');
    
    renderInventory();
    updateStatus();

    // Sync
    if(navigator.onLine) {
        await syncData();
        processQueue();
    }
    window.addEventListener('online', () => { updateStatus(); processQueue(); });
    
    // Realtime Subscriptions
    sbClient.channel('any')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, syncData)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, syncData)
        .subscribe();
})();

async function syncData() {
    // 1. Fetch Inventory
    const { data: invData } = await sbClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(invData) {
        // Simple merge: Server wins, but preserve local new items not yet synced
        const serverIds = invData.map(i => i.id);
        const localNew = inventory.filter(i => !serverIds.includes(i.id));
        inventory = [...localNew, ...invData];
        localStorage.setItem('df_inv', JSON.stringify(inventory));
        renderInventory();
    }

    // 2. Fetch Transactions (History)
    const { data: txData } = await sbClient.from('transactions').select('*').order('created_at', {ascending:false}).limit(100);
    if(txData) {
        transactions = txData;
        localStorage.setItem('df_tx', JSON.stringify(transactions));
        if(currentView !== 'home') renderHistory();
    }
}

function updateStatus() {
    const s = document.getElementById('status'), d = document.getElementById('dot');
    if(queue.length > 0) { s.innerText = 'SYNCING'; d.style.background = '#f59e0b'; }
    else if(navigator.onLine) { s.innerText = 'ONLINE'; d.style.background = '#10b981'; }
    else { s.innerText = 'OFFLINE'; d.style.background = '#ef4444'; }
}

async function processQueue() {
    if(!navigator.onLine || queue.length === 0) return;
    const op = queue[0];
    
    // Optimistic Queue Processing
    let err;
    if(op.table === 'inventory') {
        if(op.type === 'INSERT') err = (await sbClient.from('inventory').insert(op.data)).error;
        else if(op.type === 'UPDATE') err = (await sbClient.from('inventory').update(op.data).eq('id', op.id)).error;
    } else if(op.table === 'transactions') {
        err = (await sbClient.from('transactions').insert(op.data)).error;
    }

    if(!err) {
        queue.shift();
        localStorage.setItem('df_q', JSON.stringify(queue));
        updateStatus();
        processQueue();
    } else {
        console.error(err);
        setTimeout(processQueue, 5000);
    }
}

// --- NAVIGATION ---
function toggleSidebar() {
    document.getElementById('sidebarOverlay').classList.toggle('open');
}

function switchView(view) {
    currentView = view;
    toggleSidebar();
    
    document.querySelectorAll('.view-active').forEach(e => e.classList.remove('view-active'));
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));

    if(view === 'home') {
        document.getElementById('view-home').classList.add('view-active');
        document.getElementById('mainDock').style.display = 'grid';
        renderInventory();
    } else {
        document.getElementById('view-history').classList.add('view-active');
        document.getElementById('mainDock').style.display = 'none';
        document.getElementById('history-title').innerText = view === 'history-add' ? 'Inward History' : 'Sales History';
        renderHistory();
    }
}

// --- RENDERING ---
function renderInventory() {
    if(currentView !== 'home') return;
    const list = document.getElementById('list');
    const term = document.getElementById('mainSearch').value.toUpperCase();
    list.innerHTML = '';

    const active = inventory.filter(i => !i.deleted_at);
    
    // Stats
    document.getElementById('d-stock').innerText = active.reduce((a,c)=>a+c.stock.reduce((x,y)=>x+y,0),0);
    document.getElementById('d-rem').innerText = active.reduce((a,c)=>a+(c.stock.reduce((x,y)=>x+y,0)-c.sold.reduce((x,y)=>x+y,0)),0);

    active.filter(i => i.design.includes(term))
          .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
          .forEach(item => {
              const grid = item.stock.map((s,i) => {
                  const rem = s - (item.sold[i]||0);
                  return `<div class="size-item"><div style="font-size:9px;color:#94a3b8">${sizes[i]}</div><div style="font-weight:700;color:${rem<5?'#ef4444':'#10b981'}">${rem}</div></div>`;
              }).join('');
              
              const el = document.createElement('div');
              el.className = 'inventory-card';
              el.innerHTML = `<div class="card-header"><span style="background:rgba(99,102,241,0.2);color:#818cf8;padding:4px 8px;border-radius:6px;font-weight:700">#${item.design}</span></div><div class="size-grid">${grid}</div>`;
              list.appendChild(el);
          });
}

function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    const type = currentView === 'history-add' ? 'ADD' : 'SELL';
    
    const filtered = transactions.filter(t => t.type === type);
    
    // Group by Date
    const groups = {};
    filtered.forEach(t => {
        const date = new Date(t.created_at).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
        if(!groups[date]) groups[date] = [];
        groups[date].push(t);
    });

    Object.keys(groups).forEach(date => {
        list.innerHTML += `<div class="history-date">${date}</div>`;
        groups[date].forEach(t => {
            const el = document.createElement('div');
            el.className = `history-card ${type==='SELL'?'h-sell':'h-add'}`;
            el.innerHTML = `
                <div>
                    <div class="h-tag">${type}</div>
                    <div style="font-weight:800;font-size:16px">#${t.design}</div>
                    ${t.customer ? `<div style="font-size:12px;color:#94a3b8">👤 ${t.customer}</div>` : ''}
                </div>
                <div style="text-align:right">
                    <div style="font-size:20px;font-weight:800">${t.total_qty}</div>
                    <div style="font-size:10px;color:#94a3b8">Total Qty</div>
                    <button style="margin-top:5px;background:none;border:1px solid #ef4444;color:#ef4444;border-radius:4px;padding:2px 6px;font-size:10px" onclick="revertTransaction(${t.id})">REVERT</button>
                </div>
            `;
            list.appendChild(el);
        });
    });
}

// --- MODAL & LOGIC ---
function openModal(mode) {
    modalMode = mode;
    document.getElementById('m-title').innerText = mode === 'add' ? 'Add Stock' : 'Sell Stock';
    document.getElementById('m-customer').style.display = mode === 'sell' ? 'block' : 'none';
    document.getElementById('m-design').value = '';
    document.getElementById('m-customer').value = '';
    updateDropdowns(null);
    document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('suggestions').classList.remove('active');
}

function handleDesignInput(val) {
    val = val.toUpperCase().trim();
    const box = document.getElementById('suggestions');
    const matches = inventory.filter(i => i.design.startsWith(val) && !i.deleted_at).slice(0,5);
    
    if(val.length > 0 && matches.length > 0) {
        box.innerHTML = matches.map(m => `<div class="s-item" onclick="selectSuggestion('${m.design}')"><b>${m.design}</b> <span style="font-size:10px;color:#94a3b8">Stock: ${m.stock.reduce((a,b)=>a+b,0)}</span></div>`).join('');
        box.classList.add('active');
    } else box.classList.remove('active');

    foundItem = inventory.find(i => i.design === val && !i.deleted_at);
    updateDropdowns(foundItem);
}

function selectSuggestion(val) {
    document.getElementById('m-design').value = val;
    document.getElementById('suggestions').classList.remove('active');
    handleDesignInput(val);
}

function updateDropdowns(item) {
    [0,1,2,3].forEach(idx => {
        const s = document.getElementById('s'+idx);
        const l = document.getElementById('l'+idx);
        s.innerHTML = ''; s.disabled = false;

        if(modalMode === 'sell') {
            if(item) {
                const av = item.stock[idx] - (item.sold[idx]||0);
                l.innerText = `Avail: ${av}`;
                if(av <= 0) { s.innerHTML='<option value="0">0</option>'; s.disabled=true; }
                else for(let i=0;i<=av;i++) s.innerHTML+=`<option value="${i}">${i}</option>`;
            } else {
                l.innerText = '-'; s.innerHTML='<option value="0">0</option>'; s.disabled=true;
            }
        } else {
            for(let i=0;i<=100;i++) s.innerHTML+=`<option value="${i}">${i}</option>`;
            l.innerText = item ? `Cur: ${item.stock[idx]}` : 'New';
        }
    });
}

async function finalSubmit() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    const cust = document.getElementById('m-customer').value.trim();
    const qtys = [0,1,2,3].map(i => +document.getElementById('s'+i).value);
    const total = qtys.reduce((a,b)=>a+b,0);

    if(!dNo || total === 0) return alert("Invalid Input");
    if(modalMode === 'sell' && !foundItem) return alert("Design not found");

    // 1. Update Inventory Object
    if(modalMode === 'add') {
        if(foundItem) {
            foundItem.stock = foundItem.stock.map((s,i) => s + qtys[i]);
            queue.push({ table:'inventory', type:'UPDATE', id:foundItem.id, data:{stock:foundItem.stock} });
        } else {
            const newItem = { id: Date.now(), design:dNo, stock:qtys, sold:[0,0,0,0], created_at: new Date().toISOString() };
            inventory.unshift(newItem);
            queue.push({ table:'inventory', type:'INSERT', data:newItem });
            foundItem = newItem; // For transaction record
        }
    } else {
        foundItem.sold = foundItem.sold.map((s,i) => (foundItem.sold[i]||0) + qtys[i]);
        queue.push({ table:'inventory', type:'UPDATE', id:foundItem.id, data:{sold:foundItem.sold} });
    }

    // 2. Create Transaction Record
    const tx = {
        id: Date.now(), // Temp ID
        created_at: new Date().toISOString(),
        type: modalMode === 'add' ? 'ADD' : 'SELL',
        design: dNo,
        customer: cust,
        quantities: qtys,
        total_qty: total
    };
    
    transactions.unshift(tx);
    queue.push({ table:'transactions', type:'INSERT', data:tx }); // Sync to new table

    localStorage.setItem('df_inv', JSON.stringify(inventory));
    localStorage.setItem('df_tx', JSON.stringify(transactions));
    localStorage.setItem('df_q', JSON.stringify(queue));
    
    updateStatus(); processQueue();
    closeModal(); renderInventory();
}

async function revertTransaction(txId) {
    if(!confirm("Revert this transaction? Stocks will be adjusted.")) return;
    
    const txIndex = transactions.findIndex(t => t.id == txId); // Soft equality for string/int IDs
    if(txIndex === -1) return;
    const tx = transactions[txIndex];

    const invItem = inventory.find(i => i.design === tx.design && !i.deleted_at);
    
    if(invItem) {
        if(tx.type === 'ADD') {
            // Remove added stock
            invItem.stock = invItem.stock.map((s,i) => Math.max(0, s - tx.quantities[i]));
            queue.push({ table:'inventory', type:'UPDATE', id:invItem.id, data:{stock:invItem.stock} });
        } else {
            // Add back sold stock
            invItem.sold = invItem.sold.map((s,i) => Math.max(0, s - tx.quantities[i]));
            queue.push({ table:'inventory', type:'UPDATE', id:invItem.id, data:{sold:invItem.sold} });
        }
    }

    // Remove from local list and delete from server
    transactions.splice(txIndex, 1);
    
    // We can't delete easily via queue in this simple setup without specific ID logic, 
    // so we fire-and-forget the delete command
    sbClient.from('transactions').delete().eq('id', txId).then(console.log);

    localStorage.setItem('df_inv', JSON.stringify(inventory));
    localStorage.setItem('df_tx', JSON.stringify(transactions));
    localStorage.setItem('df_q', JSON.stringify(queue));

    renderHistory();
    updateStatus(); processQueue();
}
</script>
</body>
</html>
