<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dilkhus Fashion Pro</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f172a; --surface: #1e293b; --surface-light: #334155;
    --primary: #6366f1; --text: #f8fafc; --text-muted: #94a3b8;
    --success: #10b981; --danger: #ef4444; --border: rgba(255,255,255,0.08);
    --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* --- HEADER --- */
.app-header { background: rgba(15, 23, 42, 0.95); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 50; flex-shrink: 0; }
.menu-btn { font-size: 24px; cursor: pointer; margin-right: 15px; padding: 5px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
.status-badge { font-size: 10px; font-weight: 700; background: var(--surface); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); transition: 0.3s; }

/* --- SIDEBAR --- */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 900; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(2px); }
.sidebar-overlay.open { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); z-index: 901; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
.sidebar-overlay.open .sidebar { transform: translateX(0); }
.nav-item { padding: 15px; border-radius: 10px; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
.nav-item.active { background: var(--primary); color: white; }

/* --- MAIN CONTENT --- */
.view-section { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.view-section.active { display: flex; }

.sub-header { padding: 15px 20px 0; display: grid; gap: 15px; flex-shrink: 0; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card { background: var(--surface); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
.stat-val { font-size: 24px; font-weight: 800; margin-top: 4px; }
.search-container { padding: 15px 20px; position: relative; flex-shrink: 0; }
.search-inp { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px 12px 12px 40px; border-radius: 12px; color: white; outline: none; font-size: 14px; }

/* SCROLLABLE LIST AREA */
.list-container { flex: 1; overflow-y: auto; padding: 0 20px 120px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

/* Inventory Card */
.inventory-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); user-select: none; transition: transform 0.1s; }
.inventory-card:active { transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.size-item { background: var(--bg); border-radius: 8px; padding: 8px 4px; text-align: center; border: 1px solid var(--border); }

/* History Card */
.history-date { font-size: 12px; font-weight: 800; color: var(--text-muted); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; background: var(--bg); padding: 5px 0; z-index: 10; }
.history-card { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
.h-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-bottom: 5px; display: inline-block; }
.h-sell { border-left-color: var(--success); } .h-sell .h-tag { background: rgba(16, 185, 129, 0.2); color: var(--success); }
.h-add { border-left-color: var(--primary); } .h-add .h-tag { background: rgba(99, 102, 241, 0.2); color: var(--primary); }

/* --- DOCK & MODAL --- */
.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 12px 20px calc(12px + var(--safe-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; z-index: 100; }
.btn { border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: white; }
.btn-p { background: var(--primary); } .btn-s { background: var(--surface-light); } .btn-d { background: var(--danger); }

/* MODAL TWEAKS FOR BATCH */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 950; display: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(4px); }
.modal-overlay.open { display: block; opacity: 1; }
.bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #1e293b; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 951; padding-bottom: calc(30px + var(--safe-bottom)); max-height: 90vh; overflow-y: auto; }
.modal-overlay.open .bottom-sheet { transform: translateY(0); }

.inp-large { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 16px; border-radius: 12px; font-size: 18px; outline: none; margin-bottom: 15px; }
.grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.qty-select { padding: 12px; width: 100%; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 10px; }
.qty-input { padding: 12px; width: 100%; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 10px; text-align: center; font-weight: bold; font-size: 16px; outline: none; }

.suggestions-box { position: absolute; top: 75px; left: 24px; right: 24px; background: var(--surface-light); z-index: 960; max-height: 150px; overflow-y: auto; display: none; border-radius: 0 0 12px 12px; border: 1px solid var(--border); }
.suggestions-box.active { display: block; }
.s-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }

/* BATCH LIST STYLES */
.batch-list { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
.batch-item { background: var(--surface-light); padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.batch-del { color: var(--danger); font-size: 20px; padding: 5px; cursor: pointer; }
.batch-pill { font-size: 10px; background: var(--bg); padding: 2px 6px; border-radius: 4px; margin-left: 4px; color: var(--text-muted); }

.empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()">
    <div class="sidebar" onclick="event.stopPropagation()">
        <h2 style="margin: 0 0 30px; padding: 0 15px;">Menu</h2>
        <div class="nav-item active" id="nav-home" onclick="switchView('home')">📦 Inventory Stock</div>
        <div class="nav-item" id="nav-history-add" onclick="switchView('history-add')">📥 Inward History</div>
        <div class="nav-item" id="nav-history-sell" onclick="switchView('history-sell')">📤 Sales History</div>
        <div style="margin-top:auto; padding:15px; font-size:11px; color:var(--text-muted)">
            <div onclick="resetApp()" style="cursor:pointer">⚠️ Reset App Data</div>
        </div>
    </div>
</div>

<!-- HEADER -->
<div class="app-header">
    <div style="display:flex; align-items:center">
        <div class="menu-btn" onclick="toggleSidebar()">☰</div>
        <div class="brand">Dilkhus Fashion</div>
    </div>
    <div class="status-badge"><div id="dot" class="status-dot"></div><span id="status">INIT</span></div>
</div>

<!-- VIEW: HOME -->
<div id="view-home" class="view-section active">
    <div class="sub-header">
        <div class="stats-row">
            <div class="stat-card"><span style="font-size:11px;color:var(--text-muted)">STOCK</span><div class="stat-val" id="d-stock" style="color:var(--primary)">0</div></div>
            <div class="stat-card"><span style="font-size:11px;color:var(--text-muted)">AVAILABLE</span><div class="stat-val" id="d-rem" style="color:var(--success)">0</div></div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" class="search-inp" id="mainSearch" placeholder="Search Design..." oninput="renderInventory()">
    </div>
    <div id="list" class="list-container"></div>
    <div class="dock">
        <button class="btn btn-s" onclick="openModal('sell')">📉 BATCH SELL</button>
        <button class="btn btn-p" onclick="openModal('add')">＋ ADD STOCK</button>
    </div>
</div>

<!-- VIEW: HISTORY -->
<div id="view-history" class="view-section">
    <div class="sub-header">
        <h2 id="history-title" style="margin:0">History</h2>
    </div>
    <div id="history-list" class="list-container" style="padding-top:10px"></div>
</div>

<!-- ADD/SELL MODAL (BATCH) -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h2 id="m-title" style="margin:0 0 15px">Update Stock</h2>
        
        <!-- Customer Name (Main Focus for Sell) -->
        <input id="m-customer" class="inp-large" placeholder="👤 Customer Name" style="border-color:var(--primary)">

        <!-- Design Input -->
        <div style="position:relative">
            <input id="m-design" class="inp-large" placeholder="# Design No." oninput="handleDesignInput(this.value)" autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>

        <div class="grid-inputs">
            <div><label style="font-size:10px">22x32</label><select id="s0" class="qty-select"></select><div id="l0" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">34x36</label><select id="s1" class="qty-select"></select><div id="l1" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">16x18</label><select id="s2" class="qty-select"></select><div id="l2" style="font-size:10px;text-align:center"></div></div>
            <div><label style="font-size:10px">26x30</label><select id="s3" class="qty-select"></select><div id="l3" style="font-size:10px;text-align:center"></div></div>
        </div>

        <!-- Add to Batch Button -->
        <button class="btn btn-s" style="width:100%; border:1px solid var(--border)" onclick="addToBatch()">⬇ ADD TO LIST</button>

        <!-- Batch List Container -->
        <div id="batch-container" class="batch-list" style="display:none">
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:10px">ITEMS IN CART</div>
            <div id="batch-items"></div>
            <button class="btn btn-p" style="width:100%; margin-top:15px" onclick="saveBatch()">✅ SAVE ALL</button>
        </div>
    </div>
</div>

<!-- MANAGE MODAL -->
<div class="modal-overlay" id="manageOverlay" onclick="closeManage()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;margin-bottom:20px">
            <h2 id="man-title" style="margin:0">Manage Item</h2>
            <button class="btn btn-s" style="padding:5px 10px;height:auto" onclick="closeManage()">✕</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:15px">Update current available quantity.</p>
        <div class="grid-inputs">
            <div><label style="font-size:10px">22x32</label><input type="number" id="man0" class="qty-input"></div>
            <div><label style="font-size:10px">34x36</label><input type="number" id="man1" class="qty-input"></div>
            <div><label style="font-size:10px">16x18</label><input type="number" id="man2" class="qty-input"></div>
            <div><label style="font-size:10px">26x30</label><input type="number" id="man3" class="qty-input"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <button class="btn btn-p" onclick="saveManagement()">UPDATE</button>
            <button class="btn btn-d" onclick="deleteItem()">DELETE</button>
        </div>
    </div>
</div>

<script>
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';
const sbClient = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32","34x36","16x18","26x30"];

// State
let inventory = [], transactions = [], queue = [];
let currentView = 'home'; 
let foundItem, modalMode = '';
let manageItem = null, pressTimer;
let currentBatch = []; // Stores the temporary list of items

// --- INIT ---
(async function init() {
    try {
        inventory = JSON.parse(localStorage.getItem('df_inv') || '[]');
        transactions = JSON.parse(localStorage.getItem('df_tx') || '[]');
        queue = JSON.parse(localStorage.getItem('df_q') || '[]');
    } catch(e) { console.error("Storage corrupt", e); }
    
    renderInventory();
    updateStatus();

    if(navigator.onLine) { syncData(); processQueue(); }
    window.addEventListener('online', () => { updateStatus(); processQueue(); });
    sbClient.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, syncData).subscribe();
})();

async function syncData() {
    const { data: invData } = await sbClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(invData) {
        const serverIds = invData.map(i => i.id);
        const locals = inventory.filter(i => !serverIds.includes(i.id));
        inventory = [...locals, ...invData];
        localStorage.setItem('df_inv', JSON.stringify(inventory));
        renderInventory();
    }
    const { data: txData } = await sbClient.from('transactions').select('*').order('created_at', {ascending:false}).limit(200);
    if(txData && txData.length > 0) {
        transactions = txData; 
        localStorage.setItem('df_tx', JSON.stringify(transactions));
        if(currentView !== 'home') renderHistory();
    }
}

function updateStatus() {
    const s = document.getElementById('status'), d = document.getElementById('dot');
    if(queue.length > 0) { s.innerText = 'SYNCING'; d.style.background = '#f59e0b'; }
    else if(navigator.onLine) { s.innerText = 'ONLINE'; d.style.background = '#10b981'; }
    else { s.innerText = 'OFFLINE'; d.style.background = '#ef4444'; }
}

async function processQueue() {
    if(!navigator.onLine || queue.length === 0) return;
    const op = queue[0];
    let err;
    try {
        if(op.table === 'inventory') {
            if(op.type === 'INSERT') err = (await sbClient.from('inventory').insert(op.data)).error;
            else if(op.type === 'UPDATE') err = (await sbClient.from('inventory').update(op.data).eq('id', op.id)).error;
        } else if(op.table === 'transactions') {
            err = (await sbClient.from('transactions').insert(op.data)).error;
        }
    } catch(e) { err = e; }
    if(!err) { queue.shift(); localStorage.setItem('df_q', JSON.stringify(queue)); updateStatus(); processQueue(); }
    else { if(err.code==='42501') queue.shift(); else setTimeout(processQueue, 5000); }
}

function renderInventory() {
    if(currentView !== 'home') return;
    const list = document.getElementById('list');
    const term = document.getElementById('mainSearch').value.toUpperCase();
    list.innerHTML = '';
    const active = inventory.filter(i => !i.deleted_at);
    document.getElementById('d-stock').innerText = active.reduce((a,c)=>a+c.stock.reduce((x,y)=>x+y,0),0);
    document.getElementById('d-rem').innerText = active.reduce((a,c)=>a+(c.stock.reduce((x,y)=>x+y,0)-c.sold.reduce((x,y)=>x+y,0)),0);
    const filtered = active.filter(i => i.design.includes(term)).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if(filtered.length === 0) list.innerHTML = '<div class="empty-state">No items found</div>';
    filtered.forEach(item => {
          const grid = item.stock.map((s,i) => {
              const rem = s - (item.sold[i]||0);
              return `<div class="size-item"><div style="font-size:9px;color:#94a3b8">${sizes[i]}</div><div style="font-weight:700;color:${rem<5?'#ef4444':'#10b981'}">${rem}</div></div>`;
          }).join('');
          const el = document.createElement('div');
          el.className = 'inventory-card';
          el.addEventListener('touchstart', () => { pressTimer = setTimeout(() => openManage(item), 800); });
          el.addEventListener('touchend', () => clearTimeout(pressTimer));
          el.addEventListener('mousedown', () => { pressTimer = setTimeout(() => openManage(item), 800); });
          el.addEventListener('mouseup', () => clearTimeout(pressTimer));
          el.oncontextmenu = (e) => e.preventDefault(); 
          el.innerHTML = `<div class="card-header"><span style="background:rgba(99,102,241,0.2);colo
