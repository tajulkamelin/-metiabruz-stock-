<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock Pro</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-elevated: #2c2c2e;
  --text: #ffffff;
  --text-secondary: #a1a1a6;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #32d74b;
  --border: rgba(255, 255, 255, 0.12);
  --glass: rgba(25, 25, 25, 0.85);
}

* { 
    box-sizing: border-box; margin: 0; padding: 0; 
    -webkit-tap-highlight-color: transparent; 
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
}

body { background: var(--bg); color: var(--text); padding-bottom: 140px; }

/* Premium iPhone Header */
.header-container {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass); backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border-bottom: 0.5px solid var(--border); padding: 55px 20px 15px;
}

.brand-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; }
.brand-row h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

.view-tabs { display: flex; background: rgba(120, 120, 128, 0.24); padding: 2px; border-radius: 10px; margin-bottom: 15px; }
.tab { flex: 1; padding: 7px; text-align: center; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; color: var(--text-secondary); background: none; transition: 0.2s; }
.tab.active { background: #636366; color: white; }

.search-bar {
    background: rgba(255, 255, 255, 0.1); border-radius: 10px; height: 38px;
    display: flex; align-items: center; padding: 0 10px;
}
.search-bar input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; margin-left: 8px; outline: none; user-select: text; -webkit-user-select: text; }

/* Inventory Cards */
.item-card { 
    background: var(--card); border-radius: 20px; padding: 20px; 
    border: 0.5px solid var(--border); margin: 15px 20px;
    display: flex; align-items: center; gap: 15px;
    transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}
.item-card:active { transform: scale(0.98); }
.item-card.selected { border-color: var(--primary); background: rgba(10, 132, 255, 0.1); }

.select-dot { display: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
.selection-active .select-dot { display: block; }
.selected .select-dot { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 4px var(--card); }

/* Icons */
.icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--card-elevated); border: 0.5px solid var(--border); }

/* Bottom Dock */
.bottom-dock {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--glass); backdrop-filter: blur(30px);
  border-top: 0.5px solid var(--border); padding: 15px 20px 35px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 1000;
}
.btn-dock { height: 54px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; transition: 0.1s; }
.btn-dock:active { transform: scale(0.96); opacity: 0.9; }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; align-items: flex-end; }
.modal.active { display: flex; }
.modal-content { 
    background: #1c1c1e; width: 100%; border-radius: 30px 30px 0 0; 
    padding: 30px 20px 50px; animation: slideUp 0.35s cubic-bezier(0.15, 1, 0.3, 1); 
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.ios-input { width: 100%; background: #2c2c2e; border: none; border-radius: 12px; padding: 16px; color: white; font-size: 17px; margin-bottom: 15px; outline: none; }
</style>
</head>
<body id="body">

<div id="selectionBar" style="display:none; position:fixed; top:0; left:0; right:0; z-index:2001; background:var(--primary); color:white; padding:55px 20px 15px; justify-content:space-between; align-items:center; font-weight:bold;">
    <span id="selectCount">0 Selected</span>
    <div style="display:flex; gap:20px">
        <button onclick="selectAll()" style="background:none; border:none; color:white; font-weight:bold">Select All</button>
        <button onclick="exitSelection()" style="background:none; border:none; color:white; font-weight:bold">Done</button>
    </div>
</div>

<div class="header-container">
  <div class="brand-row">
    <h2>Inventory</h2>
    <div id="statusIndicator" style="font-size:11px; font-weight:bold; color:var(--text-secondary)">ONLINE</div>
  </div>
  
  <div class="view-tabs">
    <button class="tab active" id="tabInv" onclick="switchView('inventory')">Active Items</button>
    <button class="tab" id="tabTrash" onclick="switchView('trash')">Recently Deleted</button>
  </div>

  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" placeholder="Search Design No." oninput="render()">
  </div>
</div>

<div id="inventoryList"></div>
<div id="trashList" style="display:none"></div>

<div class="bottom-dock" id="bottomDock">
  <button class="btn-dock" style="background:var(--primary); color:white" onclick="openModal('add')">Add Stock</button>
  <button class="btn-dock" style="background:white; color:black" onclick="openModal('sell')">Record Sale</button>
</div>

<div class="bottom-dock" id="deleteDock" style="display:none">
    <button class="btn-dock" style="background:var(--danger); color:white; grid-column: span 2;" onclick="confirmMultiDelete()">Move to Trash</button>
</div>

<div class="modal" id="entryModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="width:36px; height:5px; background:rgba(255,255,255,0.2); border-radius:3px; margin:0 auto 20px;"></div>
        <h2 id="modalTitle" style="margin-bottom:20px; font-weight:800;">Entry</h2>
        <input type="text" id="designInput" class="ios-input" placeholder="Design No.">
        <div id="modalInputs" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;"></div>
        <button id="modalSubmit" class="btn-dock" style="width:100%; background:var(--primary); color:white;" onclick="processEntry()">Confirm Changes</button>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache') || '[]');
let isSelectionMode = false;
let selectedIds = new Set();
let currentView = 'inventory';
let longPressTimer;
const sizes = ["22x32", "34x36", "16x18", "26x30"];

// --- HAPTIC FEEDBACK ---
function haptic(type = 'light') {
    if (!window.navigator.vibrate) return;
    if (type === 'light') navigator.vibrate(10);
    else if (type === 'medium') navigator.vibrate(35);
    else if (type === 'heavy') navigator.vibrate([50, 30, 50]);
}

function switchView(v) {
    haptic();
    currentView = v;
    document.getElementById('tabInv').classList.toggle('active', v === 'inventory');
    document.getElementById('tabTrash').classList.toggle('active', v === 'trash');
    document.getElementById('inventoryList').style.display = v === 'inventory' ? 'block' : 'none';
    document.getElementById('trashList').style.display = v === 'trash' ? 'block' : 'none';
    render();
}

function handleTouchStart(id) {
    if(isSelectionMode) return;
    longPressTimer = setTimeout(() => {
        haptic('medium');
        enterSelection(id);
    }, 700);
}
function handleTouchEnd() { clearTimeout(longPressTimer); }

function render() {
    const term = document.getElementById('searchInput').value.toUpperCase();
    const invList = document.getElementById('inventoryList');
    const trashList = document.getElementById('trashList');
    invList.innerHTML = ''; trashList.innerHTML = '';

    inventory.forEach(item => {
        if(!item.design.toUpperCase().includes(term)) return;
        const isSelected = selectedIds.has(item.id);
        const card = document.createElement('div');
        card.className = `item-card ${isSelected ? 'selected' : ''}`;
        
        card.addEventListener('touchstart', () => handleTouchStart(item.id));
        card.addEventListener('touchend', handleTouchEnd);
        card.onclick = () => { if(isSelectionMode) { haptic(); toggleSelect(item.id); } };

        card.innerHTML = `
            <div class="select-dot"></div>
            <div style="flex:1">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; color:var(--primary); font-size:20px; letter-spacing:-0.5px"># ${item.design}</span>
                    <div style="display:flex; gap:12px;">
                        ${!item.deleted_at ? `
                            <div class="icon-btn" onclick="event.stopPropagation(); haptic(); openModal('edit','${item.id}')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </div>
                            <div class="icon-btn" onclick="event.stopPropagation(); haptic('medium'); singleDelete('${item.id}')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;">
                    ${item.stock.map((s,i) => `
                        <div style="text-align:center">
                            <div style="font-size:9px; color:var(--text-secondary); font-weight:700; margin-bottom:4px">${sizes[i]}</div>
                            <div style="font-weight:bold; font-size:15px; color:${(s-item.sold[i]) < 5 ? 'var(--danger)' : 'white'}">${s-item.sold[i]}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
            ${item.deleted_at ? `<button onclick="restoreItem('${item.id}')" style="background:var(--success); color:black; border:none; padding:10px 16px; border-radius:12px; font-weight:bold; font-size:12px">RESTORE</button>` : ''}
        `;

        if(!item.deleted_at && currentView === 'inventory') invList.appendChild(card);
        else if(item.deleted_at && currentView === 'trash') trashList.appendChild(card);
    });
}

function singleDelete(id) {
    const item = inventory.find(it => it.id === id);
    item.deleted_at = new Date().toISOString();
    saveAndSync();
}

function enterSelection(id) {
    isSelectionMode = true;
    document.getElementById('body').classList.add('selection-active');
    document.getElementById('bottomDock').style.display = 'none';
    document.getElementById('deleteDock').style.display = 'grid';
    document.getElementById('selectionBar').style.display = 'flex';
    toggleSelect(id);
}

function exitSelection() {
    haptic();
    isSelectionMode = false; selectedIds.clear();
    document.getElementById('body').classList.remove('selection-active');
    document.getElementById('bottomDock').style.display = 'grid';
    document.getElementById('deleteDock').style.display = 'none';
    document.getElementById('selectionBar').style.display = 'none';
    render();
}

function toggleSelect(id) {
    if(selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    document.getElementById('selectCount').innerText = `${selectedIds.size} Selected`;
    render();
}

function selectAll() {
    haptic();
    inventory.filter(it => !it.deleted_at).forEach(it => selectedIds.add(it.id));
    document.getElementById('selectCount').innerText = `${selectedIds.size} Selected`;
    render();
}

async function confirmMultiDelete() {
    haptic('heavy');
    const now = new Date().toISOString();
    inventory.forEach(it => { if(selectedIds.has(it.id)) it.deleted_at = now; });
    saveAndSync(); exitSelection();
}

function openModal(m, id = null) {
    haptic();
    mode = m; editingId = id;
    const item = id ? inventory.find(it => it.id === id) : null;
    document.getElementById('modalTitle').innerText = m === 'add' ? "Add Stock" : m === 'sell' ? "Record Sale" : "Edit Design";
    document.getElementById('designInput').value = item ? item.design : '';
    document.getElementById('modalInputs').innerHTML = sizes.map((s,i) => `
        <div><label style="font-size:11px; font-weight:700; color:var(--text-secondary); margin-bottom:5px; display:block">${s}</label>
        <input type="number" id="m${i}" class="ios-input" value="${(m==='edit' && item)?item.stock[i]:0}"></div>
    `).join('');
    document.getElementById('entryModal').classList.add('active');
}

async function processEntry() {
    haptic('medium');
    const dNo = document.getElementById('designInput').value.trim().toUpperCase();
    const qtys = sizes.map((_, i) => +document.getElementById(`m${i}`).value);
    if(!dNo) return;

    if(mode === 'edit') {
        let it = inventory.find(x => x.id === editingId);
        it.design = dNo; it.stock = qtys;
    } else if(mode === 'add') {
        let target = inventory.find(it => it.design === dNo);
        if(target) target.stock = target.stock.map((v,i) => v + qtys[i]);
        else inventory.unshift({ id: crypto.randomUUID(), design: dNo, stock: qtys, sold: [0,0,0,0], created_at: new Date().toISOString() });
    } else {
        let target = inventory.find(it => it.design === dNo);
        if(target) target.sold = target.sold.map((v,i) => v + qtys[i]);
    }
    saveAndSync(); closeModal();
}

function saveAndSync() {
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
    supabaseClient.from('inventory').upsert(inventory).then(() => {
        document.getElementById('statusIndicator').innerText = "ONLINE";
    });
    render();
}

function restoreItem(id) {
    haptic('medium');
    const item = inventory.find(it => it.id === id);
    if(item) { delete item.deleted_at; saveAndSync(); }
}

function closeModal() { document.getElementById('entryModal').classList.remove('active'); }

async function fetchData() {
    const {data} = await supabaseClient.from('inventory').select('*');
    if(data) { inventory = data; render(); }
}

fetchData();
</script>
</body>
</html>
