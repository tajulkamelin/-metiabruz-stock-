<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dilkhus Fashion 3D Pro</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root { 
    --bg: #121214; --card: #1c1c1e; --primary: #e91e63; 
    --success: #22c55e; --danger: #ef4444; --text: #ffffff;
    --text-muted: #8e8e93; --inner-sh: inset 2px 2px 5px rgba(0,0,0,0.5);
    --outer-sh: 8px 8px 16px rgba(0,0,0,0.4), -4px -4px 12px rgba(255,255,255,0.03);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', system-ui, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 140px; overflow-x: hidden; }

/* LIQUID WAVE */
#liquid-wave { position: fixed; inset: 0; background: var(--primary); z-index: 2000; clip-path: circle(0% at 50% 50%); transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1); pointer-events: none; }
#liquid-wave.active { clip-path: circle(150% at 50% 50%); }

/* UI COMPONENTS */
.header { position: sticky; top: 0; z-index: 50; background: rgba(18, 18, 20, 0.9); backdrop-filter: blur(20px); padding: 50px 20px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.stat-card { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--outer-sh); border: 1px solid rgba(255,255,255,0.03); }
.card { background: var(--card); border-radius: 22px; padding: 22px; margin: 0 20px 20px; box-shadow: var(--outer-sh); transition: 0.2s; }
.size-box { background: #121214; border-radius: 12px; box-shadow: var(--inner-sh); padding: 12px 5px; text-align: center; }

.dock { position: fixed; bottom: 30px; left: 20px; right: 20px; background: rgba(28,28,30,0.8); backdrop-filter: blur(25px); border-radius: 25px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 100; }
.btn { height: 55px; border-radius: 18px; border: none; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.btn-primary { background: var(--primary); color: white; box-shadow: var(--outer-sh); }
.btn-glass { background: rgba(255,255,255,0.05); color: white; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2100; display: none; align-items: flex-end; }
.modal-bg.open { display: flex; }
.modal { background: #111113; width: 100%; border-radius: 28px 28px 0 0; padding: 20px 24px 60px; border-top: 1px solid rgba(255,255,255,0.1); }
.inp-large { width: 100%; background: #1c1c1f; border: none; box-shadow: var(--inner-sh); color: #FFF; padding: 18px; border-radius: 15px; font-size: 18px; margin-bottom: 15px; outline: none; }

/* PRINTING (YOUR DESIRED TABLE) */
.print-area { display: none; }
@media print {
    body { background: white !important; color: black !important; }
    .header, .dock, .dash-container, #list, #liquid-wave { display: none !important; }
    .print-area { display: block !important; padding: 20px; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; }
    th, td { border: 1px solid #000; padding: 6px; text-align: center; }
    th { background: #f0f0f0; }
    @page { size: landscape; margin: 10mm; }
}
</style>
</head>
<body>

<div id="liquid-wave"></div>

<div class="header">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px">
            <img src="https://i.ibb.co/S76pM38S/image.png" style="width:35px; border-radius:50%; border:1px solid var(--primary)">
            <span style="font-size:22px; font-weight:900;">Dilkhus Fashion</span>
        </div>
        <button class="btn btn-glass" style="height:35px; padding:0 15px; font-size:10px" onclick="printStock()">PRINT STOCK</button>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-glass" style="flex:1; height:40px; font-size:11px;" onclick="triggerLiquid('active')">INVENTORY</button>
        <button class="btn btn-glass" style="flex:1; height:40px; font-size:11px; background:rgba(0,0,0,0.3)" onclick="triggerLiquid('trash')">TRASH</button>
    </div>
</div>

<div class="dash-container">
    <div class="stat-card"><div style="font-size:10px; color:var(--text-muted)">TOTAL STOCK</div><div class="stat-val" id="d-stock" style="color:var(--primary)">0</div></div>
    <div class="stat-card"><div style="font-size:10px; color:var(--text-muted)">REMAINING</div><div class="stat-val" id="d-rem" style="color:var(--success)">0</div></div>
</div>

<div id="list" style="height: calc(100vh - 320px); overflow-y: auto;"></div>

<div class="dock">
    <button class="btn btn-primary" onclick="openModal('add')">ADD</button>
    <button class="btn btn-glass" onclick="openModal('sell')">SELL</button>
</div>

<div class="modal-bg" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 id="m-title" style="margin-bottom:20px">Action</h2>
        <input id="m-design" class="inp-large" placeholder="Design Number" oninput="checkDup(this.value)">
        <div id="stock-hint" style="font-size:12px; color:var(--warning); margin-bottom:10px; display:none;"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;">
            <div><label style="font-size:10px; color:var(--text-muted)">22x32</label><select id="s0" class="inp-large" style="padding:10px;"></select></div>
            <div><label style="font-size:10px; color:var(--text-muted)">34x36</label><select id="s1" class="inp-large" style="padding:10px;"></select></div>
            <div><label style="font-size:10px; color:var(--text-muted)">16x18</label><select id="s2" class="inp-large" style="padding:10px;"></select></div>
            <div><label style="font-size:10px; color:var(--text-muted)">26x30</label><select id="s3" class="inp-large" style="padding:10px;"></select></div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="finalSubmit()">SAVE ENTRY</button>
        <button class="btn btn-glass" style="width:100%; margin-top:10px" onclick="closeModal()">CANCEL</button>
    </div>
</div>

<div id="print-area" class="print-area"></div>

<script>
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';
const sbClient = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32","34x36","16x18","26x30"];
let inventory = [];
let currentTab = 'active';
let foundItem = null;

(async function init() {
    const local = localStorage.getItem('dilkhus_inv');
    if(local) { inventory = JSON.parse(local); render(); }
    fetchLatest();
    
    const opts = `<option value="0">0</option>` + Array.from({length:100},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
    [0,1,2,3].forEach(i => document.getElementById('s'+i).innerHTML = opts);

    sbClient.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, fetchLatest).subscribe();
})();

async function fetchLatest() {
    const { data } = await sbClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(data) { inventory = data; localStorage.setItem('dilkhus_inv', JSON.stringify(data)); render(); }
}

function triggerLiquid(tab) {
    document.getElementById('liquid-wave').classList.add('active');
    setTimeout(() => { currentTab = tab; render(); document.getElementById('liquid-wave').classList.remove('active'); }, 800);
}

function render() {
    const list = document.getElementById('list'); list.innerHTML = '';
    const filtered = inventory.filter(i => currentTab === 'active' ? !i.deleted_at : !!i.deleted_at);
    
    // Stats
    const active = inventory.filter(i => !i.deleted_at);
    document.getElementById('d-stock').innerText = active.reduce((a,c)=>a+c.stock.reduce((x,y)=>x+y,0),0);
    document.getElementById('d-rem').innerText = active.reduce((a,c)=>a+(c.stock.reduce((x,y)=>x+y,0)-c.sold.reduce((x,y)=>x+y,0)),0);

    filtered.forEach(item => {
        const el = document.createElement('div'); el.className = 'card';
        let grid = item.stock.map((s, idx) => {
            const rem = s-(item.sold[idx]||0);
            return `<div class="size-box"><div style="font-size:9px;color:var(--text-muted)">${sizes[idx]}</div><div style="font-weight:900;color:${rem<5?'var(--danger)':'var(--success)'}">${rem}</div></div>`;
        }).join('');
        el.innerHTML = `<div style="font-weight:900;font-size:20px;margin-bottom:15px;color:var(--primary)">#${item.design}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${grid}</div>`;
        list.appendChild(el);
    });
}

function checkDup(val) {
    foundItem = inventory.find(i => i.design === val.trim().toUpperCase() && !i.deleted_at);
    const hint = document.getElementById('stock-hint');
    if(foundItem) {
        const rems = foundItem.stock.map((s,i)=>s-(foundItem.sold[i]||0));
        hint.style.display = 'block'; hint.innerText = `Current: [${sizes[0]}:${rems[0]}] [${sizes[1]}:${rems[1]}] [${sizes[2]}:${rems[2]}] [${sizes[3]}:${rems[3]}]`;
    } else { hint.style.display = 'none'; }
}

function openModal(m) { modalMode = m; document.getElementById('m-title').innerText = m === 'add' ? 'Add Stock' : 'Sell Stock'; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function finalSubmit() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    const qtys = [0,1,2,3].map(i => +document.getElementById('s'+i).value);
    if(!dNo) return;

    if(modalMode === 'add') {
        if(foundItem) {
            const newStock = foundItem.stock.map((s,i) => s + qtys[i]);
            await sbClient.from('inventory').update({ stock: newStock }).eq('id', foundItem.id);
        } else {
            await sbClient.from('inventory').insert({ design: dNo, stock: qtys, sold: [0,0,0,0] });
        }
    } else {
        if(!foundItem) return alert("Error: Design not found in inventory!");
        // VALIDATION: Don't sell more than you have
        const canSell = foundItem.stock.every((s, i) => (s - foundItem.sold[i]) >= qtys[i]);
        if(!canSell) return alert("Insufficient Stock! Check remaining quantities.");
        
        const newSold = foundItem.sold.map((s,i) => s + qtys[i]);
        await sbClient.from('inventory').update({ sold: newSold }).eq('id', foundItem.id);
    }
    closeModal(); fetchLatest();
}

function printStock() {
    const active = inventory.filter(i => !i.deleted_at);
    let tS=0, tSo=0, tR=0;
    const rows = active.map(i => {
        const s=i.stock.reduce((a,b)=>a+b,0), so=i.sold.reduce((a,b)=>a+b,0), rems=i.stock.map((v,x)=>v-(i.sold[x]||0)), r=rems.reduce((a,b)=>a+b,0);
        tS+=s; tSo+=so; tR+=r;
        return `<tr><td>#${i.design}</td><td>${i.stock[0]}</td><td>${i.stock[1]}</td><td>${i.stock[2]}</td><td>${i.stock[3]}</td><td>${i.sold[0]}</td><td>${i.sold[1]}</td><td>${i.sold[2]}</td><td>${i.sold[3]}</td><td>${rems[0]}</td><td>${rems[1]}</td><td>${rems[2]}</td><td>${rems[3]}</td><td style="font-weight:bold">${r}</td></tr>`;
    }).join('');
    document.getElementById('print-area').innerHTML = `<div style="text-align:center"><img src="https://i.ibb.co/S76pM38S/image.png" style="width:60px"><h1>Dilkhus Fashion Report</h1><p>${new Date().toLocaleString()}</p><p><b>Stock: ${tS} | Sold: ${tSo} | Rem: ${tR}</b></p></div><table><thead><tr><th rowspan="2">Design</th><th colspan="4">Stock</th><th colspan="4">Sold</th><th colspan="4">Remaining</th><th rowspan="2">Total</th></tr><tr><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th><th>22x32</th><th>34x36</th><th>16x18</th><th>26x30</th></tr></thead><tbody>${rows}</tbody></table>`;
    window.print();
}
</script>
</body>
</html>
