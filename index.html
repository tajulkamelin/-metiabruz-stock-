<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metiabruz Stock</title>

<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-highlight: #2c2c2e;
  --text: #ffffff;
  --muted: #8e8e93;
  --border: #38383a;
  --primary: #0a84ff;
  --danger: #ff453a;
  --success: #30d158;
  --glass: rgba(28, 28, 30, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 140px;
}

/* --- iOS Header --- */
.header-container {
  position: sticky; top: 0; z-index: 50;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
}

.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
h2 { font-size: 28px; font-weight: 700; }
#statusIndicator { font-size: 11px; font-weight: 600; padding: 4px 10px; background: var(--card-highlight); border-radius: 20px; color: var(--muted); }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summary-card { background: var(--card-highlight); padding: 10px 4px; border-radius: 10px; text-align: center; }
.summary-card label { font-size: 9px; color: var(--muted); text-transform: uppercase; display: block; }
.summary-card .value { font-size: 15px; font-weight: 700; }
.summary-card.green .value { color: var(--success); }

/* --- Search & Controls --- */
.controls-area { padding: 16px; }
.search-box { background: var(--card-highlight); border-radius: 10px; padding: 8px; display: flex; gap: 8px; align-items: center; }
.search-box input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 17px; }
.search-box select { background: var(--card); color: var(--primary); border: none; border-radius: 8px; padding: 8px; font-weight: 600; }

.bulk-actions { display: flex; gap: 10px; margin-top: 12px; }

/* --- Inventory List --- */
.inventory-list { display: flex; flex-direction: column; gap: 16px; padding: 0 16px; }
.item-card { background: var(--card); border-radius: 14px; padding: 16px; }
.item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.design-name { font-size: 20px; font-weight: 700; }

.col-headers { display: grid; grid-template-columns: 60px 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; opacity: 0.5; font-size: 10px; font-weight: 600; text-align: center; }
.size-row { display: grid; grid-template-columns: 60px 1fr 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.size-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.qty-select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 0; text-align: center; font-weight: 600; appearance: none; }
.input-remain { font-size: 15px; font-weight: 700; color: var(--success); text-align: center; }

/* --- Modal & Suggestions --- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; opacity: 0; transition: 0.2s; }
.modal.active { display: flex; opacity: 1; }
.modal-content { background: var(--card); width: 100%; border-radius: 20px 20px 0 0; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal input, .modal select { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 12px; }

/* Suggestion Box */
.suggestion-container { position: relative; width: 100%; }
#suggestionList { 
    position: absolute; top: -5px; left: 0; right: 0; 
    background: var(--card-highlight); border-radius: 0 0 10px 10px; 
    max-height: 150px; overflow-y: auto; z-index: 210; border: 1px solid var(--border);
    display: none;
}
.suggestion-item { padding: 12px; border-bottom: 1px solid var(--border); color: var(--primary); font-weight: 600; }
.suggestion-item:active { background: var(--border); }

.action-buttons { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(25px); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; border-top: 1px solid var(--border); z-index: 100; }
.btn { padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: var(--card-highlight); color: var(--primary); }
.btn-danger { background: rgba(255, 69, 58, 0.15); color: var(--danger); }

@media print { .header-container, .controls-area, .action-buttons, .btn-danger { display: none !important; } }
</style>
</head>
<body>

<div class="header-container">
  <div class="top-bar">
    <h2>📦 Stock</h2>
    <div id="statusIndicator">Offline</div>
  </div>
  <div class="summary">
    <div class="summary-card"><label>Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card green"><label>Left</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Items</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<div class="controls-area">
  <div class="search-box">
    <span>🔍</span>
    <input id="searchInput" placeholder="Search Design No..." onkeyup="render()">
    <select id="sortSelect" onchange="setSort(this.value)">
      <option value="recent">Recent</option>
      <option value="asc">A → Z</option>
      <option value="desc">Z → A</option>
    </select>
  </div>
  <div class="bulk-actions">
    <button class="btn btn-secondary" style="flex:1" onclick="toggleSelect()">Select</button>
    <button class="btn btn-danger" style="flex:1" onclick="deleteSelected()">Delete</button>
  </div>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="action-buttons">
  <button class="btn btn-primary" onclick="openAdd()">➕ Add</button>
  <button class="btn btn-secondary" onclick="window.print()">🖨 Print</button>
  <button class="btn btn-secondary" onclick="fetchData()">🔄 Sync</button>
  <button class="btn btn-secondary" onclick="saveCache()">💾 Save</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <div style="width:40px;height:4px;background:#38383a;margin:0 auto 20px auto;border-radius:2px;"></div>
    <h3>Enter Design Number</h3>
    
    <div class="suggestion-container">
        <input type="text" id="manualDesignInput" placeholder="Type Design No (e.g. 1001)" autocomplete="off" onkeyup="showSuggestions(this.value)">
        <div id="suggestionList"></div>
    </div>

    <div class="size-inputs">
      <select id="s0"><option value="" disabled selected>22x32 Qty</option></select>
      <select id="s1"><option value="" disabled selected>34x36 Qty</option></select>
      <select id="s2"><option value="" disabled selected>16x18 Qty</option></select>
      <select id="s3"><option value="" disabled selected>26x30 Qty</option></select>
    </div>
    
    <button class="btn btn-primary" style="width:100%; margin-top:12px; height:50px; font-size:16px" onclick="handleAdd()">Save Design</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient('https://yhlfqpiwevsehlgbhxtk.supabase.co','sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S');

let inventory = JSON.parse(localStorage.getItem('inventoryCache')||'[]');
let syncQueue = JSON.parse(localStorage.getItem('syncQueue')||'[]');
let remembered = JSON.parse(localStorage.getItem('rememberedDesigns')||'["1001","1002","2001","3001"]');
let selectMode = false, selected = new Set(), sortMode = 'recent';
const sizes=["22x32","34x36","16x18","26x30"];

// Init Qty Dropdowns
function initQtys() {
    let opts = ''; for(let i=0; i<=50; i++) opts += `<option value="${i}">${i}</option>`;
    ['s0','s1','s2','s3'].forEach(id => {
        const lbl = document.getElementById(id).children[0].textContent;
        document.getElementById(id).innerHTML = `<option value="0" selected>${lbl}: 0</option>` + opts;
    });
}
initQtys();

// Suggestion Logic
function showSuggestions(val) {
    const list = document.getElementById('suggestionList');
    if(!val) { list.style.display = 'none'; return; }
    const matches = remembered.filter(d => d.includes(val)).slice(0, 5);
    if(matches.length === 0) { list.style.display = 'none'; return; }
    
    list.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="selectSug('${m}')">${m}</div>`).join('');
    list.style.display = 'block';
}

function selectSug(val) {
    document.getElementById('manualDesignInput').value = val;
    document.getElementById('suggestionList').style.display = 'none';
}

function handleAdd() {
    const dVal = document.getElementById('manualDesignInput').value.trim();
    if(!dVal) return alert("Enter Design Number");

    const existing = inventory.find(x => x.design === dVal);
    const newQtys = [+s0.value, +s1.value, +s2.value, +s3.value];

    if(existing) {
        if(confirm(`Design ${dVal} already exists. Add these quantities to current stock?`)) {
            existing.stock = existing.stock.map((v, i) => v + newQtys[i]);
            upd(existing.id, null, null, 'full_update');
            closeAdd();
        }
        return;
    }

    // New Design Logic
    const item = { id: crypto.randomUUID(), design: dVal, stock: newQtys, sold: [0,0,0,0] };
    inventory.unshift(item);
    syncQueue.push({type:'add', item});
    
    if(!remembered.includes(dVal)) {
        remembered.push(dVal);
        localStorage.setItem('rememberedDesigns', JSON.stringify(remembered));
    }

    closeAdd(); render(); syncNow();
}

function openAdd() { 
    document.getElementById('manualDesignInput').value = '';
    ['s0','s1','s2','s3'].forEach(id => document.getElementById(id).value = "0");
    addModal.classList.add('active'); 
}
function closeAdd() { addModal.classList.remove('active'); document.getElementById('suggestionList').style.display = 'none'; }

function upd(id, idx, val, type) {
    const it = inventory.find(x => x.id === id);
    if(!it) return;
    if(type === 'stock') it.stock[idx] = +val;
    if(type === 'sold') it.sold[idx] = +val;
    syncQueue.push({type:'update', data: it});
    render();
}

function render() {
    let list = [...inventory];
    const term = searchInput.value.toLowerCase();
    if(sortMode==='asc') list.sort((a,b)=>a.design.localeCompare(b.design, undefined, {numeric: true}));
    if(sortMode==='desc') list.sort((a,b)=>b.design.localeCompare(a.design, undefined, {numeric: true}));

    inventoryList.innerHTML = '';
    let ts=0, td=0;

    list.filter(i => i.design.toLowerCase().includes(term)).forEach(item => {
        let rows = '';
        item.stock.forEach((sVal, i) => {
            ts += sVal; td += item.sold[i];
            rows += `
            <div class="size-row">
                <div class="size-label">${sizes[i]}</div>
                <select class="qty-select" onchange="upd('${item.id}',${i},this.value,'stock')">
                    ${getOpts(sVal)}
                </select>
                <select class="qty-select" onchange="upd('${item.id}',${i},this.value,'sold')">
                    ${getOpts(item.sold[i])}
                </select>
                <div class="input-remain">${sVal - item.sold[i]}</div>
            </div>`;
        });

        inventoryList.innerHTML += `
        <div class="item-card">
            <div class="item-header">
                <div>
                    ${selectMode ? `<input type="checkbox" onchange="togglePick('${item.id}')"> ` : ''}
                    <span class="design-name"># ${item.design}</span>
                </div>
                <button class="btn-danger" style="padding:4px 8px; font-size:10px" onclick="del('${item.id}')">DEL</button>
            </div>
            <div class="col-headers"><span>SIZE</span><span>STOCK</span><span>SOLD</span><span>REM</span></div>
            ${rows}
        </div>`;
    });
    totalStock.innerText = ts; totalSold.innerText = td; totalRemaining.innerText = ts-td;
    designCount.innerText = inventory.length;
    saveCache();
}

function getOpts(sel) {
    let h = ''; for(let i=0; i<=100; i++) h += `<option value="${i}" ${i==sel?'selected':''}>${i}</option>`;
    return h;
}

function saveCache() {
    localStorage.setItem('inventoryCache', JSON.stringify(inventory));
    localStorage.setItem('syncQueue', JSON.stringify(syncQueue));
}

function del(id) {
    if(!confirm("Delete?")) return;
    const it = inventory.find(x => x.id === id);
    inventory = inventory.filter(x => x.id !== id);
    syncQueue.push({type:'delete', design: it.design});
    render(); syncNow();
}

async function syncNow() {
    if(!navigator.onLine) { statusIndicator.innerText="Offline"; return; }
    statusIndicator.innerText="Syncing...";
    const q = [...syncQueue]; syncQueue = []; saveCache();
    for(const j of q) {
        if(j.type==='add') await supabaseClient.from('inventory').insert(j.item);
        if(j.type==='update') await supabaseClient.from('inventory').update({stock:j.data.stock, sold:j.data.sold}).eq('id', j.data.id);
        if(j.type==='delete') await supabaseClient.from('inventory').delete().eq('design', j.design);
    }
    statusIndicator.innerText="Online";
}

async function fetchData() {
    if(!navigator.onLine) return;
    const {data} = await supabaseClient.from('inventory').select('*').order('created_at', {ascending:false});
    if(data) { inventory = data; render(); }
}

function toggleSelect() { selectMode = !selectMode; render(); }
function setSort(v) { sortMode = v; render(); }

render();
fetchData();
setInterval(syncNow, 15000);
</script>
</body>
</html>
