<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
    --bg: #0f172a; --surface: #1e293b; --surface-light: #334155;
    --text: #f8fafc; --text-muted: #94a3b8; --border: rgba(255,255,255,0.08);
    --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    --met-color: #6366f1; /* Indigo */
    --uns-color: #06b6d4; /* Teal */
    --safe-bottom: env(safe-area-inset-bottom);
}

/* THEMES */
body.theme-met { --primary: var(--met-color); } 
body.theme-uns { --primary: var(--uns-color); } 

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: --primary 0.3s; }

/* HEADER */
.app-header { background: rgba(15, 23, 42, 0.95); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 50; flex-shrink: 0; backdrop-filter: blur(10px); }
.menu-btn { font-size: 24px; cursor: pointer; margin-right: 15px; }
.brand { display: flex; flex-direction: column; font-weight: 800; font-size: 18px; line-height: 1.1; }
.brand span { font-size: 10px; color: var(--primary); letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
.status-badge { font-size: 10px; font-weight: 700; background: var(--surface); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); transition: 0.3s; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); transition: 0.3s; box-shadow: 0 0 5px currentColor; }

/* SIDEBAR */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 900; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(4px); }
.sidebar-overlay.open { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); z-index: 901; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
.sidebar-overlay.open .sidebar { transform: translateX(0); }
.nav-item { padding: 15px; border-radius: 10px; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
.nav-item.active { background: var(--primary); color: white; }
.nav-item.global-item { background: linear-gradient(135deg, var(--met-color), var(--uns-color)); color: white; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; }

.location-switch { margin-bottom: 20px; background: var(--bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
.loc-btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-muted); font-weight: 700; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.loc-btn.active { background: rgba(255,255,255,0.05); color: white; border-color: var(--primary); }

/* VIEWS & CARDS */
.view-section { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.view-section.active { display: flex; }
.sub-header { padding: 15px 20px 0; display: grid; gap: 15px; flex-shrink: 0; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card { background: var(--surface); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
.stat-val { font-size: 24px; font-weight: 800; margin-top: 4px; }
.filter-row { padding: 15px 20px; display: flex; gap: 10px; flex-shrink: 0; }
.search-container { flex: 1; position: relative; }
.search-inp { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 12px 12px 12px 40px; border-radius: 12px; color: white; outline: none; font-size: 14px; }
.print-btn { width: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
.list-container { flex: 1; overflow-y: auto; padding: 0 20px 120px; scroll-behavior: smooth; }

/* INVENTORY CARD */
.inventory-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); user-select: none; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.size-item { background: var(--bg); border-radius: 8px; padding: 8px 4px; text-align: center; border: 1px solid var(--border); }

/* GLOBAL DASHBOARD */
.global-card { background: var(--surface); border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); }
.global-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 800; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
.global-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
.wh-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; width: 60px; text-align: center; display: inline-block; }
.wh-met { background: rgba(99, 102, 241, 0.2); color: var(--met-color); border: 1px solid var(--met-color); }
.wh-uns { background: rgba(6, 182, 212, 0.2); color: var(--uns-color); border: 1px solid var(--uns-color); }
.global-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; margin-left: 10px; }
.g-box { background: var(--bg); text-align: center; padding: 4px; border-radius: 4px; font-size: 12px; font-weight: 700; color: #fff; }

/* REPORTS */
.report-filters { padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.history-card { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--text-muted); display: flex; justify-content: space-between; align-items: center; position: relative; }
.history-card.sell { border-left-color: var(--success); }
.history-card.add { border-left-color: var(--primary); }
.h-tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 5px; display: inline-block; }
.h-tag.sell { background: rgba(16, 185, 129, 0.2); color: var(--success); }
.h-tag.add { background: rgba(255, 255, 255, 0.1); color: var(--text); border: 1px solid var(--border); }

/* MODAL */
.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 12px 20px calc(12px + var(--safe-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; z-index: 100; }
.btn { border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: white; transition: 0.2s; }
.btn-p { background: var(--primary); } .btn-s { background: var(--surface-light); } .btn-d { background: var(--danger); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 950; display: none; opacity: 0; backdrop-filter: blur(4px); }
.modal-overlay.open { display: block; opacity: 1; }
.bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #1e293b; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s; z-index: 951; padding-bottom: calc(30px + var(--safe-bottom)); max-height: 90vh; overflow-y: auto; }
.modal-overlay.open .bottom-sheet { transform: translateY(0); }

.inp-large, .report-inp { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 12px; }
.grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.qty-select, .qty-input { padding: 12px; width: 100%; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; text-align: center; font-weight: bold; }

.suggestions-box { position: absolute; top: 70px; left: 24px; right: 24px; background: var(--surface-light); z-index: 960; max-height: 150px; overflow-y: auto; display: none; border-radius: 0 0 12px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.suggestions-box.active { display: block; }
.s-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }

.import-box { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; background: rgba(0,0,0,0.2); }
.loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* PRINT */
#print-area { display: none; }
@media print {
    body { background-color: #fff !important; color: #000 !important; }
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-family: sans-serif; font-size: 12px; color: #000; }
    th, td { border: 1px solid #000; padding: 6px; text-align: center; color: #000; }
    th { background-color: #f0f0f0 !important; -webkit-print-color-adjust: exact; }
}
.empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
</style>
</head>

<script>
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';
const sizes = ["22x32","34x36","16x18","26x30"];
let sbClient = supabase.createClient(SB_URL, SB_KEY);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');

let currentLocation = localStorage.getItem('app_location') || 'METIABRUZ';
let inventory = [], transactions = [], queue = [];
let globalStockData = [], filteredTransactions = [];
let currentView = 'home';
let foundItem, modalMode = '', manageItem = null, currentBatch = [];

(async function init() {
    updateTheme();
    loadLocalData();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('rep-start').value = today;
    document.getElementById('rep-end').value = today;

    if(navigator.onLine) { 
        syncData(); 
        processQueue(); 
        ['inventory_met','inventory_uns','transactions_met','transactions_uns'].forEach(t => {
            sbClient.channel(t).on('postgres_changes', { event: '*', schema: 'public', table: t }, () => {
                syncData(); if(currentView === 'global') loadGlobalData();
            }).subscribe();
        });
    }
    window.addEventListener('online', () => { updateStatus(); processQueue(); syncData(); });
})();

function switchLocation(loc) {
    if(currentLocation === loc) return;
    currentLocation = loc;
    localStorage.setItem('app_location', loc);
    inventory = []; transactions = [];
    updateTheme();
    loadLocalData(); 
    syncData();      
    toggleSidebar();
    showToast(`Switched to ${loc === 'METIABRUZ' ? 'Metiabruz' : 'Unsani'}`);
}

function updateTheme() {
    document.body.className = currentLocation === 'METIABRUZ' ? 'theme-met' : 'theme-uns';
    document.getElementById('header-loc').innerText = currentLocation;
    document.getElementById('loc-met').classList.toggle('active', currentLocation === 'METIABRUZ');
    document.getElementById('loc-uns').classList.toggle('active', currentLocation === 'UNSANI');
}

function getStorageKey(key) { return `${currentLocation === 'METIABRUZ' ? 'met' : 'uns'}_${key}`; }

function loadLocalData() {
    try {
        inventory = JSON.parse(localStorage.getItem(getStorageKey('inv')) || '[]');
        transactions = JSON.parse(localStorage.getItem(getStorageKey('tx')) || '[]');
        queue = JSON.parse(localStorage.getItem(getStorageKey('q')) || '[]');
    } catch(e) {}
    renderInventory();
    updateStatus();
}

async function syncData() {
    try {
        const tInv = currentLocation === 'METIABRUZ' ? 'inventory_met' : 'inventory_uns';
        const tTx = currentLocation === 'METIABRUZ' ? 'transactions_met' : 'transactions_uns';

        const { data: invData } = await sbClient.from(tInv).select('*').order('created_at', {ascending:false});
        if(invData) {
            inventory = invData;
            localStorage.setItem(getStorageKey('inv'), JSON.stringify(inventory));
            renderInventory();
        }
        const { data: txData } = await sbClient.from(tTx).select('*').order('created_at', {ascending:false}).limit(1000);
        if(txData) {
            transactions = txData; 
            localStorage.setItem(getStorageKey('tx'), JSON.stringify(transactions));
            if(currentView === 'reports') applyReportFilters();
        }
    } catch(e) {}
}

function updateStatus() {
    const s = document.getElementById('status'), d = document.getElementById('dot');
    if(queue.length > 0) { s.innerText = 'SYNCING'; d.style.background = 'var(--warning)'; }
    else if(navigator.onLine) { s.innerText = 'ONLINE'; d.style.background = 'var(--success)'; }
    else { s.innerText = 'OFFLINE'; d.style.background = 'var(--danger)'; }
}

async function processQueue() {
    if(!navigator.onLine || queue.length === 0) {
        if(queue.length === 0) updateStatus(); // Ensure UI clears
        return;
    }
    const op = queue[0];
    // Force correct table based on current location
    const table = op.table_override || (op.table.includes('inventory') ? (currentLocation==='METIABRUZ'?'inventory_met':'inventory_uns') : (currentLocation==='METIABRUZ'?'transactions_met':'transactions_uns'));
    
    let error;
    if(op.type === 'INSERT') {
        ({ error } = await sbClient.from(table).insert(op.data));
    } else {
        ({ error } = await sbClient.from(table).update(op.data).eq('id', op.id));
    }

    if(!error || error.code === '23505') {
        queue.shift(); localStorage.setItem(getStorageKey('q'), JSON.stringify(queue)); updateStatus(); processQueue(); 
    } else {
        setTimeout(processQueue, 5000);
    }
}

// --- IMPORT LOGIC (SMART PARSER) ---
function handleFileUpload() {
    const input = document.getElementById('fileInput');
    if(!input.files || !input.files[0]) return;
    const file = input.files[0];
    document.getElementById('importLoader').style.display = 'block';
    if (file.name.endsWith('.pdf')) parsePDF(file); else parseExcel(file);
}

function parseExcel(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);
        // Normalize keys
        const rows = json.map(r => {
            let nR = {};
            Object.keys(r).forEach(k => {
                let lower = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                if(lower.includes('design') || lower.includes('particular')) nR['Design'] = r[k];
                else if(lower.includes('22')) nR['22x32'] = r[k];
                else if(lower.includes('34')) nR['34x36'] = r[k];
                else if(lower.includes('16')) nR['16x18'] = r[k];
                else if(lower.includes('26')) nR['26x30'] = r[k];
            });
            return nR;
        });
        importRows(rows);
    };
    reader.readAsArrayBuffer(file);
}

function parsePDF(file) {
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise;
            let allRows = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                let rowMap = {};
                content.items.forEach(item => {
                    const y = Math.round(item.transform[5] / 10) * 10; // Looser Y grouping
                    if(!rowMap[y]) rowMap[y] = [];
                    rowMap[y].push({ str: item.str, x: item.transform[4] });
                });
                Object.values(rowMap).forEach(rowItems => {
                    rowItems.sort((a,b) => a.x - b.x);
                    const strs = rowItems.map(it => it.str.trim()).filter(s => s);
                    // Match line with [DesignName, num, num, num, num]
                    if(strs.length >= 5) {
                        const l = strs.length;
                        if(!isNaN(strs[l-1]) && !isNaN(strs[l-2]) && !isNaN(strs[l-3]) && !isNaN(strs[l-4])) {
                            allRows.push({ 'Design': strs[0], '22x32': strs[l-4], '34x36': strs[l-3], '16x18': strs[l-2], '26x30': strs[l-1] });
                        }
                    }
                });
            }
            importRows(allRows);
        } catch (e) { document.getElementById('importLoader').style.display='none'; showToast("PDF Parse Error","error"); }
    };
    reader.readAsArrayBuffer(file);
}

function importRows(rows) {
    let count = 0;
    const tInv = currentLocation === 'METIABRUZ' ? 'inventory_met' : 'inventory_uns';
    const tTx = currentLocation === 'METIABRUZ' ? 'transactions_met' : 'transactions_uns';

    rows.forEach(r => {
        const dNo = r['Design'] ? r['Design'].toString().toUpperCase().trim() : null;
        if(dNo) {
            const qtys = [ parseInt(r['22x32']||0), parseInt(r['34x36']||0), parseInt(r['16x18']||0), parseInt(r['26x30']||0) ];
            if(!inventory.find(i => i.design === dNo && !i.deleted_at)) {
                const newItem = { id: crypto.randomUUID(), design: dNo, stock: qtys, sold:[0,0,0,0], created_at: new Date().toISOString() };
                inventory.unshift(newItem);
                queue.push({ table_override: tInv, type: 'INSERT', data: newItem });
                queue.push({ table_override: tTx, type: 'INSERT', data: { created_at: new Date().toISOString(), type: 'ADD', design: dNo, customer: 'Import', quantities: qtys, total_qty: qtys.reduce((a,b)=>a+b,0) } });
                count++;
            }
        }
    });
    saveAll(); closeImport(); document.getElementById('importLoader').style.display='none'; showToast(`Imported ${count} to ${currentLocation}`);
}

function openModal(mode) {
    if(mode === 'import') {
        document.getElementById('importOverlay').classList.add('open');
        document.getElementById('import-target').innerText = `Target: ${currentLocation}`;
        toggleSidebar(); return;
    }
    modalMode = mode; currentBatch = [];
    document.getElementById('m-title').innerText = mode === 'add' ? 'Add Stock' : 'Batch Sale';
    document.getElementById('m-customer').style.display = 'block'; 
    document.getElementById('m-customer').value = '';
    document.getElementById('m-design').value = '';
    document.getElementById('batch-container').style.display = 'none';
    updateDropdowns(null);
    document.getElementById('modalOverlay').classList.add('open');
}
function closeImport() { document.getElementById('importOverlay').classList.remove('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.getElementById('suggestions').classList.remove('active'); }

// --- GLOBAL & REPORTS ---
async function loadGlobalData() {
    document.getElementById('global-list').innerHTML = '<div class="empty-state">Loading...</div>';
    const [met, uns] = await Promise.all([
        sbClient.from('inventory_met').select('*').is('deleted_at', null),
        sbClient.from('inventory_uns').select('*').is('deleted_at', null)
    ]);
    const map = new Map();
    (met.data||[]).forEach(i => map.set(i.design, { design: i.design, met: i.stock.map((s,x)=>s-(i.sold[x]||0)), uns: [0,0,0,0] }));
    (uns.data||[]).forEach(i => {
        const v = i.stock.map((s,x)=>s-(i.sold[x]||0));
        if(map.has(i.design)) map.get(i.design).uns = v;
        else map.set(i.design, { design: i.design, met: [0,0,0,0], uns: v });
    });
    globalStockData = Array.from(map.values()).sort((a,b)=>a.design.localeCompare(b.design));
    renderGlobal();
}

function renderGlobal() {
    const list = document.getElementById('global-list');
    const term = document.getElementById('globalSearch').value.toUpperCase();
    list.innerHTML = '';
    globalStockData.filter(i => i.design.includes(term)).forEach(i => {
        const mG = i.met.map(q=>`<div class="g-box">${q}</div>`).join('');
        const uG = i.uns.map(q=>`<div class="g-box">${q}</div>`).join('');
        list.innerHTML += `<div class="global-card"><div class="global-header"><span>#${i.design}</span></div><div class="global-row"><span class="wh-tag wh-met">MET</span><div class="global-grid">${mG}</div></div><div class="global-row"><span class="wh-tag wh-uns">UNS</span><div class="global-grid">${uG}</div></div></div>`;
    });
}

function applyReportFilters() {
    const start = new Date(document.getElementById('rep-start').value); start.setHours(0,0,0,0);
    const end = new Date(document.getElementById('rep-end').value); end.setHours(23,59,59,999);
    const type = document.getElementById('rep-type').value;
    const cust = document.getElementById('rep-cust').value.toUpperCase();
    const des = document.getElementById('rep-design').value.toUpperCase();

    filteredTransactions = transactions.filter(t => {
        const d = new Date(t.created_at);
        return d >= start && d <= end && (type==='ALL'||t.type===type) && (!cust||(t.customer&&t.customer.toUpperCase().includes(cust))) && (!des||t.design.includes(des));
    });
    renderReports();
}

function renderReports() {
    const list = document.getElementById('report-results'); list.innerHTML = '';
    filteredTransactions.forEach(t => {
        const details = t.quantities.map((q,i) => q>0 ? `<span>${sizes[i]}:${q}</span>` : '').join(' ');
        list.innerHTML += `<div class="history-card ${t.type==='SELL'?'sell':'add'}"><div><span class="h-tag ${t.type==='SELL'?'sell':'add'}">${t.type}</span> <b>#${t.design}</b><div style="font-size:11px;margin-top:2px">${details}</div>${t.customer?`<div style="font-size:11px;color:var(--text-muted)">👤 ${t.customer}</div>`:''}</div><div style="font-weight:800">${t.total_qty}</div></div>`;
    });
}

// --- STANDARD FUNCTIONS ---
function renderInventory() {
    const list = document.getElementById('list'); 
    if(!list) return;
    const term = document.getElementById('mainSearch').value.toUpperCase();
    list.innerHTML = '';
    const active = inventory.filter(i => !i.deleted_at);
    document.getElementById('d-stock').innerText = active.reduce((a,c)=>a+c.stock.reduce((x,y)=>x+y,0),0);
    document.getElementById('d-rem').innerText = active.reduce((a,c)=>a+(c.stock.reduce((x,y)=>x+y,0)-c.sold.reduce((x,y)=>x+y,0)),0);
    active.filter(i => i.design.includes(term)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(item => {
        const grid = item.stock.map((s,i) => `<div class="size-item"><div style="font-size:9px;color:var(--text-muted)">${sizes[i]}</div><div style="font-weight:700;color:${(s-(item.sold[i]||0))<5?'var(--danger)':'var(--success)'}">${s-(item.sold[i]||0)}</div></div>`).join('');
        const el = document.createElement('div'); el.className = 'inventory-card';
        el.addEventListener('click', () => openManage(item));
        el.innerHTML = `<div class="card-header"><span style="background:rgba(255,255,255,0.1);color:var(--primary);padding:4px 8px;border-radius:6px;font-weight:700">#${item.design}</span></div><div class="size-grid">${grid}</div>`;
        list.appendChild(el);
    });
}

function handleDesignInput(val) {
    val = val.toUpperCase().trim();
    const box = document.getElementById('suggestions');
    const matches = inventory.filter(i => i.design.startsWith(val) && !i.deleted_at).slice(0,5);
    box.innerHTML = matches.map(m => `<div class="s-item" onclick="selectSuggestion('${m.design}')"><b>${m.design}</b></div>`).join('');
    box.classList.toggle('active', val.length > 0 && matches.length > 0);
    foundItem = inventory.find(i => i.design === val && !i.deleted_at);
    updateDropdowns(foundItem);
}
function selectSuggestion(val) { document.getElementById('m-design').value = val; document.getElementById('suggestions').classList.remove('active'); handleDesignInput(val); }

function updateDropdowns(item) {
    [0,1,2,3].forEach(idx => {
        const s = document.getElementById('s'+idx);
        s.innerHTML = ''; s.disabled = false;
        let inBatch = 0; currentBatch.filter(b => b.design === (item?.design)).forEach(b => inBatch += b.qtys[idx]);
        if(modalMode === 'sell') {
            if(item) {
                const av = item.stock[idx] - (item.sold[idx]||0) - inBatch;
                if(av <= 0) { s.innerHTML='<option value="0">0</option>'; s.disabled=true; }
                else for(let i=0;i<=av;i++) s.innerHTML+=`<option value="${i}">${i}</option>`;
            } else { s.innerHTML='<option value="0">0</option>'; s.disabled=true; }
        } else {
            for(let i=0;i<=100;i++) s.innerHTML+=`<option value="${i}">${i}</option>`;
        }
    });
}

function addToBatch() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    const qtys = [0,1,2,3].map(i => +document.getElementById('s'+i).value);
    if(!dNo || qtys.reduce((a,b)=>a+b,0) === 0) return showToast("Invalid Input", "error");
    if(modalMode === 'sell' && !foundItem) return showToast("Design not found", "error");
    if(modalMode === 'add' && !foundItem && (currentBatch.some(b => b.design === dNo) || inventory.some(i => i.design === dNo && !i.deleted_at))) return showToast("Duplicate Design", "error");
    currentBatch.push({ design: dNo, qtys: qtys, itemRef: foundItem });
    document.getElementById('batch-items').innerHTML = currentBatch.map((b,i) => `<div class="batch-item"><b>#${b.design}</b> <span class="batch-del" onclick="currentBatch.splice(${i},1);addToBatch()">✕</span></div>`).join('');
    document.getElementById('batch-container').style.display = 'block';
    document.getElementById('m-design').value = ''; updateDropdowns(null);
}

function saveBatch() {
    if(currentBatch.length === 0) return;
    const cust = document.getElementById('m-customer').value;
    const tInv = currentLocation === 'METIABRUZ' ? 'inventory_met' : 'inventory_uns';
    const tTx = currentLocation === 'METIABRUZ' ? 'transactions_met' : 'transactions_uns';
    
    currentBatch.forEach(b => {
        let realItem = inventory.find(i => i.design === b.design && !i.deleted_at);
        if(modalMode === 'add') {
            if(realItem) {
                realItem.stock = realItem.stock.map((s,i) => s + b.qtys[i]);
                queue.push({ table_override: tInv, type:'UPDATE', id:realItem.id, data:{stock:realItem.stock} });
            } else {
                const newItem = { id: crypto.randomUUID(), design: b.design, stock: b.qtys, sold:[0,0,0,0], created_at: new Date().toISOString() };
                inventory.unshift(newItem);
                queue.push({ table_override: tInv, type:'INSERT', data:newItem });
            }
        } else {
            realItem.sold = realItem.sold.map((s,i) => (realItem.sold[i]||0) + b.qtys[i]);
            queue.push({ table_override: tInv, type:'UPDATE', id:realItem.id, data:{sold:realItem.sold} });
        }
        queue.push({ table_override: tTx, type:'INSERT', data: { created_at: new Date().toISOString(), type: modalMode==='add'?'ADD':'SELL', design: b.design, customer: cust, quantities: b.qtys, total_qty: b.qtys.reduce((a,x)=>a+x,0) } });
    });
    saveAll(); closeModal(); showToast("Saved");
}

function saveAll() {
    localStorage.setItem(getStorageKey('inv'), JSON.stringify(inventory)); 
    localStorage.setItem(getStorageKey('tx'), JSON.stringify(transactions)); 
    localStorage.setItem(getStorageKey('q'), JSON.stringify(queue));
    renderInventory(); updateStatus(); processQueue();
}

function openManage(item) {
    manageItem = item;
    document.getElementById('man-title').innerText = "Manage #" + item.design;
    [0,1,2,3].forEach(i => document.getElementById('man'+i).value = item.stock[i] - (item.sold[i]||0));
    document.getElementById('manageOverlay').classList.add('open');
}
function closeManage() { document.getElementById('manageOverlay').classList.remove('open'); }
function saveManagement() {
    const newAvails = [0,1,2,3].map(i => +document.getElementById('man'+i).value);
    manageItem.stock = newAvails.map((a,i) => a + (manageItem.sold[i]||0));
    const tInv = currentLocation === 'METIABRUZ' ? 'inventory_met' : 'inventory_uns';
    queue.push({ table_override: tInv, type:'UPDATE', id:manageItem.id, data:{stock:manageItem.stock} });
    saveAll(); closeManage();
}
function deleteItem() {
    if(!confirm("Delete?")) return;
    manageItem.deleted_at = new Date().toISOString();
    const tInv = currentLocation === 'METIABRUZ' ? 'inventory_met' : 'inventory_uns';
    queue.push({ table_override: tInv, type:'UPDATE', id:manageItem.id, data:{deleted_at: manageItem.deleted_at} });
    saveAll(); closeManage();
}

function printStock(type) {
    const printArea = document.getElementById('print-area');
    let items = type === 'global' ? globalStockData : inventory.filter(i => !i.deleted_at);
    let html = `<h2 style="text-align:center">${type==='global'?'Global':currentLocation} Stock</h2><table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:12px;color:#000"><thead><tr><th style="border:1px solid #000;padding:5px">Design</th><th style="border:1px solid #000;padding:5px">Details</th><th style="border:1px solid #000;padding:5px">Total</th></tr></thead><tbody>`;
    items.forEach(i => {
        let det = '', tot = 0;
        if(type==='global') {
            const m = i.met.reduce((a,b)=>a+b,0); const u = i.uns.reduce((a,b)=>a+b,0);
            det = `MET: ${m} | UNS: ${u}`; tot = m + u;
        } else {
            const stk = i.stock.map((s,x)=>s-(i.sold[x]||0));
            det = stk.join(' / '); tot = stk.reduce((a,b)=>a+b,0);
        }
        html += `<tr><td style="border:1px solid #000;padding:5px;text-align:center">${i.design}</td><td style="border:1px solid #000;padding:5px;text-align:center">${det}</td><td style="border:1px solid #000;padding:5px;text-align:center;font-weight:bold">${tot}</td></tr>`;
    });
    html += '</tbody></table>'; printArea.innerHTML = html; window.print();
}

function printReport() {
    const printArea = document.getElementById('print-area');
    let html = `<h2 style="text-align:center">${currentLocation} Report</h2><table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:12px;color:#000"><thead><tr><th>Date</th><th>Type</th><th>Design</th><th>Total</th></tr></thead><tbody>`;
    filteredTransactions.forEach(t => {
        html += `<tr><td style="border:1px solid #000;padding:5px">${new Date(t.created_at).toLocaleDateString()}</td><td style="border:1px solid #000;padding:5px">${t.type}</td><td style="border:1px solid #000;padding:5px">${t.design}</td><td style="border:1px solid #000;padding:5px">${t.total_qty}</td></tr>`;
    });
    html += '</tbody></table>'; printArea.innerHTML = html; window.print();
}

function toggleSidebar() { document.getElementById('sidebarOverlay').classList.toggle('open'); }
function switchView(view) {
    currentView = view; document.getElementById('sidebarOverlay').classList.remove('open');
    document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.getElementById(`view-${view}`).classList.add('active');
    const navItem = document.getElementById(`nav-${view}`);
    if(navItem) navItem.classList.add('active');
    if(view === 'home') renderInventory();
    else if(view === 'global') loadGlobalData();
    else if(view === 'reports') applyReportFilters();
}
function resetApp() { if(confirm("Clear local data & reload?")) { localStorage.clear(); location.reload(); } }
function showToast(msg, type='success') { Toastify({ text: msg, duration: 3000, gravity: "bottom", position: "center", style: { background: type === 'error' ? "var(--danger)" : "var(--success)", borderRadius: "10px" } }).showToast(); }
</script>
