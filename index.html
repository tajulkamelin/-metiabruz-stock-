<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stock Pro Ultimate</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #000000; --card: #1c1c1e; --primary: #0A84FF; --danger: #FF453A;
    --success: #30D158; --text: #FFF; --border: rgba(255,255,255,0.15);
    --glass: rgba(30,30,30,0.85);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; user-select: none; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 120px; }

/* --- HEADER --- */
.header {
    position: sticky; top: 0; z-index: 50; background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); padding: 15px 16px 10px;
}
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
.status-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: inline-block; margin-right: 5px; }
.status-text { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; }

/* --- TABS --- */
.tabs { background: #2C2C2E; padding: 2px; border-radius: 9px; display: flex; margin-bottom: 12px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #8E8E93; border-radius: 7px; transition: 0.2s; }
.tab.active { background: #636366; color: #FFF; }

/* --- SEARCH & SELECT --- */
.bar-row { display: flex; gap: 10px; }
.search-wrap { flex: 1; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 0 10px; display: flex; align-items: center; height: 36px; }
.search-wrap input { background: transparent; border: none; color: #FFF; font-size: 16px; width: 100%; outline: none; margin-left: 8px; }
.btn-select { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 16px; padding: 0 5px; }

/* --- LIST --- */
.list { padding: 10px 16px; }
.card {
    background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
    transition: transform 0.2s;
}
.card:active { transform: scale(0.98); }
.card.selected { border-color: var(--primary); background: rgba(10, 132, 255, 0.1); }

/* Selection Checkbox */
.check-circle { 
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; 
    display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.selection-mode .check-circle { display: flex; }
.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.check-icon { display: none; width: 14px; height: 14px; fill: #FFF; }
.selected .check-icon { display: block; }

/* Grid for Sizes */
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.size-box { background: #2C2C2E; border-radius: 6px; padding: 6px; text-align: center; }
.size-label { font-size: 10px; color: #8E8E93; font-weight: 700; margin-bottom: 2px; }
.size-val { font-size: 14px; font-weight: 700; }
.val-danger { color: var(--danger); }
.val-success { color: var(--success); }

/* --- BOTTOM DOCK --- */
.dock {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass);
    backdrop-filter: blur(30px); border-top: 1px solid var(--border);
    padding: 12px 16px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 100;
}
.btn { height: 50px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--primary); color: #FFF; }
.btn-white { background: #FFF; color: #000; }
.btn-danger { background: var(--danger); color: #FFF; grid-column: span 2; }

/* --- MODAL --- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { background: #1C1C1E; width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px 50px; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.inp-large { width: 100%; background: #2C2C2E; border: 1px solid #333; color: #FFF; padding: 14px; border-radius: 12px; font-size: 18px; margin-bottom: 15px; outline: none; }
.exist-alert { background: rgba(10, 132, 255, 0.15); border: 1px solid var(--primary); color: var(--primary); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
.dropdown { width: 100%; padding: 12px; background: #2C2C2E; color: white; border: 1px solid #333; border-radius: 8px; font-size: 16px; appearance: none; }

/* Icons SVG */
.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="header">
    <div class="top-row">
        <div class="logo">Metiabruz Pro</div>
        <div>
            <span class="status-dot" id="dot"></span>
            <span class="status-text" id="status">CONNECTING...</span>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab active" id="t-active" onclick="setTab('active')">Inventory</div>
        <div class="tab" id="t-trash" onclick="setTab('trash')">Trash</div>
    </div>

    <div class="bar-row">
        <div class="search-wrap">
            <svg class="icon" style="opacity:0.5; width:16px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="search" placeholder="Search Design..." oninput="render()">
        </div>
        <button class="btn-select" id="selBtn" onclick="toggleSelectionMode()">Select</button>
    </div>
</div>

<div class="list" id="list"></div>

<div class="dock" id="dock-normal">
    <button class="btn btn-primary" onclick="openModal('add')">
        <svg class="icon"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Stock
    </button>
    <button class="btn btn-white" onclick="openModal('sell')">
        <svg class="icon"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Sell Item
    </button>
</div>

<div class="dock" id="dock-select" style="display:none;">
    <button class="btn btn-danger" onclick="deleteSelected()">
        <svg class="icon"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete Selected (<span id="selCount">0</span>)
    </button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <div style="width:40px;height:5px;background:#444;border-radius:3px;margin:0 auto 20px;"></div>
        <h2 id="m-title" style="margin:0 0 15px 0;">Entry</h2>
        
        <input id="m-design" type="text" class="inp-large" placeholder="Enter Design Number" oninput="checkDuplicate(this.value)">
        
        <div id="m-alert" class="exist-alert"></div>

        <div class="size-grid" style="margin-bottom:20px;">
            <div><div class="size-label">22x32</div><select id="s0" class="dropdown"></select></div>
            <div><div class="size-label">34x36</div><select id="s1" class="dropdown"></select></div>
            <div><div class="size-label">16x18</div><select id="s2" class="dropdown"></select></div>
            <div><div class="size-label">26x30</div><select id="s3" class="dropdown"></select></div>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="submitModal()">Confirm</button>
        <button class="btn" style="width:100%; margin-top:10px; background:transparent; color:#888;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
// --- CONFIG ---
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
const SB_KEY = 'sb_publishable_CkKk1cjkoS1XvBv8zldlcw_1gjt6Y2S'; // Replace with yours if different
const supabase = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32", "34x36", "16x18", "26x30"];

// --- STATE ---
let inventory = [];
let currentTab = 'active';
let selectionMode = false;
let selectedIds = new Set();
let modalMode = 'add'; // 'add' or 'sell'

// --- INIT ---
(async function init() {
    updateStatus('Connecting...', 'danger');
    await fetchInventory();
    
    // Realtime Subscription
    supabase.channel('public:inventory')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
        console.log('Realtime change:', payload);
        handleRealtime(payload);
    })
    .subscribe((status) => {
        if (status === 'SUBSCRIBED') updateStatus('ONLINE', 'success');
    });

    // Populate Dropdowns 0-100
    const opts = Array.from({length: 101}, (_, i) => `<option value="${i}">${i}</option>`).join('');
    [0,1,2,3].forEach(i => document.getElementById('s'+i).innerHTML = opts);
})();

// --- LOGIC ---

async function fetchInventory() {
    const { data, error } = await supabase.from('inventory').select('*').order('created_at', { ascending: false });
    if (!error) {
        inventory = data;
        render();
    }
}

function handleRealtime(payload) {
    const { eventType, new: newItem, old: oldItem } = payload;
    if (eventType === 'INSERT') inventory.unshift(newItem);
    if (eventType === 'UPDATE') {
        const idx = inventory.findIndex(i => i.id === newItem.id);
        if (idx > -1) inventory[idx] = newItem;
    }
    // We handle Soft Delete via UPDATE (deleted_at), hard delete via DELETE
    render(); 
}

function updateStatus(msg, type) {
    const el = document.getElementById('status');
    const dot = document.getElementById('dot');
    el.innerText = msg;
    dot.style.background = `var(--${type})`;
}

// --- RENDER ---
function render() {
    const list = document.getElementById('list');
    const term = document.getElementById('search').value.toUpperCase();
    list.innerHTML = '';

    const filtered = inventory.filter(item => {
        const matchesTab = currentTab === 'active' ? !item.deleted_at : !!item.deleted_at;
        const matchesSearch = item.design.toUpperCase().includes(term);
        return matchesTab && matchesSearch;
    });

    filtered.forEach(item => {
        const el = document.createElement('div');
        const isSel = selectedIds.has(item.id);
        el.className = `card ${isSel ? 'selected' : ''}`;
        el.onclick = () => handleCardClick(item.id);

        let stockHTML = '';
        item.stock.forEach((s, i) => {
            const left = s - item.sold[i];
            const color = left < 5 ? 'val-danger' : 'val-success';
            stockHTML += `
                <div class="size-box">
                    <div class="size-label">${sizes[i]}</div>
                    <div class="size-val ${color}">${left}</div>
                </div>
            `;
        });

        el.innerHTML = `
            <div class="check-circle">
                <svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div style="flex:1">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="font-weight:900; font-size:18px; color:var(--primary);"># ${item.design}</span>
                    <span style="font-size:11px; color:#666;">${currentTab==='trash'?'DELETED':''}</span>
                </div>
                <div class="size-grid">${stockHTML}</div>
            </div>
        `;
        list.appendChild(el);
    });
}

// --- SELECTION LOGIC ---
function toggleSelectionMode() {
    selectionMode = !selectionMode;
    selectedIds.clear();
    document.body.classList.toggle('selection-mode', selectionMode);
    document.getElementById('selBtn').innerText = selectionMode ? 'Done' : 'Select';
    document.getElementById('dock-normal').style.display = selectionMode ? 'none' : 'grid';
    document.getElementById('dock-select').style.display = selectionMode ? 'grid' : 'none';
    render();
}

function handleCardClick(id) {
    if (selectionMode) {
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        document.getElementById('selCount').innerText = selectedIds.size;
        render();
    } else {
        // If not selecting, maybe edit? Or do nothing?
        // User asked for "Edit" in prompt 5, implied by duplicate handling.
    }
}

async function deleteSelected() {
    if (selectedIds.size === 0) return;
    if (!confirm('Move items to Trash?')) return;

    const ids = Array.from(selectedIds);
    const updates = { deleted_at: new Date().toISOString() };
    
    // Optimistic UI
    inventory.forEach(i => { if (selectedIds.has(i.id)) i.deleted_at = updates.deleted_at; });
    render();

    const { error } = await supabase.from('inventory').update(updates).in('id', ids);
    if (error) alert("Sync Error");
    
    toggleSelectionMode();
}

// --- MODAL & DUPLICATE LOGIC ---
function openModal(mode) {
    modalMode = mode;
    document.getElementById('m-title').innerText = mode === 'add' ? 'Add Stock' : 'Sell Item';
    document.getElementById('m-design').value = '';
    document.getElementById('m-alert').style.display = 'none';
    [0,1,2,3].forEach(i => document.getElementById('s'+i).value = 0);
    document.getElementById('modal').classList.add('open');
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
}

function checkDuplicate(val) {
    const existing = inventory.find(i => i.design.toUpperCase() === val.trim().toUpperCase() && !i.deleted_at);
    const alertBox = document.getElementById('m-alert');
    
    if (existing) {
        alertBox.style.display = 'block';
        const msg = modalMode === 'add' ? 'Adding to Existing Stock' : 'Selling from Stock';
        
        // Show current levels
        const stocks = existing.stock.map((s, idx) => `${sizes[idx]}:${s - existing.sold[idx]}`).join(' | ');
        alertBox.innerHTML = `<strong>${msg}:</strong> Design #${existing.design} found.<br><span style="font-size:11px; opacity:0.8">Current: ${stocks}</span>`;
    } else {
        alertBox.style.display = 'none';
        if (modalMode === 'sell') {
            alertBox.style.display = 'block';
            alertBox.innerHTML = `<span style="color:var(--danger)">⚠ Design not found! Cannot sell.</span>`;
        }
    }
}

async function submitModal() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    if (!dNo) return alert("Enter Design Number");

    const qtys = [0,1,2,3].map(i => parseInt(document.getElementById('s'+i).value) || 0);
    if (qtys.every(q => q === 0)) return alert("Select Quantity");

    const existing = inventory.find(i => i.design === dNo && !i.deleted_at);

    if (modalMode === 'add') {
        if (existing) {
            // Update Existing
            const newStock = existing.stock.map((s, i) => s + qtys[i]);
            const { error } = await supabase.from('inventory').update({ stock: newStock }).eq('id', existing.id);
        } else {
            // Create New
            const newItem = {
                design: dNo,
                stock: qtys,
                sold: [0,0,0,0],
                deleted_at: null
            };
            const { error } = await supabase.from('inventory').insert(newItem);
        }
    } else {
        // Sell
        if (!existing) return alert("Design does not exist!");
        const newSold = existing.sold.map((s, i) => s + qtys[i]);
        // Check negatives (optional, strict mode)
        /* for(let i=0; i<4; i++) {
             if (existing.stock[i] - newSold[i] < 0) return alert(`Not enough stock for ${sizes[i]}`);
        }
        */
        const { error } = await supabase.from('inventory').update({ sold: newSold }).eq('id', existing.id);
    }

    closeModal();
    // Realtime subscription will handle the UI update
}

function setTab(t) {
    currentTab = t;
    document.getElementById('t-active').className = t === 'active' ? 'tab active' : 'tab';
    document.getElementById('t-trash').className = t === 'trash' ? 'tab active' : 'tab';
    render();
}

</script>
</body>
</html>
