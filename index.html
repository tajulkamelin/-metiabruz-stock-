<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Metiabruz Stock</title>

<style>
:root{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;
  --border:#334155;--primary:#0ea5e9;--danger:#ef4444;--remain:#10b981;
  --input-bg:#020617;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  padding:12px;padding-bottom:120px;
}
.header,.search-box,.item-card,.modal-content{
  background:var(--card);border-radius:12px;padding:14px;
}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.summary-card{background:var(--input-bg);padding:10px;border-radius:8px;border:1px solid var(--border);text-align:center}
.summary-card label{font-size:10px;color:var(--muted);text-transform:uppercase}
.summary-card .value{font-size:20px;font-weight:700;color:var(--primary)}
.summary-card.green .value{color:var(--remain)}

/* 🔽 COMPACT SEARCH BAR */
.search-box.compact{
  margin:16px 0;
  display:grid;
  grid-template-columns:1fr auto auto auto auto;
  gap:6px;
}
.search-box.compact input,
.search-box.compact select,
.search-box.compact button{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--input-bg);
  color:var(--text);
  font-size:14px;
}

.inventory-list{display:flex;flex-direction:column;gap:14px}
.item-card{padding:12px}
.item-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  border-bottom:1px solid var(--border);
  padding-bottom:6px
}
.design-name{font-size:16px;font-weight:800;color:var(--primary)}
.col-headers,.size-row{display:grid;grid-template-columns:60px 1fr 1fr 1fr;gap:6px;align-items:center}
.col-headers{font-size:10px;color:var(--muted);margin-bottom:4px;text-align:center}
.size-label{font-size:12px;color:var(--muted)}

.qty-input{
  text-align:center;
  font-weight:600;
  height:34px;
  font-size:14px;
}
.input-remain{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(16,185,129,.1);
  color:var(--remain);
  font-weight:700;
  border-radius:6px;
}

.action-buttons{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);padding:8px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  border-top:1px solid var(--border)
}
.btn{padding:8px;border:none;border-radius:8px;font-weight:600;font-size:10px}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff;border-radius:6px;padding:4px 10px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:99}
.modal.active{display:flex}
.modal-content{width:90%;max-width:380px}
.size-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

@media print{
  body{background:#fff!important;color:#000!important}
  .header,.search-box,.action-buttons,.btn-danger,input[type=checkbox]{display:none!important}
  .item-card{page-break-inside:avoid;border:1px solid #000;background:#fff}
  input{border:none!important;background:transparent!important;color:#000!important;text-align:center}
}
</style>
</head>

<body>

<div class="header">
  <div style="display:flex;justify-content:space-between">
    <h2>📦 Stock</h2>
    <div id="statusIndicator" style="font-size:12px;color:var(--muted)">Offline</div>
  </div>
  <div class="summary">
    <div class="summary-card"><label>Total Stock</label><div class="value" id="totalStock">0</div></div>
    <div class="summary-card"><label>Total Sold</label><div class="value" id="totalSold">0</div></div>
    <div class="summary-card green"><label>Remaining</label><div class="value" id="totalRemaining">0</div></div>
    <div class="summary-card"><label>Designs</label><div class="value" id="designCount">0</div></div>
  </div>
</div>

<!-- ✅ SINGLE COMPACT CONTROL BAR -->
<div class="search-box compact">
  <input id="searchInput" placeholder="🔍 Search Design..." onkeyup="render()">
  <select onchange="setSort(this.value)">
    <option value="recent">Recent</option>
    <option value="asc">A→Z</option>
    <option value="desc">Z→A</option>
  </select>
  <button onclick="toggleSelectMode()">☑︎</button>
  <button onclick="deleteSelected()">🗑</button>
  <button onclick="resetAll()">⟳</button>
</div>

<div class="inventory-list" id="inventoryList"></div>

<div class="action-buttons">
  <button class="btn btn-primary" onclick="openAdd()">➕ Add</button>
  <button class="btn btn-secondary" onclick="printInventory()">🖨 Print</button>
  <button class="btn btn-secondary" onclick="fetchData()">🔄 Sync</button>
  <button class="btn btn-secondary" onclick="saveCache()">💾 Save</button>
</div>

<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-content">
    <h3>Add Design</h3><br>
    <input id="designInput" placeholder="Design Number">
    <div class="size-inputs">
      <input id="s0" placeholder="22x32" type="number">
      <input id="s1" placeholder="34x36" type="number">
      <input id="s2" placeholder="16x18" type="number">
      <input id="s3" placeholder="26x30" type="number">
    </div><br>
    <button class="btn btn-primary" onclick="addDesign()">Save</button>
  </div>
</div>

<!-- 🔒 YOUR EXISTING JS (UNCHANGED) -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* YOUR JS IS 100% UNCHANGED — intentionally */
</script>

</body>
</html>
