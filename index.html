<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Metiabruz Stock Pro</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #000000;
    --card: #1C1C1E; 
    --card-press: #2C2C2E;
    --primary: #0A84FF; 
    --danger: #FF453A;
    --success: #32D74B; 
    --text: #FFFFFF; 
    --text-sub: #8E8E93;
    --border: rgba(255,255,255,0.15);
    --glass: rgba(28,28,30,0.85);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; user-select: none; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 140px; overflow-x: hidden; }

/* --- HEADER --- */
.header {
    position: sticky; top: 0; z-index: 50; background: var(--glass);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-bottom: 0.5px solid var(--border); padding: 50px 16px 12px;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.status-pill { 
    font-size: 11px; font-weight: 700; background: #333; 
    padding: 5px 10px; border-radius: 20px; color: #888; display: flex; align-items: center; gap: 6px;
    transition: 0.3s;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); transition: 0.3s; }

/* --- TABS --- */
.tabs { background: #2C2C2E; padding: 2px; border-radius: 10px; display: flex; margin-bottom: 12px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #8E8E93; border-radius: 8px; transition: 0.2s; }
.tab.active { background: #636366; color: #FFF; }

/* --- SEARCH & SELECT --- */
.search-row { display: flex; gap: 12px; align-items: center; }
.search-wrap { 
    flex: 1; background: rgba(255,255,255,0.1); border-radius: 10px; height: 40px; 
    display: flex; align-items: center; padding: 0 10px; 
}
.search-wrap input { 
    flex: 1; background: transparent; border: none; color: #FFF; 
    font-size: 17px; margin-left: 8px; outline: none; user-select: text; 
}
.btn-select { 
    color: var(--primary); font-weight: 600; font-size: 17px; 
    background: none; border: none; padding: 0 5px; cursor: pointer; 
}

/* --- LIST --- */
.list { padding: 10px 16px; min-height: 60vh; }
.card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    border: 0.5px solid var(--border); display: flex; align-items: center; gap: 14px;
    transition: transform 0.2s, background 0.2s;
}
.card:active { transform: scale(0.98); background: var(--card-press); }
.card.selected { border-color: var(--primary); background: rgba(10, 132, 255, 0.15); }

/* Checkbox (iOS Style) */
.check-circle { 
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; 
    display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.selection-mode .check-circle { display: flex; }
.selected .check-circle { background: var(--primary); border-color: var(--primary); }
.check-icon { width: 14px; height: 14px; stroke: #FFF; stroke-width: 3; fill: none; display: none; }
.selected .check-icon { display: block; }

/* Content */
.card-content { flex: 1; }
.card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.design-id { font-weight: 800; font-size: 20px; color: var(--text); letter-spacing: 0.5px; }
.design-meta { font-size: 11px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }

/* Size Grid */
.size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.size-box { background: #2C2C2E; border-radius: 8px; padding: 6px 0; text-align: center; }
.size-lbl { font-size: 10px; color: #888; font-weight: 700; margin-bottom: 2px; }
.size-val { font-size: 15px; font-weight: 700; color: #FFF; }
.val-low { color: var(--danger); }
.val-ok { color: var(--success); }

/* --- DOCK --- */
.dock {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass);
    backdrop-filter: blur(30px); border-top: 0.5px solid var(--border);
    padding: 12px 16px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 100;
}
.btn { height: 54px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.btn:active { transform: scale(0.96); opacity: 0.8; }
.btn-primary { background: var(--primary); color: #FFF; }
.btn-glass { background: rgba(255,255,255,0.1); color: #FFF; backdrop-filter: blur(10px); }
.btn-danger { background: var(--danger); color: #FFF; grid-column: span 2; }

/* --- MODAL --- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { background: #1C1C1E; width: 100%; border-radius: 30px 30px 0 0; padding: 24px 20px 50px; animation: slideUp 0.35s cubic-bezier(0.15, 1, 0.3, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.inp-large { 
    width: 100%; background: #2C2C2E; border: 1px solid #333; color: #FFF; 
    padding: 16px; border-radius: 14px; font-size: 20px; margin-bottom: 15px; outline: none; user-select: text; 
}
.alert-box { 
    background: rgba(10,132,255,0.15); border: 1px solid var(--primary); color: var(--primary); 
    padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 20px; display: none; 
}
.dd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
.dropdown-wrap label { display: block; font-size: 11px; font-weight: 700; color: #888; margin-bottom: 5px; }
.dropdown { 
    width: 100%; padding: 12px; background: #2C2C2E; color: #FFF; 
    border: 1px solid #333; border-radius: 10px; font-size: 16px; appearance: none; 
}

/* Icons */
.icon { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="logo">Metiabruz Pro</div>
        <div class="status-pill">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">CONNECTING...</span>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab active" id="tab-active" onclick="switchTab('active')">Inventory</div>
        <div class="tab" id="tab-trash" onclick="switchTab('trash')">Trash</div>
    </div>

    <div class="search-row">
        <div class="search-wrap">
            <svg class="icon" style="opacity:0.5; width:18px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="search" placeholder="Search Design..." oninput="render()">
        </div>
        <button class="btn-select" id="selBtn" onclick="toggleSelectMode()">Select</button>
    </div>
</div>

<div class="list" id="list"></div>

<div class="dock" id="dock-main">
    <button class="btn btn-primary" onclick="openModal('add')">
        <svg class="icon"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Stock
    </button>
    <button class="btn btn-glass" onclick="openModal('sell')">
        <svg class="icon"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Sell Item
    </button>
</div>

<div class="dock" id="dock-delete" style="display:none">
    <button class="btn btn-danger" onclick="deleteSelected()">
        <svg class="icon"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete Selected (<span id="selCount">0</span>)
    </button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal" onclick="event.stopPropagation()">
        <div style="width:40px;height:5px;background:#444;border-radius:3px;margin:0 auto 20px;"></div>
        <h2 id="modalTitle" style="margin:0 0 15px 0;">Entry</h2>
        
        <input id="m-design" type="text" class="inp-large" placeholder="Design Number (e.g., 501)" oninput="checkDuplicate(this.value)">
        
        <div id="m-alert" class="alert-box"></div>

        <div class="dd-grid">
            <div class="dropdown-wrap"><label>22x32</label><select id="s0" class="dropdown"></select></div>
            <div class="dropdown-wrap"><label>34x36</label><select id="s1" class="dropdown"></select></div>
            <div class="dropdown-wrap"><label>16x18</label><select id="s2" class="dropdown"></select></div>
            <div class="dropdown-wrap"><label>26x30</label><select id="s3" class="dropdown"></select></div>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="submitModal()">Confirm</button>
        <button class="btn" style="width:100%; margin-top:10px; background:none; color:#888;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
// --- YOUR KEYS (CORRECTED) ---
const SB_URL = 'https://yhlfqpiwevsehlgbhxtk.supabase.co';
// Fixed the capitalization error: 'E' -> 'e'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobGZxcGl3ZXZzZWhsZ2JoeHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mjc1ODMsImV4cCI6MjA4NTUwMzU4M30.UX-6NXiJNg6EywD7gIPjla7l5_Koq0UbpuFyENIKOaM';

const supabase = supabase.createClient(SB_URL, SB_KEY);
const sizes = ["22x32", "34x36", "16x18", "26x30"];
let inventory = [];
let currentTab = 'active';
let isSelection = false;
let selectedIds = new Set();
let modalMode = 'add';

// --- INIT ---
(async function init() {
    updateStatus('CONNECTING...', 'danger');
    await fetchData();

    // Populate Dropdowns (0-100)
    const opts = `<option value="0">0</option>` + Array.from({length: 100}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
    [0,1,2,3].forEach(i => document.getElementById('s'+i).innerHTML = opts);

    // Realtime Sync
    supabase.channel('public:inventory')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
        const { eventType, new: newItem } = payload;
        if (eventType === 'INSERT') inventory.unshift(newItem);
        if (eventType === 'UPDATE') {
            const idx = inventory.findIndex(x => x.id === newItem.id);
            if (idx > -1) inventory[idx] = newItem;
        }
        // Deletes handled by UPDATE to deleted_at
        render();
    })
    .subscribe((status) => {
        if (status === 'SUBSCRIBED') updateStatus('ONLINE', 'success');
    });
})();

async function fetchData() {
    const { data, error } = await supabase.from('inventory').select('*').order('created_at', {ascending:false});
    if (error) {
        updateStatus('DB ERROR', 'danger');
        console.error(error);
    } else {
        inventory = data;
        render();
    }
}

function updateStatus(msg, type) {
    document.getElementById('statusText').innerText = msg;
    document.getElementById('statusDot').style.background = `var(--${type})`;
}

// --- RENDER ---
function render() {
    const list = document.getElementById('list');
    const term = document.getElementById('search').value.toUpperCase();
    list.innerHTML = '';

    const filtered = inventory.filter(i => {
        const isTrash = !!i.deleted_at;
        if (currentTab === 'active' && isTrash) return false;
        if (currentTab === 'trash' && !isTrash) return false;
        return i.design.toUpperCase().includes(term);
    });

    filtered.forEach(item => {
        const el = document.createElement('div');
        const isSel = selectedIds.has(item.id);
        el.className = `card ${isSel ? 'selected' : ''}`;
        el.onclick = () => handleCardTap(item.id);

        let stockHTML = '';
        item.stock.forEach((s, idx) => {
            const left = s - (item.sold[idx] || 0);
            const color = left < 5 ? 'val-low' : 'val-ok';
            stockHTML += `
                <div class="size-box">
                    <div class="size-lbl">${sizes[idx]}</div>
                    <div class="size-val ${color}">${left}</div>
                </div>
            `;
        });

        el.innerHTML = `
            <div class="check-circle"><svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div class="card-content">
                <div class="card-header">
                    <span class="design-id"># ${item.design}</span>
                    <span class="design-meta">${currentTab==='trash' ? 'DELETED' : ''}</span>
                </div>
                <div class="size-grid">${stockHTML}</div>
            </div>
        `;
        list.appendChild(el);
    });
}

// --- LOGIC ---
function toggleSelectMode() {
    isSelection = !isSelection;
    selectedIds.clear();
    document.body.classList.toggle('selection-mode', isSelection);
    document.getElementById('selBtn').innerText = isSelection ? 'Done' : 'Select';
    document.getElementById('dock-main').style.display = isSelection ? 'none' : 'grid';
    document.getElementById('dock-delete').style.display = isSelection ? 'grid' : 'none';
    render();
}

function handleCardTap(id) {
    if (isSelection) {
        if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
        document.getElementById('selCount').innerText = selectedIds.size;
        render();
    }
}

async function deleteSelected() {
    if (selectedIds.size === 0) return;
    if (!confirm("Move selected to Trash?")) return;
    
    const ids = Array.from(selectedIds);
    const now = new Date().toISOString();

    // Instant UI update
    inventory.forEach(i => { if(selectedIds.has(i.id)) i.deleted_at = now; });
    render();

    // Server Sync
    await supabase.from('inventory').update({ deleted_at: now }).in('id', ids);
    toggleSelectMode();
}

// --- MODAL & DUPLICATES ---
function openModal(m) {
    modalMode = m;
    document.getElementById('modalTitle').innerText = m === 'add' ? 'Add Stock' : 'Sell Item';
    document.getElementById('m-design').value = '';
    document.getElementById('m-alert').style.display = 'none';
    [0,1,2,3].forEach(i => document.getElementById('s'+i).value = 0);
    document.getElementById('modal').classList.add('open');
}

function checkDuplicate(val) {
    const term = val.trim().toUpperCase();
    const found = inventory.find(i => i.design === term && !i.deleted_at);
    const alert = document.getElementById('m-alert');
    
    if (found) {
        alert.style.display = 'block';
        alert.innerHTML = `<strong>Found Existing:</strong><br>Adding to stock for #${found.design}`;
    } else {
        alert.style.display = 'none';
        if (modalMode === 'sell') {
            alert.style.display = 'block';
            alert.innerHTML = `<strong>New Design:</strong><br>Cannot sell from empty stock.`;
        }
    }
}

async function submitModal() {
    const dNo = document.getElementById('m-design').value.trim().toUpperCase();
    const qtys = [0,1,2,3].map(i => +document.getElementById('s'+i).value);
    
    if (!dNo) return alert("Enter Design Number");
    if (qtys.every(q => q === 0)) return alert("Select at least one quantity");

    const existing = inventory.find(i => i.design === dNo && !i.deleted_at);

    if (modalMode === 'add') {
        if (existing) {
            const newStock = existing.stock.map((s,i) => s + qtys[i]);
            await supabase.from('inventory').update({ stock: newStock }).eq('id', existing.id);
        } else {
            await supabase.from('inventory').insert({ 
                design: dNo, stock: qtys, sold: [0,0,0,0], deleted_at: null 
            });
        }
    } else {
        if (!existing) return alert("Design not found!");
        const newSold = existing.sold.map((s,i) => (s||0) + qtys[i]);
        await supabase.from('inventory').update({ sold: newSold }).eq('id', existing.id);
    }
    closeModal();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function switchTab(t) { currentTab = t; document.getElementById('tab-active').className=t==='active'?'tab active':'tab'; document.getElementById('tab-trash').className=t==='trash'?'tab active':'tab'; render(); }
</script>
</body>
</html>
